<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Digital - RH Soul</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --cor-bg-1: #001529;
            --cor-bg-2: #003366;
            --cor-card: rgba(0, 30, 60, 0.7);
            --cor-acento: #4fc3f7;
            --cor-texto: #ffffff;
            --cor-texto-sec: #a6b0cf;
            --cor-sucesso: #20c997;
            --cor-perigo: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, var(--cor-bg-1) 0%, var(--cor-bg-2) 100%); 
            color: var(--cor-texto); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            overflow-x: hidden;
        }

        .container { 
            background: var(--cor-card); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(79, 195, 247, 0.3); 
            border-radius: 20px; 
            padding: 35px 25px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            max-width: 480px; 
            width: 100%; 
            text-align: center; 
            position: relative;
            z-index: 10;
        }

        .logo { 
            width: 90px; 
            margin-bottom: 20px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); 
        }

        h2 { 
            font-family: 'Montserrat', sans-serif; 
            color: var(--cor-texto); 
            margin-bottom: 20px; 
            font-size: 1.5rem; 
            letter-spacing: -0.5px;
        }

        .info-box {
            background: rgba(79, 195, 247, 0.05);
            border-left: 4px solid var(--cor-acento);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .info-box span { display: block; color: var(--cor-texto-sec); font-size: 0.85rem; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;}
        .info-box strong { color: var(--cor-acento); font-size: 1.15rem; }

        p { color: var(--cor-texto-sec); font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; }

        #signature-pad { 
            background: #ffffff; 
            border: 2px dashed var(--cor-acento); 
            border-radius: 12px; 
            width: 100%; 
            height: 200px; 
            touch-action: none; 
            margin-bottom: 20px; 
            cursor: crosshair;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        #signature-pad:hover { border-color: var(--cor-sucesso); }

        .btn { 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.05rem; 
            width: 100%; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 12px; 
            border: none; 
            text-decoration: none; 
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }

        .btn-primary { 
            background: rgba(79, 195, 247, 0.1); 
            border: 1px solid rgba(79, 195, 247, 0.3); 
            color: var(--cor-acento); 
        }
        .btn-primary:hover { 
            background: rgba(79, 195, 247, 0.2); 
            box-shadow: 0 5px 15px rgba(79, 195, 247, 0.2); 
        }

        .btn-success { 
            background: linear-gradient(135deg, #20c997 0%, #128c7e 100%); 
            color: #fff; 
            box-shadow: 0 5px 15px rgba(32, 201, 151, 0.3); 
            text-transform: uppercase;
        }
        .btn-success:hover { box-shadow: 0 8px 20px rgba(32, 201, 151, 0.4); }
        .btn-success:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; background: #555; }

        .btn-secondary { 
            background: rgba(255, 77, 77, 0.1); 
            border: 1px solid rgba(255, 77, 77, 0.3); 
            color: var(--cor-perigo); 
            padding: 12px;
            font-size: 0.9rem;
        }
        .btn-secondary:hover { background: var(--cor-perigo); color: #fff; }

        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--cor-bg-1); 
            color: #fff; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 1000; 
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="margin-bottom: 20px; color: var(--cor-acento);"></i>
        <h2 style="font-family: 'Montserrat', sans-serif; font-size: 1.2rem;">Acessando documento seguro...</h2>
    </div>

    <div class="container hidden" id="conteudo-principal">
        
        <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo RH" class="logo" id="img-logo-topo">
        
        <h2 id="txt-titulo">Assinatura Digital</h2>
        
        <div class="info-box">
            <span><i class="fa-solid fa-user-check"></i> Colaborador(a):</span>
            <strong id="txt-nome">Carregando...</strong>
        </div>

        <p>Verifique o conteúdo do seu documento no botão abaixo e, em seguida, assine no quadro em branco.</p>

        <a id="btn-ver-pdf" href="#" target="_blank" class="btn btn-primary">
            <i class="fa-solid fa-file-pdf"></i> Ler Documento Original
        </a>

        <div style="margin: 30px 0 10px 0;">
            <h4 style="color: var(--cor-acento); margin-bottom: 15px; font-weight: 500; font-size: 1rem;"><i class="fa-solid fa-pen-nib"></i> Assine com o dedo no quadro abaixo:</h4>
            
            <canvas id="signature-pad"></canvas>
            
            <button class="btn btn-secondary" onclick="signaturePad.clear()">
                <i class="fa-solid fa-eraser"></i> Limpar e Refazer Assinatura
            </button>
            
            <button class="btn btn-success" id="btn-confirmar" onclick="processarAssinaturaNoPDF()" style="margin-top: 20px;">
                <i class="fa-solid fa-check-double"></i> Finalizar Assinatura
            </button>
        </div>
    </div>

    <script>
       // 1. Captura o token da URL logo de cara
const urlParamsToken = new URLSearchParams(window.location.search);
const tokenCracha = urlParamsToken.get('token') || '';

// 2. Cria a conexão passando o "crachá" oculto no cabeçalho
const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: {
        headers: {
            'x-doc-token': tokenCracha // 🛡️ A catraca do banco de dados vai ler isso aqui!
        }
    }
});

        let dadosDoc = null;
        let signaturePad = null;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function inicializar() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const { data, error } = await supabaseClient.from('documentos_mensais').select('*').eq('token', token).single();

            if (error || !data) {
                document.getElementById('loading-screen').innerHTML = '<i class="fa-solid fa-link-slash fa-3x" style="color: #ff4d4d; margin-bottom: 15px;"></i><h2 style="font-size:1.2rem;">Link inválido ou expirado.</h2>'; return;
            }

            if (data.status === 'Assinado') {
                document.getElementById('loading-screen').innerHTML = '<i class="fa-solid fa-circle-check fa-4x" style="color:#20c997; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(32, 201, 151, 0.4));"></i><h2 style="font-size:1.4rem;">Este documento já foi assinado!</h2><p style="color:#a6b0cf; margin-top:10px;">Você já pode fechar esta tela.</p>'; return;
            }

            dadosDoc = data;
    
    // 👇 COLOQUE ESSA LÓGICA AQUI 👇
    const linkLogoSoul = 'https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png';
    const linkLogoVillac = 'https://gozgames.neocities.org/LOGO%20VILLAC%20SEM%20FUNDO%20(1).png';

    let urlLogoReal = linkLogoSoul; // Padrão é Soul
    if (data.empresa && data.empresa.toUpperCase().includes('VILLAC')) {
        urlLogoReal = linkLogoVillac; // Troca se for Villac
    }
    document.getElementById('img-logo-topo').src = urlLogoReal;
    // 👆 FIM DA LÓGICA 👇
            document.getElementById('txt-nome').innerText = data.nome;
            document.getElementById('txt-titulo').innerText = `Assinar ${data.tipo_documento}`;
            document.getElementById('btn-ver-pdf').href = data.documento_pdf;

            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('conteudo-principal').classList.remove('hidden');

            const canvas = document.getElementById('signature-pad');
            signaturePad = new SignaturePad(canvas, { penColor: "rgb(0, 35, 71)" });

            function resizeCanvas() {
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                canvas.getContext("2d").scale(ratio, ratio);
                signaturePad.clear();
            }
            window.onresize = resizeCanvas;
            resizeCanvas();
        }

        async function processarAssinaturaNoPDF() {
            if (signaturePad.isEmpty()) { alert("Por favor, realize a sua assinatura no quadro em branco."); return; }

            const btn = document.getElementById('btn-confirmar');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando assinatura...';
            btn.disabled = true;

            try {
                // 1. Baixa o PDF original
                const response = await fetch(dadosDoc.documento_pdf);
                const pdfBytesOriginal = await response.arrayBuffer();

                // 2. Carrega o documento no pdf-lib
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytesOriginal);
                const pages = pdfDoc.getPages();
                const lastPage = pages[pages.length - 1]; 
                const { width, height } = lastPage.getSize();
                
                const signatureImage = await pdfDoc.embedPng(signaturePad.toDataURL());
                const sigDims = signatureImage.scale(0.12);

                // 3. Prepara o Selo Digital
                const agora = new Date();
                const dataFormatada = agora.toLocaleDateString('pt-BR');
                const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const textoSelo = `Assinado digitalmente em ${dataFormatada} às ${horaFormatada}`;

                // 4. LÓGICA DO RADAR: Achar a posição exata da palavra "Colaborador"
                let posX = (width / 2) - (sigDims.width / 2) + 130; 
                let posY = 12; 

                const tipoDoc = dadosDoc.tipo_documento.toUpperCase();

                if (tipoDoc.includes("PONTO")) {
                    try {
                        const loadingTask = pdfjsLib.getDocument({ data: pdfBytesOriginal });
                        const pdfJsDoc = await loadingTask.promise;
                        const pdfPage = await pdfJsDoc.getPage(pdfJsDoc.numPages); 
                        const textContent = await pdfPage.getTextContent();
                        
                        for (let i = textContent.items.length - 1; i >= 0; i--) {
                            const item = textContent.items[i];
                            
                            if (item.str.toUpperCase().includes('COLABORADOR') || item.str.includes('_____')) {
                                posX = item.transform[4] - (sigDims.width / 4); 
                                posY = item.transform[5] + 15; 
                                break; 
                            }
                        }
                    } catch(e) {
                        console.warn("Radar falhou, usando posição padrão para o Ponto.", e);
                        posX = 150; 
                        posY = 150;
                    }
                }

                // Desenha a Assinatura e o Selo
                lastPage.drawImage(signatureImage, { x: posX, y: posY, width: sigDims.width, height: sigDims.height });
                lastPage.drawText(textoSelo, { x: posX - 10, y: posY - 8, size: 6.5, color: PDFLib.rgb(0.4, 0.4, 0.4) });

                // 5. Salva o novo PDF gerado
                const pdfBytesAssinado = await pdfDoc.save();
                const pdfBlob = new Blob([pdfBytesAssinado], { type: 'application/pdf' });
                
                // 6. Upload
                const nomeLimpo = dadosDoc.nome.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '_').toUpperCase();
                const nomeArquivo = `Assinados/${Date.now()}_${nomeLimpo}.pdf`;
                const { error: uploadError } = await supabaseClient.storage.from('documentos').upload(nomeArquivo, pdfBlob);
                
                if (uploadError) throw new Error("Erro de conexão no servidor: " + uploadError.message);
                
                const { data: pUrl } = supabaseClient.storage.from('documentos').getPublicUrl(nomeArquivo);

                // 7. Atualiza o banco
                const { error: dbError } = await supabaseClient.from('documentos_mensais').update({
                    status: 'Assinado',
                    documento_assinado: pUrl.publicUrl,
                    assinado_em: agora.toISOString()
                }).eq('id', dadosDoc.id);

                if (dbError) throw new Error("Erro ao validar assinatura no banco: " + dbError.message);

                // 8. Envia WhatsApp
                const fone = dadosDoc.telefone;
                if (fone) {
                    await enviarMensagemConfirmacao(
                        fone, 
                        dadosDoc.nome, 
                        dadosDoc.tipo_documento, 
                        dadosDoc.mes_ano, 
                        pUrl.publicUrl
                    );
                }

                // 9. Sucesso (Design Premium)
                document.getElementById('conteudo-principal').innerHTML = `
                    <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" style="width: 80px; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
                    <br>
                    <i class="fa-solid fa-circle-check fa-5x" style="color: var(--cor-sucesso); margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(32, 201, 151, 0.4));"></i>
                    <h2 style="color: var(--cor-sucesso); font-size: 1.8rem; margin-bottom: 10px;">Assinatura Confirmada!</h2>
                    <p style="color: #fff; font-size: 1.1rem; margin-bottom: 20px;">Obrigado, <b>${dadosDoc.nome.split(' ')[0]}</b>. Seu documento foi assinado com sucesso.</p>
                    
                    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2);">
                        <p style="font-size: 0.9rem; color: var(--cor-texto-sec); margin: 0; line-height: 1.5;">
                            Enviamos uma cópia do documento assinado diretamente para o seu WhatsApp para seus registros pessoais.<br><br>
                            <b style="color: #fff;">Você já pode fechar esta tela.</b>
                        </p>
                    </div>
                `;

            } catch (err) {
                console.error("Erro geral:", err);
                alert(err.message); 
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Finalizar Assinatura';
            }
        }

        window.onload = inicializar;

        async function enviarMensagemConfirmacao(telefone, nome, tipo, mes, linkPdf) {
            const primeiroNome = nome.split(' ')[0];
            let foneLimpo = telefone.replace(/\D/g, '');
            if (!foneLimpo.startsWith('55')) foneLimpo = '55' + foneLimpo;

            const urlParams = new URLSearchParams(window.location.search);
            const tokenAtualDaUrl = urlParams.get('token');

            try {
                const { data, error } = await supabaseClient.functions.invoke('enviar-whatsapp', {
                    body: {
                        telefone: foneLimpo,
                        templateName: "doc_assinado_confirmacao",
                        variaveisBody: [primeiroNome, tipo, mes], 
                        linkDocumentoHeader: linkPdf,             
                        urlButtonParam: null,
                        documentToken: tokenAtualDaUrl 
                    }
                });

                if (error || (data && data.success === false)) return false;
                return true;
            } catch (err) {
                return false;
            }
        }
    </script>
</body>
</html>
