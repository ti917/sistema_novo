<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Digital de Documento</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; width: 100%; max-width: 500px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 12px; text-align: center; }
        h2 { color: #002347; margin-bottom: 10px; }
        p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
        #signature-pad { border: 2px dashed #8b5cf6; border-radius: 8px; width: 100%; height: 200px; background: #fafafa; touch-action: none; margin-bottom: 15px; }
        .btn { padding: 15px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-size: 1rem; }
        .btn-primary { background: #002347; color: #fff; text-decoration: none; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #002347; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="margin-bottom: 20px; color: #8b5cf6;"></i>
        <h2 style="color: #fff;">Carregando seu documento...</h2>
    </div>

    <div class="container hidden" id="conteudo-principal">
        <i class="fa-solid fa-file-signature fa-4x" style="color: #8b5cf6; margin-bottom: 20px;"></i>
        <h2 id="txt-titulo">Assinatura Digital</h2>
        <p>Olá, <b id="txt-nome">Colaborador</b>! Verifique o seu documento abaixo e realize a sua assinatura no quadro indicado.</p>

        <a id="btn-ver-pdf" href="#" target="_blank" class="btn btn-primary">
            <i class="fa-solid fa-file-pdf"></i> Visualizar Documento Original
        </a>

        <div style="margin: 30px 0 15px 0;">
            <h4 style="color: #002347; margin-bottom: 10px;"><i class="fa-solid fa-pen"></i> Assine aqui:</h4>
            <canvas id="signature-pad"></canvas>
            <button class="btn btn-secondary" onclick="signaturePad.clear()">
                <i class="fa-solid fa-eraser"></i> Limpar e Refazer
            </button>
            <button class="btn btn-success" id="btn-confirmar" onclick="processarAssinaturaNoPDF()">
                <i class="fa-solid fa-check"></i> Finalizar e Assinar PDF
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dadosDoc = null;
        let signaturePad = null;

        async function inicializar() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const { data, error } = await supabaseClient.from('documentos_mensais').select('*').eq('token', token).single();

            if (error || !data) {
                document.getElementById('loading-screen').innerHTML = '<h2>Link inválido ou expirado.</h2>'; return;
            }

            if (data.status === 'Assinado') {
                document.getElementById('loading-screen').innerHTML = '<i class="fa-solid fa-circle-check fa-4x" style="color:#28a745;"></i><h2>Este documento já foi assinado!</h2>'; return;
            }

            dadosDoc = data;
            document.getElementById('txt-nome').innerText = data.nome.split(' ')[0];
            document.getElementById('txt-titulo').innerText = `Assinar ${data.tipo_documento}`;
            document.getElementById('btn-ver-pdf').href = data.documento_pdf;

            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('conteudo-principal').classList.remove('hidden');

            const canvas = document.getElementById('signature-pad');
            signaturePad = new SignaturePad(canvas, { penColor: "rgb(0, 35, 71)" });

            function resizeCanvas() {
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                canvas.getContext("2d").scale(ratio, ratio);
                signaturePad.clear();
            }
            window.onresize = resizeCanvas;
            resizeCanvas();
        }

       async function processarAssinaturaNoPDF() {
    if (signaturePad.isEmpty()) { alert("Por favor, realize a sua assinatura."); return; }

    const btn = document.getElementById('btn-confirmar');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gravando assinatura e selo digital...';
    btn.disabled = true;

    try {
        // 1. Baixa o PDF original (individual)
        const response = await fetch(dadosDoc.documento_pdf);
        const pdfBytesOriginal = await response.arrayBuffer();

        // 2. Carrega o documento e define fontes
        const pdfDoc = await PDFLib.PDFDocument.load(pdfBytesOriginal);
        const pages = pdfDoc.getPages();
        const lastPage = pages[pages.length - 1]; 
        const { width, height } = lastPage.getSize();
        
        // 3. Prepara a imagem da assinatura (Diminuída para 0.22 para ser mais elegante)
        const signatureImage = await pdfDoc.embedPng(signaturePad.toDataURL());
        const sigDims = signatureImage.scale(0.22); 

        // 4. Prepara o texto do Selo Digital (Data e Hora)
        const agora = new Date();
        const dataFormatada = agora.toLocaleDateString('pt-BR');
        const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const textoSelo = `Assinado digitalmente em ${dataFormatada} às ${horaFormatada}`;

        // 5. LÓGICA DE POSICIONAMENTO REFINADA
        // Alinhado para ficar abaixo do bloco de Totais/Base INSS
        let posX, posY;

        if (dadosDoc.tipo_documento.includes("Ponto")) {
            // Folha de Ponto: Geralmente mais à esquerda no rodapé
            posX = 60; 
            posY = 65; 
        } else {
            // Holerite: Centralizado na parte inferior, abaixo da linha de bases
            posX = (width / 2) - (sigDims.width / 2) + 120; // Ajuste para alinhar com o campo de assinatura à direita
            posY = 35; // Posicionado mais para o final da folha 
        }

        // Desenha a Assinatura (Imagem)
        lastPage.drawImage(signatureImage, {
            x: posX,
            y: posY,
            width: sigDims.width,
            height: sigDims.height,
        });

        // Desenha o Selo Digital (Texto informativo embaixo da assinatura)
        lastPage.drawText(textoSelo, {
            x: posX - 10, // Centraliza levemente com a imagem
            y: posY - 10, // 10 pontos abaixo da imagem
            size: 7, // Fonte pequena e discreta
            color: PDFLib.rgb(0.4, 0.4, 0.4), // Cinza escuro para não sobrepor o documento
        });

        // 6. Finalização e Upload
        const pdfBytesAssinado = await pdfDoc.save();
        const pdfBlob = new Blob([pdfBytesAssinado], { type: 'application/pdf' });

        const nomeArquivo = `Assinados/${Date.now()}_${dadosDoc.nome.replace(/\s/g, '_')}.pdf`;
        await supabaseClient.storage.from('documentos').upload(nomeArquivo, pdfBlob);
        const { data: pUrl } = supabaseClient.storage.from('documentos').getPublicUrl(nomeArquivo);

        await supabaseClient.from('documentos_mensais').update({
            status: 'Assinado',
            documento_assinado: pUrl.publicUrl,
            assinado_em: agora.toISOString()
        }).eq('id', dadosDoc.id);

        document.getElementById('conteudo-principal').innerHTML = `
            <i class="fa-solid fa-circle-check fa-5x" style="color: #28a745; margin-bottom: 20px;"></i>
            <h2>Documento Assinado!</h2>
            <p>Sua assinatura e o selo digital de autenticidade foram aplicados com sucesso no rodapé do seu holerite.</p>
        `;

    } catch (err) {
        console.error(err);
        alert("Erro ao processar o documento. Verifique sua conexão.");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Finalizar e Assinar PDF';
    }
}

        window.onload = inicializar;
    </script>
</body>
</html>
