<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura de Documento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        html, body { margin: 0; padding: 0; background: #f0f2f5; font-family: 'Arial', sans-serif; overflow-x: hidden; }

        #app-celular {
            background: #f0f2f5;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
        }
        .doc-container { background: #fff; width: 100%; max-width: 600px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #002347; box-sizing: border-box; border-radius: 4px; }
        .header-logo { text-align: center; margin-bottom: 20px; }
        .header-logo img { max-width: 120px; }
        .doc-title { text-align: center; font-size: 18px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; color: #002347; }
        .doc-body { font-size: 14.5px; line-height: 1.6; text-align: justify; margin-bottom: 25px; color: #222; }
        
        .signature-area { margin-top: 25px; text-align: center; }
        canvas { border: 2px dashed #bbb; background: #fafafa; border-radius: 8px; touch-action: none; width: 100%; max-width: 340px; height: 120px; margin: 0 auto; display: block; }
        .linha-assinatura { border-top: 1px solid #000; width: 260px; margin: 12px auto 4px auto; }
        
        .btn-box { text-align: center; margin-top: 25px; width: 100%; max-width: 350px; display: flex; justify-content: space-between; }
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 48%; transition: 0.2s; }
        .btn-clear { background: #e0e0e0; color: #333; }
        .btn-save { background: #28a745; color: #fff; }
        #loading { text-align: center; margin-top: 50px; font-size: 18px; font-weight: bold; }

        #debug-log { display: none; background: #111; color: #0f0; width: 100%; max-width: 600px; margin-top: 20px; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; box-sizing: border-box; max-height: 250px; overflow-y: auto; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="app-celular">
        <div id="loading">Buscando documento no servidor...</div>

        <div class="doc-container" id="documento-final" style="display: none;">
            <div class="header-logo">
                <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo Empresa" id="img-logo-topo">
            </div>
            <div class="doc-title" id="titulo-doc">TÍTULO AQUI</div>
            <div class="doc-body" id="conteudo-doc"></div>
            <div class="signature-area">
                <canvas id="canvas-ass"></canvas>
                <div class="linha-assinatura"></div>
                <b style="font-size: 14px;" id="nome-assinatura">NOME DO COLABORADOR</b><br>
                <span style="font-size: 12px; color: #555;" id="cpf-assinatura">CPF: 000.000.000-00</span>
            </div>
        </div>

        <div class="btn-box" id="botoes-acao" style="display: none;">
            <button class="btn-clear" onclick="limparCanvas()">Limpar</button>
            <button class="btn-save" id="btn-finalizar" onclick="salvarAssinatura()">Concluir</button>
        </div>

        <div id="debug-log"></div>
    </div>

   <script>
        // Bloqueio do WhatsApp WebView mantido (É uma excelente prática)
        function isNavegadorEmbutido() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1) || (ua.indexOf('Instagram') > -1) || (ua.indexOf('WhatsApp') > -1);
        }

        if (isNavegadorEmbutido()) {
            document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; background: #f0f2f5;">
                    <h1 style="color: #d9534f; font-size: 24px; margin-bottom: 15px;">⚠️ Ação Necessária!</h1>
                    <p style="font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 20px;">
                        O navegador interno do WhatsApp <b>bloqueia a generation da sua assinatura digital</b> por questões de segurança.
                    </p>
                    <div style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 4px solid #002347;">
                        <p style="font-size: 16px; font-weight: bold; color: #002347;">
                            👉 Clique nos 3 pontinhos <br> ou no ícone do Safari no canto da tela<br> e selecione:<br><br>
                            <span style="background: #002347; color: #fff; padding: 8px 15px; border-radius: 5px;">"Abrir no Navegador"</span> ou <span style="background: #002347; color: #fff; padding: 8px 15px; border-radius: 5px;">"Abrir no Safari"</span>
                        </p>
                    </div>
                </div>
            `;
            throw new Error("Bloqueio de WebView ativado.");
        }
        
        // 1. Captura o token da URL logo no começo
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('t') || urlParams.get('token') || '';

        // 2. Cria a conexão passando o token
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            global: {
                headers: {
                    'x-doc-token': token 
                }
            }
        });

        let dadosDoc = null;
        let canvas = document.getElementById('canvas-ass');
        let ctx = canvas.getContext('2d');
        let desenhando = false;

        function logDebug(msg, isError = false) {
            const logBox = document.getElementById('debug-log');
            logBox.style.display = 'block';
            const cor = isError ? '#ff4d4d' : '#00ff00';
            logBox.innerHTML += `<div style="color: ${cor}; margin-bottom: 5px;">> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            if (isError) console.error(msg); else console.log(msg);
        }

        function iniciarCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#002347'; 
            
            const getPos = (e) => {
                let rect = canvas.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - rect.left;
                let y = (e.clientY || e.touches[0].clientY) - rect.top;
                return { x, y };
            };

            const start = (e) => { e.preventDefault(); desenhando = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
            const draw = (e) => { e.preventDefault(); if (desenhando) { ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); } };
            const stop = () => { desenhando = false; };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); canvas.addEventListener('touchend', stop);
        }

        function limparCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        async function carregarDocumento() {
            if (!token) return document.getElementById('loading').innerText = "Link inválido ou expirado.";

            const { data, error } = await supabaseClient.from('documentos_avulsos').select('*').eq('token', token).single();

            if (error || !data) {
                return document.getElementById('loading').innerText = "Documento não encontrado.";
            }

            if (data.status === 'Assinado') {
                return document.getElementById('loading').innerHTML = "<h2 style='color:#28a745; text-align:center; padding-top:30px;'>Este documento já foi assinado! ✔️</h2>";
            }

            dadosDoc = data;

            const linkLogoSoul = 'https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png';
            const linkLogoVillac = 'https://gozgames.neocities.org/LOGO%20VILLAC%20SEM%20FUNDO%20(1).png';

            let urlLogoReal = linkLogoSoul;
            if (data.empresa && data.empresa.toUpperCase().includes('VILLAC')) {
                urlLogoReal = linkLogoVillac;
            }

            document.getElementById('img-logo-topo').src = urlLogoReal;

            let paragrafosHtml = data.conteudo_texto.split('\n').map(linha => {
                if(linha.trim() === '') return '<div style="height: 5px;"></div>'; 
                return `<p>${linha}</p>`; 
            }).join('');

            document.getElementById('titulo-doc').innerText = data.titulo_documento || data.titulo; 
            document.getElementById('conteudo-doc').innerHTML = paragrafosHtml; 
            document.getElementById('nome-assinatura').innerText = data.nome_colaborador || data.nome;
            document.getElementById('cpf-assinatura').innerText = `CPF: ${data.cpf || 'Não informado'}`;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('documento-final').style.display = 'block';
            document.getElementById('botoes-acao').style.display = 'flex';

            iniciarCanvas();
        }

        async function salvarAssinatura() {
            try {
                const btn = document.getElementById('btn-finalizar');
                const blank = document.createElement('canvas');
                blank.width = canvas.width; blank.height = canvas.height;
                if (canvas.toDataURL() === blank.toDataURL()) {
                    alert("Por favor, assine no quadro acima antes de concluir.");
                    return;
                }

                btn.disabled = true;
                btn.innerText = "Salvando...";
                
                logDebug("Extraindo assinatura em PNG...");

                canvas.toBlob(async (blob) => {
                    const limparNomePasta = (texto) => {
                        if (!texto) return 'Padrao';
                        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 \-_]/g, "").replace(/\s+/g, "_").trim();
                    };

                    const empresaLimpa = limparNomePasta(dadosDoc.empresa);
                    const unidadeLimpa = limparNomePasta(dadosDoc.unidade);
                    const nomeLimpo = limparNomePasta(dadosDoc.nome_colaborador || dadosDoc.nome);

                    const caminho = `Arquivos_Avulsos/${empresaLimpa}/${unidadeLimpa}/${nomeLimpo}/${Date.now()}_Assinatura.png`;
                    
                    logDebug("Enviando imagem para a nuvem...");
                    
                    // 🌟 CONFIGURAÇÃO CORRIGIDA DO BUCKET PARA CAIXA ALTA 'DOCUMENTOS'
                    const { error: errUpload } = await supabaseClient.storage.from('DOCUMENTOS').upload(caminho, blob, {
                        contentType: 'image/png',
                        cacheControl: '3600',
                        upsert: true 
                    });
                    
                    if (errUpload) {
                        logDebug(`Erro no upload: ${errUpload.message}`, true);
                        alert("Erro de conexão ao salvar a assinatura. Tente novamente.");
                        btn.disabled = false;
                        btn.innerText = "Concluir";
                        return;
                    }
                    
                    logDebug("Atualizando banco de dados...");
                    
                    // 🌟 CONFIGURAÇÃO CORRIGIDA DO BUCKET PARA CAIXA ALTA 'DOCUMENTOS'
                    const { data: urlData } = supabaseClient.storage.from('DOCUMENTOS').getPublicUrl(caminho);

                    const { error: errUpdate } = await supabaseClient.from('documentos_avulsos').update({
                        status: 'Assinado',
                        documento_pdf: urlData.publicUrl, 
                        assinado_em: new Date().toISOString()
                    }).eq('id', dadosDoc.id);

                    if (errUpdate) {
                        logDebug(`Erro ao atualizar BD: ${errUpdate.message}`, true);
                        alert("Erro ao validar no banco de dados.");
                    } else {
                        document.getElementById('botoes-acao').style.display = 'none';
                        document.getElementById('debug-log').style.display = 'none'; 
                        document.getElementById('documento-final').innerHTML = `
                            <div style="text-align: center; padding: 40px 10px;">
                                <div style="background: #28a745; width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto;">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width: 40px; fill: white;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>
                                </div>
                                <h1 style="color: #28a745; font-size: 24px; margin-bottom: 10px;">Documento Assinado!</h1>
                                <p style="color: #555; font-size: 15px; line-height: 1.5;">Obrigado. Sua assinatura foi registrada e transmitida com sucesso para o arquivo do RH.</p>
                            </div>
                        `;
                    }
                }, 'image/png');
            } catch (err) {
                logDebug(`Erro fatal capturado: ${err.message}`, true);
                document.getElementById('btn-finalizar').disabled = false;
                document.getElementById('btn-finalizar').innerText = "Tentar Novamente";
            }
        }

        carregarDocumento();
    </script>
</body>
</html>
