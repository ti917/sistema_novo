<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura de Documento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Bloqueia qualquer vazamento visual para os lados no celular */
        html, body { overflow-x: hidden; margin: 0; padding: 0; background: #f0f2f5; font-family: 'Arial', sans-serif; }

        /* =========================================================================
           📱 1. MÁSCARA DO CELULAR (O que o funcionário vê e interage)
           ========================================================================= */
        #app-celular {
            position: relative;
            z-index: 10; /* Fica no topo, cobrindo o fundo falso completamente */
            background: #f0f2f5;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
        }
        .doc-container { background: #fff; width: 100%; max-width: 600px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #002347; box-sizing: border-box; border-radius: 4px; }
        .header-logo { text-align: center; margin-bottom: 20px; }
        .header-logo img { max-width: 120px; }
        .doc-title { text-align: center; font-size: 18px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; color: #002347; }
        .doc-body { font-size: 14.5px; line-height: 1.6; text-align: justify; margin-bottom: 25px; color: #222; }
        
        .signature-area { margin-top: 25px; text-align: center; }
        canvas { border: 2px dashed #bbb; background: #fafafa; border-radius: 8px; touch-action: none; width: 100%; max-width: 340px; height: 120px; margin: 0 auto; display: block; }
        .linha-assinatura { border-top: 1px solid #000; width: 260px; margin: 12px auto 4px auto; }
        
        .btn-box { text-align: center; margin-top: 25px; width: 100%; max-width: 350px; display: flex; justify-content: space-between; }
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 48%; }
        .btn-clear { background: #e0e0e0; color: #333; }
        .btn-save { background: #28a745; color: #fff; }
        #loading { text-align: center; margin-top: 50px; font-size: 18px; font-weight: bold; }

        /* =========================================================================
           🖥️ 🚀 O FUNDO FALSO (Sempre montado em tamanho A4 de PC, mas oculto por baixo)
           ========================================================================= */
        #fundo-falso-print {
            position: absolute;
            top: 0;
            left: 0;
            width: 794px;  /* Largura padrão e imutável de uma folha A4 em pixels de PC */
            max-width: 794px;
            background: #ffffff;
            padding: 50px 70px; 
            box-sizing: border-box;
            color: #000000;
            z-index: -9999; /* Joga para trás do cenário do celular */
            pointer-events: none; /* Desativa cliques para não atrapalhar */
        }
        .print-logo { text-align: center; margin-bottom: 35px; }
        .print-logo img { max-width: 150px; }
        .print-title { text-align: center; font-size: 20px; text-transform: uppercase; font-weight: bold; margin-bottom: 35px; color: #002347; }
        .print-body { font-size: 15px; line-height: 1.7; text-align: justify; margin-bottom: 50px; color: #000; }
        
        /* Bloco de assinatura perfeitamente centralizado em modo PC */
        .print-signature-box { 
            margin-top: 50px; 
            text-align: center; 
            page-break-inside: avoid;
        }
        .print-img-ass { width: 240px; height: 90px; object-fit: contain; display: block; margin: 0 auto; }
        .print-linha { border-top: 1.5px solid #000000; width: 320px; margin: 10px auto 6px auto; }
    </style>
</head>
<body>

    <div id="app-celular">
        <div id="loading">Buscando documento no servidor...</div>

        <div class="doc-container" id="documento-final" style="display: none;">
            <div class="header-logo">
                <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo Empresa" data-html2canvas-ignore="true">
            </div>
            <div class="doc-title" id="titulo-doc">TÍTULO AQUI</div>
            <div class="doc-body" id="conteudo-doc"></div>
            <div class="signature-area">
                <canvas id="canvas-ass"></canvas>
                <div class="linha-assinatura"></div>
                <b style="font-size: 14px;" id="nome-assinatura">NOME DO COLABORADOR</b><br>
                <span style="font-size: 12px; color: #555;" id="cpf-assinatura">CPF: 000.000.000-00</span>
            </div>
        </div>

        <div class="btn-box" id="botoes-acao" style="display: none;">
            <button class="btn-clear" onclick="limparCanvas()">Limpar</button>
            <button class="btn-save" id="btn-finalizar" onclick="salvarEGerarPDF()">Concluir</button>
        </div>
    </div>


    <div id="fundo-falso-print">
        <div class="print-logo">
            <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo" data-html2canvas-ignore="true">
        </div>
        <div class="print-title" id="print-titulo-doc">TÍTULO</div>
        <div class="print-body" id="print-conteudo-doc">CONTEÚDO</div>
        
        <div class="print-signature-box">
            <img id="print-img-alvo" class="print-img-ass" src="" alt="Assinatura Digital">
            <div class="print-linha"></div>
            <b style="font-size: 15px; color: #000;" id="print-nome-assinatura">NOME</b><br>
            <span style="font-size: 13px; color: #333;" id="print-cpf-assinatura">CPF</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dadosDoc = null;
        let canvas = document.getElementById('canvas-ass');
        let ctx = canvas.getContext('2d');
        let desenhando = false;

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('t');

        function iniciarCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#002347'; 
            
            const getPos = (e) => {
                let rect = canvas.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - rect.left;
                let y = (e.clientY || e.touches[0].clientY) - rect.top;
                return { x, y };
            };

            const start = (e) => { e.preventDefault(); desenhando = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
            const draw = (e) => { e.preventDefault(); if (desenhando) { ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); } };
            const stop = () => { desenhando = false; };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); canvas.addEventListener('touchend', stop);
        }

        function limparCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        async function carregarDocumento() {
            if (!token) return document.getElementById('loading').innerText = "Link inválido ou expirado.";

            const { data, error } = await supabaseClient.from('documentos_avulsos').select('*').eq('token', token).single();

            if (error || !data) {
                return document.getElementById('loading').innerText = "Documento não encontrado.";
            }

            if (data.status === 'Assinado') {
                return document.getElementById('loading').innerHTML = "<h2 style='color:#28a745; text-align:center; padding-top:30px;'>Este documento já foi assinado! ✔️</h2>";
            }

            dadosDoc = data;

            // Alimenta a interface do celular
            document.getElementById('titulo-doc').innerText = data.titulo_documento;
            let textoFormatado = data.conteudo_texto.replace(/\n/g, '<br>');
            document.getElementById('conteudo-doc').innerHTML = textoFormatado; 
            document.getElementById('nome-assinatura').innerText = data.nome_colaborador;
            document.getElementById('cpf-assinatura').innerText = `CPF: ${data.cpf || 'Não informado'}`;

            // Alimenta em paralelo o Fundo Falso estável de PC (Sempre ativo e renderizado no fundo)
            document.getElementById('print-titulo-doc').innerText = data.titulo_documento;
            document.getElementById('print-conteudo-doc').innerHTML = textoFormatado;
            document.getElementById('print-nome-assinatura').innerText = data.nome_colaborador;
            document.getElementById('print-cpf-assinatura').innerText = `CPF: ${data.cpf || 'Não informado'}`;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('documento-final').style.display = 'block';
            document.getElementById('botoes-acao').style.display = 'flex';

            iniciarCanvas();
        }

        async function salvarEGerarPDF() {
            const btn = document.getElementById('btn-finalizar');
            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            if (canvas.toDataURL() === blank.toDataURL()) {
                alert("Por favor, faça sua assinatura digital no quadro antes de concluir.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando...";

            // 1. Gruda a assinatura do canvas direto no Fundo Falso que já está montado
            const imgBase64 = canvas.toDataURL('image/png');
            document.getElementById('print-img-alvo').src = imgBase64;

            // 2. Alvo do print é o Fundo Falso (Sempre visível pro html2canvas, mas ocultado pelo app-celular)
            const elementoFundoFalso = document.getElementById('fundo-falso-print');

            const opt = {
                margin: [15, 15, 15, 15], 
                filename: `Documento_${dadosDoc.nome_colaborador}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'avoid-all' } 
            };

            // Gera o PDF capturando o container de PC direto das coordenadas nativas do navegador
            const pdfBlob = await html2pdf().set(opt).from(elementoFundoFalso).outputPdf('blob');

            // Limpa nomes de pastas para o Storage
            const limparNomePasta = (texto) => {
                if (!texto) return 'Padrao';
                return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 \-_]/g, "").replace(/\s+/g, "_").trim();
            };

            const empresaLimpa = limparNomePasta(dadosDoc.empresa);
            const unidadeLimpa = limparNomePasta(dadosDoc.unidade);
            const nomeLimpo = limparNomePasta(dadosDoc.nome_colaborador);

            const caminho = `Arquivos_Avulsos/${empresaLimpa}/${unidadeLimpa}/${nomeLimpo}/${Date.now()}_Assinado.pdf`;
            
            const { error: errUpload } = await supabaseClient.storage.from('documentos').upload(caminho, pdfBlob);
            
            if (errUpload) {
                console.error("Erro upload storage:", errUpload);
                alert("Erro ao salvar o arquivo assinado.");
                location.reload();
                return;
            }

            const { data: urlData } = supabaseClient.storage.from('documentos').getPublicUrl(caminho);

            await supabaseClient.from('documentos_avulsos').update({
                status: 'Assinado',
                url_pdf_final: urlData.publicUrl,
                assinado_em: new Date().toISOString()
            }).eq('id', dadosDoc.id);

            // Tela de Sucesso no celular
            document.getElementById('botoes-acao').style.display = 'none';
            document.getElementById('documento-final').innerHTML = `
                <div style="text-align: center; padding: 40px 10px;">
                    <h1 style="color: #28a745; font-size: 22px;">Documento Assinado com Sucesso! ✅</h1>
                    <p style="color: #555; margin-top: 10px; font-size: 14px;">Obrigado. Os dados foram transmitidos diretamente ao RH da empresa.</p>
                </div>
            `;
        }

        carregarDocumento();
    </script>
</body>
</html>
