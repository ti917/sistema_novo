<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura de Documento - RH Soul</title>
    
    <!-- Fontes e Ícones Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #002347;
            --primary-light: #003a75;
            --accent: #4fc3f7;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 35, 71, 0.08), 0 8px 10px -6px rgba(0, 35, 71, 0.05);
        }

        html, body { 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            font-family: 'Inter', sans-serif; 
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        #app-celular {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 20px 16px;
        }

        /* Container do Documento */
        .doc-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 600px; 
            padding: 32px 24px; 
            box-shadow: var(--shadow);
            border-top: 6px solid var(--primary); 
            box-sizing: border-box; 
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .header-logo { text-align: center; margin-bottom: 24px; }
        .header-logo img { max-width: 140px; height: auto; }
        
        .doc-title { 
            text-align: center; 
            font-size: 20px; 
            text-transform: uppercase; 
            font-weight: 700; 
            margin-bottom: 24px; 
            color: var(--primary); 
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .doc-body { 
            font-size: 15px; 
            line-height: 1.7; 
            text-align: justify; 
            margin-bottom: 32px; 
            color: #334155; 
        }
        
        .doc-body p { margin-top: 0; margin-bottom: 16px; }

        /* Área de Assinatura */
        .signature-area { 
            margin-top: 32px; 
            text-align: center; 
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }
        
        .signature-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        canvas { 
            background: #ffffff; 
            border: 1px solid #e2e8f0;
            border-radius: 8px; 
            touch-action: none; 
            width: 100%; 
            max-width: 100%;
            height: 140px; 
            margin: 0 auto; 
            display: block; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .linha-assinatura { 
            border-top: 1px solid #94a3b8; 
            width: 80%; 
            margin: 16px auto 6px auto; 
        }

        /* Botões de Ação */
        .btn-box { 
            text-align: center; 
            width: 100%; 
            max-width: 600px; 
            display: flex; 
            justify-content: space-between; 
            gap: 12px;
        }

        button { 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: 600; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 48%; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:active { transform: scale(0.98); }

        .btn-clear { 
            background: #e2e8f0; 
            color: #475569; 
        }
        .btn-clear:hover { background: #cbd5e1; }

        .btn-save { 
            background: var(--success); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }
        .btn-save:hover { background: #218838; }
        button:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

        /* Loading Universal Customizado */
        #loading { 
            text-align: center; 
            margin-top: 100px; 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--primary);
        }
        
        .spinner {
            font-size: 40px;
            color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #debug-log { display: none; background: #0f172a; color: #38bdf8; width: 100%; max-width: 600px; margin-top: 20px; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; box-sizing: border-box; max-height: 250px; overflow-y: auto; border: 1px solid #1e293b; }
    </style>
</head>
<body>

    <div id="app-celular">
        <!-- Tela de Loading Repaginada -->
        <div id="loading">
            <i class="fa-solid fa-circle-notch spinner"></i>
            <div>Buscando documento no servidor seguro...</div>
        </div>

        <!-- Container do Documento -->
        <div class="doc-container" id="documento-final" style="display: none;">
            <div class="header-logo">
                <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo Empresa" id="img-logo-topo">
            </div>
            <div class="doc-title" id="titulo-doc">TÍTULO AQUI</div>
            <div class="doc-body" id="conteudo-doc"></div>
            
            <div class="signature-area">
                <div class="signature-title">
                    <i class="fa-solid fa-pen-nib"></i> Assine com o dedo no quadro branco:
                </div>
                <canvas id="canvas-ass"></canvas>
                <div class="linha-assinatura"></div>
                <b style="font-size: 15px; color: var(--primary);" id="nome-assinatura">NOME DO COLABORADOR</b><br>
                <span style="font-size: 13px; color: var(--text-light);" id="cpf-assinatura">CPF: 000.000.000-00</span>
            </div>
        </div>

        <!-- Botões de Ação Repaginados -->
        <div class="btn-box" id="botoes-acao" style="display: none;">
            <button class="btn-clear" onclick="limparCanvas()">
                <i class="fa-solid fa-eraser"></i> Limpar
            </button>
            <button class="btn-save" id="btn-finalizar" onclick="salvarAssinatura()">
                <i class="fa-solid fa-circle-check"></i> Concluir
            </button>
        </div>

        <div id="debug-log"></div>
    </div>

    <script>
        // Bloqueio do WhatsApp WebView mantido
        function isNavegadorEmbutido() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1) || (ua.indexOf('Instagram') > -1) || (ua.indexOf('WhatsApp') > -1);
        }

        if (isNavegadorEmbutido()) {
            document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 24px; text-align: center; background: #f8fafc; font-family: 'Inter', sans-serif;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: #dc3545; margin-bottom: 16px;"></i>
                    <h1 style="color: #002347; font-size: 22px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">Ação Necessária!</h1>
                    <p style="font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px; max-width: 320px;">
                        O navegador interno do WhatsApp bloqueia a geração da sua assinatura digital por questões de segurança.
                    </p>
                    <div style="background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,35,71,0.05); border-top: 4px solid #002347; max-width: 340px;">
                        <p style="font-size: 15px; font-weight: 600; color: #002347; margin: 0; line-height: 1.5;">
                            👉 Clique nos 3 pontinhos <br>ou no ícone do navegador no canto da tela e selecione:<br><br>
                            <span style="background: #002347; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: inline-block; font-weight: bold; margin: 4px 0;">"Abrir no Navegador"</span> <br>ou<br> <span style="background: #002347; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: inline-block; font-weight: bold; margin: 4px 0;">"Abrir no Safari"</span>
                        </p>
                    </div>
                </div>
            `;
            throw new Error("Bloqueio de WebView ativado.");
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('t') || urlParams.get('token') || '';

        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            global: {
                headers: {
                    'x-doc-token': token 
                }
            }
        });

        let dadosDoc = null;
        let canvas = document.getElementById('canvas-ass');
        let ctx = canvas.getContext('2d');
        let desenhando = false;

        function logDebug(msg, isError = false) {
            const logBox = document.getElementById('debug-log');
            logBox.style.display = 'block';
            const cor = isError ? '#ff4d4d' : '#38bdf8';
            logBox.innerHTML += `<div style="color: ${cor}; margin-bottom: 5px;">> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            if (isError) console.error(msg); else console.log(msg);
        }

        function iniciarCanvas() {
            // Ajustando a resolução interna do canvas para ficar nítido no mobile
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = '100%';
            
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#002347'; 
            
            const getPos = (e) => {
                let r = canvas.getBoundingClientRect();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: clientX - r.left,
                    y: clientY - r.top
                };
            };

            const start = (e) => { e.preventDefault(); desenhando = true; ctx.beginPath(); const pos = getPos(e); ctx.moveTo(pos.x, pos.y); };
            const draw = (e) => { e.preventDefault(); if (desenhando) { const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); } };
            const stop = () => { desenhando = false; };

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); canvas.addEventListener('touchend', stop);
        }

        function limparCanvas() { 
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height); 
        }

        async function carregarDocumento() {
            if (!token) return document.getElementById('loading').innerHTML = "<div style='color:var(--danger); padding:20px;'><i class='fa-solid fa-circle-xmark fa-2x'></i><br><br><b>Link inválido ou expirado.</b></div>";

            const { data, error } = await supabaseClient.from('documentos_avulsos').select('*').eq('token', token).single();

            if (error || !data) {
                return document.getElementById('loading').innerHTML = "<div style='color:var(--danger); padding:20px;'><i class='fa-solid fa-circle-xmark fa-2x'></i><br><br><b>Documento não localizado no servidor.</b></div>";
            }

            if (data.status === 'Assinado') {
                return document.getElementById('loading').innerHTML = `
                    <div style='color:var(--success); padding:40px 20px;'>
                        <i class='fa-solid fa-circle-check fa-3x' style='margin-bottom:16px;'></i>
                        <h2 style='margin:0; font-size:22px; color:#1e293b;'>Este documento já foi assinado!</h2>
                        <p style='color:var(--text-light); font-size:14px; margin-top:8px;'>Sua via já está salva em nossos arquivos do RH.</p>
                    </div>`;
            }

            dadosDoc = data;

            const linkLogoSoul = 'https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png';
            const linkLogoVillac = 'https://gozgames.neocities.org/LOGO%20VILLAC%20SEM%20FUNDO%20(1).png';

            let urlLogoReal = linkLogoSoul;
            if (data.empresa && data.empresa.toUpperCase().includes('VILLAC')) {
                urlLogoReal = linkLogoVillac;
            }

            document.getElementById('img-logo-topo').src = urlLogoReal;

            let paragrafosHtml = data.conteudo_texto.split('\n').map(linha => {
                if(linha.trim() === '') return '<div style="height: 10px;"></div>'; 
                return `<p>${linha}</p>`; 
            }).join('');

            document.getElementById('titulo-doc').innerText = data.titulo_documento || data.titulo; 
            document.getElementById('conteudo-doc').innerHTML = paragrafosHtml; 
            document.getElementById('nome-assinatura').innerText = data.nome_colaborador || data.nome;
            document.getElementById('cpf-assinatura').innerText = `CPF: ${data.cpf || 'Não informado'}`;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('documento-final').style.display = 'block';
            document.getElementById('botoes-acao').style.display = 'flex';

            iniciarCanvas();
        }

        async function salvarAssinatura() {
            try {
                const btn = document.getElementById('btn-finalizar');
                const blank = document.createElement('canvas');
                blank.width = canvas.width; blank.height = canvas.height;
                if (canvas.toDataURL() === blank.toDataURL()) {
                    alert("Por favor, faça sua assinatura no quadro em branco antes de concluir.");
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Salvando...";
                
                logDebug("Extraindo assinatura em PNG...");

                canvas.toBlob(async (blob) => {
                    const limparNomePasta = (texto) => {
                        if (!texto) return 'Padrao';
                        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 \-_]/g, "").replace(/\s+/g, "_").trim();
                    };

                    const empresaLimpa = limparNomePasta(dadosDoc.empresa);
                    const unidadeLimpa = limparNomePasta(dadosDoc.unidade);
                    const nomeLimpo = limparNomePasta(dadosDoc.nome_colaborador || dadosDoc.nome);

                    const caminho = `Arquivos_Avulsos/${empresaLimpa}/${unidadeLimpa}/${nomeLimpo}/${Date.now()}_Assinatura.png`;
                    
                    logDebug("Enviando imagem para a nuvem...");
                    
                    const { error: errUpload } = await supabaseClient.storage.from('documentos').upload(caminho, blob, {
                        contentType: 'image/png',
                        cacheControl: '3600',
                        upsert: true 
                    });
                    
                    if (errUpload) {
                        logDebug(`Erro no upload: ${errUpload.message}`, true);
                        alert("Erro de conexão ao salvar a assinatura. Verifique seu sinal e tente novamente.");
                        btn.disabled = false;
                        btn.innerHTML = "<i class='fa-solid fa-circle-check'></i> Concluir";
                        return;
                    }
                    
                    logDebug("Atualizando banco de dados...");
                    const { data: urlData } = supabaseClient.storage.from('documentos').getPublicUrl(caminho);

                    const { error: errUpdate } = await supabaseClient.from('documentos_avulsos').update({
                        status: 'Assinado',
                        documento_pdf: urlData.publicUrl, 
                        assinado_em: new Date().toISOString()
                    }).eq('id', dadosDoc.id);

                    if (errUpdate) {
                        logDebug(`Erro ao atualizar BD: ${errUpdate.message}`, true);
                        alert("Erro ao validar o recebimento do documento.");
                        btn.disabled = false;
                        btn.innerHTML = "<i class='fa-solid fa-circle-check'></i> Concluir";
                    } else {
                        document.getElementById('botoes-acao').style.display = 'none';
                        document.getElementById('debug-log').style.display = 'none'; 
                        document.getElementById('documento-final').innerHTML = `
                            <div style="text-align: center; padding: 48px 16px;">
                                <div style="background: rgba(40, 167, 69, 0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 24px auto;">
                                    <i class="fa-solid fa-circle-check" style="font-size: 40px; color: var(--success);"></i>
                                </div>
                                <h1 style="color: var(--primary); font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px;">Documento Assinado!</h1>
                                <p style="color: var(--text-light); font-size: 15px; line-height: 1.6; max-width: 340px; margin: 0 auto;">Sua assinatura foi processada e transmitida com sucesso para o arquivo geral do RH da empresa.</p>
                                <div style="margin-top: 32px; background: #f1f5f9; padding: 12px; border-radius: 8px; display: inline-block; font-size: 13px; font-weight: 600; color: #475569;">
                                    <i class="fa-solid fa-lock"></i> Conexão Criptografada Ativa
                                </div>
                            </div>
                        `;
                    }
                }, 'image/png');
            } catch (err) {
                logDebug(`Erro fatal capturado: ${err.message}`, true);
                document.getElementById('btn-finalizar').disabled = false;
                document.getElementById('btn-finalizar').innerHTML = "<i class='fa-solid fa-circle-check'></i> Tentar Novamente";
            }
        }

        carregarDocumento();
    </script>
</body>
</html>
