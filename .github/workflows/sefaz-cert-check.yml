name: Checa validade do certificado digital (SEFAZ)

# Workflow de diagnostico, criado em 28/10/2026 a pedido do Italo, pra conferir
# se o certificado A1 usado nas consultas a' SEFAZ nao esta perto de vencer.
# NAO faz nenhuma chamada pra SEFAZ - so le os dados do proprio .pfx
# localmente (validade, titular/CNPJ) usando openssl. Seguro de rodar a
# qualquer hora, nao conta pra nenhum limite de consulta.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Le validade do certificado
        env:
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
        run: |
          echo "$SEFAZ_CERT_PFX_BASE64" | base64 -d > cert.pfx
          echo "$SEFAZ_CERT_SENHA" > senha.txt
          openssl pkcs12 -in cert.pfx -clcerts -nokeys -legacy -passin file:senha.txt -out cert.pem 2>/dev/null
          echo "===== VALIDADE E TITULAR DO CERTIFICADO ====="
          openssl x509 -in cert.pem -noout -subject -dates
          echo "==============================================="
          rm -f cert.pfx senha.txt cert.pem
