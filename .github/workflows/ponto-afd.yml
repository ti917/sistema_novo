name: Gerar AFD do ponto (REP-P) assinado

# Gera o AFD do periodo, assina com o certificado A1 da empresa (.p7s separado) e envia
# pro bucket PRIVADO `ponto-fiscal` do Supabase. Nada de dado pessoal e impresso no log
# nem fica como artifact (o repositorio e publico). Roda sozinho todo dia 1o (mes anterior) e tambem quando alguem clica em "Run".
on:
  # Todo dia 1o (07:17 em Brasilia) gera o mes ANTERIOR inteiro, sem INPI (arquivo RASCUNHO).
  schedule:
    - cron: '17 10 1 * *'
  workflow_dispatch:
    inputs:
      data_ini:
        description: "Data inicial (AAAA-MM-DD)"
        required: true
      data_fim:
        description: "Data final (AAAA-MM-DD)"
        required: true
      inpi:
        description: "N. de registro no INPI (vazio = arquivo RASCUNHO)"
        required: false
        default: ""
      empresa:
        description: "Filtrar por empresa (vazio = todas)"
        required: false
        default: ""
      sincronizar:
        description: "Criar registros de empregador/empregados ANTES do go-live (so adiciona)"
        type: boolean
        default: false

jobs:
  afd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gera, assina e envia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          EMP_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          EMP_RAZAO: ${{ vars.EMP_RAZAO || 'SOUL FACILITIES LTDA' }}
          EMP_LOCAL: ${{ vars.EMP_LOCAL || '' }}
          CPF_RESPONSAVEL: ${{ secrets.CPF_RESPONSAVEL }}
          DEV_EMAIL: ${{ vars.DEV_EMAIL || 'ti@gruposoulbr.com' }}
        run: |
          INI="${{ inputs.data_ini }}"; FIM="${{ inputs.data_fim }}"
          if [ -z "$INI" ]; then
            # execucao agendada: mes anterior inteiro
            INI=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%F)
            FIM=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%F)
          fi
          ARGS="--ini $INI --fim $FIM"
          if [ -n "${{ inputs.inpi }}" ]; then ARGS="$ARGS --inpi ${{ inputs.inpi }}"; fi
          if [ -n "${{ inputs.empresa }}" ]; then ARGS="$ARGS --empresa \"${{ inputs.empresa }}\""; fi
          if [ "${{ inputs.sincronizar }}" = "true" ]; then ARGS="$ARGS --sincronizar"; fi
          eval python3 -I scripts/ponto_afd/gerar_afd.py $ARGS
