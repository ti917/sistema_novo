name: Sincroniza NFS-e (API nacional do ADN)

# De hora em hora (e tambem disparavel na mao). Puxa as NFS-e do padrao nacional em
# que a empresa e' tomadora e grava na tabela nfecloud_documentos (tipo NFSe). E'
# outro servico, separado da SEFAZ (NF-e): nao divide limite com ela.
# Precisa ter rodado sql_extra/nfse_nsu_controle.sql no Supabase.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: nfse-adn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instala dependencias
        working-directory: scripts/nfse-sync
        run: npm install --no-audit --no-fund
      - name: Puxa NFS-e do ADN e grava no Supabase
        working-directory: scripts/nfse-sync
        run: node index.js
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
