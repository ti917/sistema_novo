name: Teste da API nacional de NFS-e (so le, nao grava)

# Disparo MANUAL (Actions > este workflow > Run workflow). Faz poucas consultas de
# LEITURA ao ADN com o certificado da empresa e mostra um resumo no log (sem nomes,
# valores nem chaves completas, porque o repositorio e' publico). Nao grava nada
# no Supabase. Serve pra descobrir se o ADN entrega as NFS-e tomadas pela Soul.
on:
  workflow_dispatch:
    inputs:
      nsu_inicial:
        description: "NSU inicial (0 = do comeco)"
        default: "0"
      paginas:
        description: "Quantas paginas de 50 ler (max 10)"
        default: "3"
      ambiente:
        description: "producao ou restrita"
        default: "producao"

concurrency:
  group: nfse-adn-teste
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consulta o ADN (so leitura)
        working-directory: scripts/nfse-adn-teste
        run: node index.js
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          NSU_INICIAL: ${{ inputs.nsu_inicial }}
          PAGINAS: ${{ inputs.paginas }}
          ADN_AMBIENTE: ${{ inputs.ambiente }}
