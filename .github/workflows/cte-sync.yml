name: Sincroniza CT-e (conhecimento de transporte)

# Puxa os CT-e em que a empresa aparece (destinatario, remetente, tomador...) no webservice
# CTeDistribuicaoDFe do Ambiente Nacional e grava na tabela nfecloud_documentos (tipo CTe).
# E' outro servico, separado da NF-e: nao divide NSU nem limite com ela.
# Precisa ter rodado sql_extra/cte_nsu_controle.sql no Supabase.
#
# Mesma ideia do sefaz-nfe-sync: o cron acorda a cada 5 min e o proprio script
# (scripts/cte-sync/index.js, MIN_MINUTOS_ENTRE_CONSULTAS) so' consulta 65 min depois da ULTIMA
# consulta; se ainda for cedo, encerra em segundos sem falar com o Ambiente Nacional.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cte-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instala dependencias
        working-directory: scripts/cte-sync
        run: npm install --no-audit --no-fund
      - name: Puxa CT-e do Ambiente Nacional e grava no Supabase
        working-directory: scripts/cte-sync
        run: node index.js
        env:
          # Certificado A1 antigo (ICP-Brasil): o OpenSSL 3 do Node 22 precisa do provider legado pra ler o .pfx.
          NODE_OPTIONS: "--openssl-legacy-provider"
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          SEFAZ_UF_CODIGO: ${{ secrets.SEFAZ_UF_CODIGO }}
          SEFAZ_AMBIENTE: ${{ secrets.SEFAZ_AMBIENTE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
