name: Sincroniza notas fiscais da SEFAZ

# Roda sozinho de hora em hora, e tambem pode ser disparado na hora pelo botao
# "Sincronizar Agora" do financeiro.html (que chama a função do Supabase
# "trigger-sefaz-sync", que por sua vez dispara este workflow via API do
# GitHub - veja supabase/functions/trigger-sefaz-sync).
#
# ATUALIZADO 29/10/2026 (pedido do Italo): em vez de horario fixo (era a
# cada 1h30), a consulta a SEFAZ acontece 65 min depois da ULTIMA consulta.
# O cron nao sabe contar "65 min depois da ultima", entao ele so' acorda o
# workflow a cada 5 min e o proprio script (scripts/sefaz-sync/index.js,
# MIN_MINUTOS_ENTRE_CONSULTAS) decide: se ainda nao deu 65 min, encerra em
# segundos sem chamar a SEFAZ. Na pratica a consulta sai entre 65 e ~75 min
# depois da anterior (o GitHub as vezes atrasa execucoes agendadas alguns
# minutos). Repositorio publico = minutos de Actions sem custo.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Nunca deixa duas execucoes rodarem ao mesmo tempo (ex: botao "Sincronizar
# Agora" clicado enquanto a execucao agendada ainda esta rodando) - as duas
# consultariam a SEFAZ com o mesmo NSU ao mesmo tempo, o que e' exatamente o
# tipo de coisa que gera 656. A segunda espera a primeira terminar (nao
# cancela, pra nao interromper uma ciencia no meio).
concurrency:
  group: sefaz-nfe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala dependencias
        working-directory: scripts/sefaz-sync
        run: npm install --no-audit --no-fund

      - name: Puxa notas da SEFAZ e grava no Supabase
        working-directory: scripts/sefaz-sync
        run: node index.js
        env:
          # O certificado digital A1 da empresa foi gerado com um algoritmo de
          # criptografia mais antigo (comum em certificados ICP-Brasil), que o
          # OpenSSL 3 (usado pelo Node 22) desativa por padrao com o erro
          # "Unsupported PKCS#12 PFX data". Esse flag liga o provider legado do
          # OpenSSL so pra conseguir ler o certificado - nao enfraquece a conexao
          # com a SEFAZ, que continua TLS normal.
          NODE_OPTIONS: "--openssl-legacy-provider"
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          SEFAZ_UF_CODIGO: ${{ secrets.SEFAZ_UF_CODIGO }}
          SEFAZ_AMBIENTE: ${{ secrets.SEFAZ_AMBIENTE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # 29/10/2026: o agendamento (cron) do proprio GitHub falha/atrasa bastante e
  # a NFS-e nao estava rodando sozinha. Esta execucao (disparada de hora em hora
  # pelo Supabase, ou pelo botao Sincronizar Agora) e' confiavel, entao ela
  # tambem acorda o workflow da NFS-e. Nao mexe no limite da SEFAZ: sao
  # servicos separados.
  dispara-nfse:
    needs: sync
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispara a sincronizacao de NFS-e
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nfse-adn-sync.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
