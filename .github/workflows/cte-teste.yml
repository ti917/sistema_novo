name: Teste do CT-e (so le, nao grava)

# Disparo MANUAL (Actions > este workflow > Run workflow). Faz poucas consultas de LEITURA ao
# CTeDistribuicaoDFe com o certificado da empresa e mostra um resumo no log (sem nomes, valores
# nem chaves completas, porque o repositorio e' publico). NAO fala com o Supabase e NAO grava nada
# (nem o NSU). Serve pra descobrir se o Ambiente Nacional entrega os CT-e da Soul antes de ligar
# a sincronizacao de verdade.
# Atencao: gasta consultas do Ambiente Nacional (regra de 1h depois de um 137). Nao dispare em
# sequencia.
on:
  workflow_dispatch:
    inputs:
      nsu_inicial:
        description: "NSU inicial (0 = do comeco do que estiver disponivel)"
        default: "0"
      paginas:
        description: "Quantas paginas de 50 ler (max 20)"
        default: "3"

concurrency:
  group: cte-teste
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consulta o CTeDistribuicaoDFe (so leitura)
        working-directory: scripts/cte-sync
        run: node index.js
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
          CTE_SOMENTE_LER: "1"
          CTE_NSU_INICIAL: ${{ github.event.inputs.nsu_inicial }}
          CTE_PAGINAS: ${{ github.event.inputs.paginas }}
          SEFAZ_CERT_PFX_BASE64: ${{ secrets.SEFAZ_CERT_PFX_BASE64 }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CNPJ: ${{ secrets.SEFAZ_CNPJ }}
          SEFAZ_UF_CODIGO: ${{ secrets.SEFAZ_UF_CODIGO }}
          SEFAZ_AMBIENTE: ${{ secrets.SEFAZ_AMBIENTE }}
