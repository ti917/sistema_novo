<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documentos do Colaborador</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: #0f2417; color: #1a202c;
        min-height: 100vh;
        display: flex; justify-content: center; align-items: flex-start;
        padding: 24px 14px;
    }
    .cartao {
        width: 100%; max-width: 480px;
        background: #fff; border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow: hidden;
    }
    .cabecalho {
        background: #002347; color: #fff;
        padding: 22px 24px;
        text-align: center;
    }
    .cabecalho img { max-width: 140px; max-height: 46px; object-fit: contain; margin-bottom: 12px; }
    .cabecalho h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .cabecalho p { font-size: 0.8rem; margin: 0; opacity: 0.75; }
    .corpo { padding: 22px 24px; }
    .info-linha { font-size: 0.85rem; color: #475569; margin-bottom: 6px; }
    .info-linha b { color: #0f172a; }
    .lista-docs { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .doc-link {
        display: flex; align-items: center; justify-content: space-between;
        text-decoration: none; padding: 13px 15px; border-radius: 10px;
        background: rgba(32, 201, 151, 0.08); border: 1px solid rgba(32, 201, 151, 0.35);
        color: #0f5c46; font-weight: 600; font-size: 0.9rem;
    }
    .doc-link.destaque {
        background: #ffc107; border-color: #ffc107; color: #06210f;
    }
    .doc-link i.fa-download { opacity: 0.7; }
    .estado { text-align: center; padding: 40px 20px; color: #475569; }
    .estado i { font-size: 2rem; color: #cbd5e1; margin-bottom: 12px; display: block; }
    .rodape { text-align: center; padding: 14px; font-size: 0.7rem; color: #94a3b8; }
</style>
</head>
<body>
    <div class="cartao">
        <div class="cabecalho">
            <img id="logo-empresa" src="https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/logo%20soul.png" alt="Logo">
            <h1 id="titulo-nome">Carregando…</h1>
            <p>Documentos do Colaborador</p>
        </div>
        <div class="corpo" id="corpo-conteudo">
            <div class="estado"><i class="fa-solid fa-spinner fa-spin"></i>Buscando os documentos…</div>
        </div>
    </div>
    <div class="rodape">Grupo Soul · Acesso via etiqueta/QR gerada pelo RH</div>

<script>
    const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mesmos rótulos usados no cadastro de admissão (index.html / CONFIG_ANEXOS_ADMISSAO),
    // copiados aqui só pra exibir nome bonito em vez do id cru (ex: "rg" -> "RG (Frente e Verso)").
    const LABELS_DOC = {
        'foto-cracha': 'Foto para o Crachá',
        'rg': 'RG (Frente e Verso)',
        'carteira-trabalho': 'Carteira de Trabalho (CTPS)',
        'reservista': 'Certificado de Reservista',
        'titulo-eleitor': 'Título de Eleitor',
        'cnh': 'CNH',
        'vacinacao-colaborador': 'Carteira de Vacinação',
        'vacinacao-filhos': 'Carteira(s) de Vacinação dos Filhos',
        'certidao-filhos': 'Certidão de Nascimento dos Filhos',
        'conjuge': 'Documento do Cônjuge',
        'comprovante-endereco': 'Comprovante de Endereço',
        'outros': 'Outros Documentos'
    };
    function labelDoc(id) {
        return LABELS_DOC[id] || id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function mascaraCPF(cpf) {
        if (!cpf) return '-';
        const d = String(cpf).replace(/\D/g, '');
        if (d.length !== 11) return cpf;
        return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    }

    (async function carregar() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const corpo = document.getElementById('corpo-conteudo');
        const titulo = document.getElementById('titulo-nome');

        if (!id) {
            titulo.textContent = 'Link inválido';
            corpo.innerHTML = '<div class="estado"><i class="fa-solid fa-triangle-exclamation"></i>Nenhum colaborador informado no link.</div>';
            return;
        }

        try {
            const { data: colab, error } = await supabaseClient
                .from('perfis')
                .select('nome, unidade, empresa, dados_admissao')
                .eq('id', id)
                .maybeSingle();

            if (error) throw error;
            if (!colab) {
                titulo.textContent = 'Não encontrado';
                corpo.innerHTML = '<div class="estado"><i class="fa-solid fa-user-slash"></i>Não encontramos esse colaborador.</div>';
                return;
            }

            if (colab.empresa && colab.empresa.trim().toUpperCase().includes('VILLAC')) {
                document.getElementById('logo-empresa').src = 'https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/LOGO%20VILLAC%20SEM%20FUNDO%20(1)%20(2).png';
            }

            const adm = colab.dados_admissao || {};
            titulo.textContent = colab.nome || 'Colaborador';

            let html = `
                <div class="info-linha">CPF: <b>${mascaraCPF(adm.cpf)}</b></div>
                <div class="info-linha">Unidade: <b>${colab.unidade || '-'}</b></div>
                <div class="info-linha">Função: <b>${adm.cargo || '-'}</b></div>
                <div class="lista-docs">
            `;

            let temAlgum = false;

            if (adm.documento_consolidado_url) {
                temAlgum = true;
                html += `<a href="${adm.documento_consolidado_url}" target="_blank" class="doc-link destaque">
                    <span><i class="fa-solid fa-file-zipper"></i> &nbsp;Baixar Tudo em 1 PDF</span>
                    <i class="fa-solid fa-download"></i>
                </a>`;
            }

            if (adm.documentosDetalhados && Object.keys(adm.documentosDetalhados).length > 0) {
                Object.keys(adm.documentosDetalhados).forEach((tipoId) => {
                    const urls = adm.documentosDetalhados[tipoId] || [];
                    if (tipoId === 'foto-cracha') return; // foto do crachá não é "documento" pra baixar aqui
                    urls.forEach((url, i) => {
                        temAlgum = true;
                        const sufixo = urls.length > 1 ? ` (${i + 1}/${urls.length})` : '';
                        html += `<a href="${url}" target="_blank" class="doc-link">
                            <span><i class="fa-solid fa-file-pdf"></i> &nbsp;${labelDoc(tipoId)}${sufixo}</span>
                            <i class="fa-solid fa-download"></i>
                        </a>`;
                    });
                });
            } else if (adm.documentos && adm.documentos.length > 0) {
                adm.documentos.forEach((url, i) => {
                    temAlgum = true;
                    html += `<a href="${url}" target="_blank" class="doc-link">
                        <span><i class="fa-solid fa-file-pdf"></i> &nbsp;Documento ${i + 1}</span>
                        <i class="fa-solid fa-download"></i>
                    </a>`;
                });
            }

            html += '</div>';

            if (!temAlgum) {
                html = '<div class="estado"><i class="fa-solid fa-folder-open"></i>Nenhum documento anexado ainda.</div>';
            }

            corpo.innerHTML = html;

        } catch (e) {
            titulo.textContent = 'Erro ao carregar';
            corpo.innerHTML = `<div class="estado"><i class="fa-solid fa-circle-exclamation"></i>Não foi possível carregar os documentos.<br><small>${e.message || ''}</small></div>`;
        }
    })();
</script>
</body>
</html>
