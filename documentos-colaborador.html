<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documentos do Colaborador</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: #0f2417; color: #1a202c;
        min-height: 100vh;
        display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
        padding: 24px 14px;
    }
    .cartao {
        width: 100%; max-width: 560px;
        background: #fff; border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow: hidden;
    }
    .cabecalho {
        background: #002347; color: #fff;
        padding: 22px 24px;
        text-align: center;
    }
    .cabecalho img { max-width: 140px; max-height: 46px; object-fit: contain; margin-bottom: 12px; }
    .cabecalho h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .cabecalho p { font-size: 0.8rem; margin: 0; opacity: 0.75; }
    .corpo { padding: 22px 24px; }
    .info-linha { font-size: 0.85rem; color: #475569; margin-bottom: 6px; }
    .info-linha b { color: #0f172a; }

    .aviso-topo {
        margin-top: 14px; font-size: 0.72rem; color: #92660a; background: rgba(255,193,7,0.12);
        border: 1px solid rgba(255,193,7,0.4); border-radius: 8px; padding: 8px 10px; line-height: 1.4;
    }

    .doc-link, .doc-btn {
        display: flex; align-items: center; justify-content: space-between;
        text-decoration: none; padding: 11px 14px; border-radius: 10px;
        background: rgba(32, 201, 151, 0.08); border: 1px solid rgba(32, 201, 151, 0.35);
        color: #0f5c46; font-weight: 600; font-size: 0.85rem;
        width: 100%; text-align: left; cursor: pointer; font-family: inherit;
        margin-bottom: 8px;
    }
    .doc-link.destaque { background: #ffc107; border-color: #ffc107; color: #06210f; }
    .doc-link i.fa-download, .doc-btn i.fa-download { opacity: 0.7; }
    .doc-link span, .doc-btn span { display: flex; align-items: center; gap: 8px; }

    .pasta {
        margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
    }
    .pasta-header {
        display: flex; align-items: center; gap: 8px; padding: 12px 14px;
        font-weight: 700; font-size: 0.9rem; background: #f8fafc;
        cursor: pointer; user-select: none;
    }
    .pasta-header i.fa-chevron-down { margin-left: auto; transition: transform 0.2s; font-size: 0.75rem; opacity: 0.6; }
    .pasta.aberta .pasta-header i.fa-chevron-down { transform: rotate(180deg); }
    .pasta-body { padding: 12px 14px; display: none; }
    .pasta.aberta .pasta-body { display: block; }
    .pasta-vazia { text-align: center; color: #94a3b8; font-size: 0.8rem; padding: 14px 0; }
    .pasta-badge-count {
        font-size: 0.68rem; background: rgba(0,0,0,0.06); color: #475569;
        border-radius: 20px; padding: 2px 8px; font-weight: 600;
    }

    .estado { text-align: center; padding: 40px 20px; color: #475569; }
    .estado i { font-size: 2rem; color: #cbd5e1; margin-bottom: 12px; display: block; }
    .rodape { text-align: center; padding: 14px; font-size: 0.7rem; color: #94a3b8; }

    .modal-doc-overlay {
        position: fixed; inset: 0; background: rgba(4,15,10,0.75);
        z-index: 100000; display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-doc-card {
        width: 100%; max-width: 850px; background: #13161c; border-radius: 12px;
        border: 1px solid #2b3140; position: relative; max-height: 95vh; overflow-y: auto;
    }
    .modal-doc-topo {
        padding: 14px 18px; border-bottom: 1px solid #2b3140; display: flex;
        justify-content: space-between; align-items: center; position: sticky; top: 0;
        background: #13161c; z-index: 10; gap: 10px;
    }
    .modal-doc-topo h3 { margin: 0; font-size: 1rem; }
    .modal-doc-topo button { border: none; cursor: pointer; font-family: inherit; }
    .btn-fechar-modal { background: none; color: #fff; font-size: 1.4rem; padding: 4px 8px; }
    .btn-imprimir-modal { padding: 8px 14px; font-size: 0.85rem; border-radius: 6px; font-weight: bold; white-space: nowrap; }
    .modal-doc-fundo { padding: 24px; background: #e2e8f0; display: flex; justify-content: center; overflow-x: auto; }

    .toast-msg {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #002347; color: #fff; padding: 10px 18px; border-radius: 8px;
        font-size: 0.82rem; z-index: 200000; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        max-width: 90vw; text-align: center;
    }

    .pin-box { text-align: center; padding: 10px 4px 4px; }
    .pin-box i.fa-lock { font-size: 1.8rem; color: #0f5c46; margin-bottom: 10px; display: block; }
    .pin-box p { font-size: 0.85rem; color: #475569; margin: 0 0 18px; line-height: 1.5; }
    .pin-input {
        width: 140px; margin: 0 auto 14px; display: block;
        font-size: 1.6rem; letter-spacing: 10px; text-align: center;
        padding: 10px 0 10px 10px; border-radius: 10px; border: 1px solid #cbd5e1;
        font-family: inherit; font-weight: 700; color: #0f172a;
    }
    .pin-input:focus { outline: none; border-color: #0f5c46; }
    .btn-pin-entrar {
        width: 100%; padding: 13px; border-radius: 10px; border: none;
        background: #0f5c46; color: #fff; font-weight: 700; font-size: 0.9rem;
        cursor: pointer; font-family: inherit;
    }
    .btn-pin-entrar:disabled { opacity: 0.6; cursor: default; }
    .pin-erro {
        margin-top: 12px; font-size: 0.8rem; color: #b91c1c; background: rgba(220,38,38,0.08);
        border: 1px solid rgba(220,38,38,0.3); border-radius: 8px; padding: 8px 10px; display: none;
    }
</style>
</head>
<body>
    <div class="cartao">
        <div class="cabecalho">
            <img id="logo-empresa" src="https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/logo%20soul.png" alt="Logo">
            <h1 id="titulo-nome">Carregando…</h1>
            <p>Documentos do Colaborador</p>

        <div class="corpo" id="corpo-conteudo">

                <input type="tel" inputmode="numeric" maxlength="4" class="pin-input" id="input-pin" placeholder="••••" autocomplete="off">

<script>
    const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
    const URL_FUNCAO_DOCUMENTOS = SUPABASE_URL + '/functions/v1/documentos-colaborador-publico';

    // Mesmos rótulos usados no cadastro de admissão (index.html / CONFIG_ANEXOS_ADMISSAO),
    // copiados aqui só pra exibir nome bonito em vez do id cru (ex: "rg" -> "RG (Frente e Verso)").
    const LABELS_DOC = {
        'foto-cracha': 'Foto para o Crachá',
        'rg': 'RG (Frente e Verso)',
        'carteira-trabalho': 'Carteira de Trabalho (CTPS)',
        'reservista': 'Certificado de Reservista',
        'titulo-eleitor': 'Título de Eleitor',
        'cnh': 'CNH',
        'vacinacao-colaborador': 'Carteira de Vacinação',
        'vacinacao-filhos': 'Carteira(s) de Vacinação dos Filhos',
        'certidao-filhos': 'Certidão de Nascimento dos Filhos',
        'conjuge': 'Documento do Cônjuge',
        'comprovante-endereco': 'Comprovante de Endereço',
        'outros': 'Outros Documentos'
    };
    function labelDoc(id) {
        return LABELS_DOC[id] || id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function mascaraCPF(cpf) {
        if (!cpf) return '-';
        const d = String(cpf).replace(/\D/g, '');
        if (d.length !== 11) return cpf;
        return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    }

    function formatarDataBR(data) {
        if (!data || data === '-') return '-';
        const partes = String(data).split('-');
        if (partes.length !== 3) return data;
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function obterRegraExperiencia(dataStr) {
        if (!dataStr) return { p1: 45, p2: 45, total: 90 };
        let strFixa = dataStr;
        if (dataStr.includes('/')) {
            const p = dataStr.split('/');
            strFixa = `${p[2]}-${p[1]}-${p[0]}`;
        }
        const dInicio = new Date(strFixa + 'T00:00:00');
        const dataMudanca = new Date('2026-05-01T00:00:00');
        if (dInicio < dataMudanca) return { p1: 30, p2: 30, total: 60 };
        return { p1: 45, p2: 45, total: 90 };
    }

    function mostrarAviso(msg) {
        const el = document.createElement('div');
        el.className = 'toast-msg';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    function fecharModal(idModal) {
        const m = document.getElementById(idModal);
        if (m) m.remove();
    }

    // Caches em memória, preenchidos depois que o PIN é validado pela Edge Function
    // (equivalentes aos globais window.dadosAvulsosAtuais / window.dadosEpiAtuais do painel admin)
    window.dadosAvulsosAtuais = [];
    window.dadosEpiAtuais = [];
    window.dadosDesempenhoAtuais = [];
    window.colabAtualCompleto = null;

    function logoParaEmpresa(empresa) {
        if (empresa && empresa.trim().toUpperCase().includes('VILLAC')) {
            return 'https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/LOGO%20VILLAC%20SEM%20FUNDO%20(1)%20(2).png';
        }
        return 'https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/logo%20soul.png';
    }

    // =========================================================
    // TERMOS AVULSOS (assinados via WhatsApp)
    // =========================================================
    window.visualizarDocumentoAvulsoMontado = function(idDocumento) {
        const doc = window.dadosAvulsosAtuais.find(d => String(d.id) === String(idDocumento));
        if (!doc) return mostrarAviso("Documento não encontrado.");

        const dataAssinatura = doc.assinado_em
            ? new Date(doc.assinado_em).toLocaleDateString('pt-BR') + ' às ' + new Date(doc.assinado_em).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            : 'Data não registrada';

        const paragrafosHtml = (doc.conteudo_texto || '')
            .replace(/\r\n/g, '\n')
            .split('\n')
            .map(linha => linha.trim() === '' ? '<div style="height: 15px;"></div>' : `<div style="margin-bottom: 8px; line-height: 1.6; text-align: justify;">${linha}</div>`)
            .join('');

        const urlLogoReal = logoParaEmpresa(doc.empresa);

        const modalHtml = `
        <div id="modal-ver-doc-avulso" class="modal-doc-overlay">
            <div class="modal-doc-card" style="border-color:#28a745;">
                <div class="modal-doc-topo">
                    <h3 style="color:#28a745;"><i class="fa-solid fa-file-contract"></i> Termo Assinado</h3>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-imprimir-modal" style="background:#28a745; color:#fff;" onclick="baixarPdfDocumentoAvulso('${doc.id}')"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
                        <button class="btn-fechar-modal" onclick="fecharModal('modal-ver-doc-avulso')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="modal-doc-fundo">
                    <div style="background:#fff; width:100%; max-width:794px; padding:50px; box-sizing:border-box; color:#000; box-shadow:0 10px 25px rgba(0,0,0,0.2); font-family:Arial, sans-serif;">
                        <div style="text-align:center; margin-bottom:30px;">
                            <img src="${urlLogoReal}" crossorigin="anonymous" style="max-width:120px; margin-bottom:15px;">
                            <h2 style="font-size:18px; text-transform:uppercase; margin:0; color:#002347;">${doc.titulo_documento || doc.titulo}</h2>
                        </div>
                        <div style="width:100%; display:block; font-size:14px;">${paragrafosHtml}</div>
                        <div style="width:100%; margin-top:40px; text-align:center;">
                            ${doc.documento_pdf ? `<img src="${doc.documento_pdf}" crossorigin="anonymous" style="max-height:80px; max-width:250px; object-fit:contain; margin:0 auto 10px auto; display:block;">` : `<div style="height:40px;"></div>`}
                            <div style="border-top:1px solid #000; width:300px; margin:0 auto 5px auto;"></div>
                            <b style="font-size:14px; color:#000; display:block; margin:0;">${doc.nome_colaborador || doc.nome}</b>
                            <span style="font-size:12px; color:#555; display:block; margin-top:2px;">CPF: ${doc.cpf || 'Não informado'}</span>
                            <span style="font-size:10px; color:#888; margin-top:15px; display:block;">Assinado digitalmente em: ${dataAssinatura}</span>
                            <span style="font-size:10px; color:#888; display:block;">Hash/Token de Validação: ${doc.token}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };

    window.baixarPdfDocumentoAvulso = function(id) {
        const doc = window.dadosAvulsosAtuais.find(d => String(d.id) === String(id));
        if (!doc) return mostrarAviso("Documento não encontrado.");

        const dataAssinatura = doc.assinado_em
            ? new Date(doc.assinado_em).toLocaleDateString('pt-BR') + ' às ' + new Date(doc.assinado_em).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            : 'Data não registrada';
        const urlLogoReal = logoParaEmpresa(doc.empresa);
        const paragrafosHtml = (doc.conteudo_texto || '')
            .replace(/\r\n/g, '\n')
            .split('\n')
            .map(linha => linha.trim() === '' ? '<div style="height: 15px;"></div>' : `<div style="margin-bottom: 8px; line-height: 1.6; text-align: justify;">${linha}</div>`)
            .join('');
        const nome = doc.nome_colaborador || doc.nome || '';

        const conteudoHTML = `
        <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
        <title>${doc.titulo_documento || doc.titulo} - ${nome}</title>
        <style>
            body { font-family: Arial, Helvetica, sans-serif; color:#000; margin:0; padding:40px; background:#e2e8f0; }
            .folha-a4 { background:#fff; max-width:800px; margin:0 auto; padding:50px 60px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
            @media print {
                body { background:#fff; padding:0; }
                .folha-a4 { box-shadow:none; padding:0; max-width:100%; }
                @page { margin: 15mm; }
                @page :first { margin-top: 0mm; }
                .topo-primeira-pagina { padding-top: 15mm !important; }
            }
        </style></head><body>
            <div class="folha-a4 topo-primeira-pagina">
                <div style="text-align:center; margin-bottom:30px;">
                    <img src="${urlLogoReal}" style="max-width:120px; margin-bottom:15px;">
                    <h2 style="font-size:18px; text-transform:uppercase; margin:0; color:#002347;">${doc.titulo_documento || doc.titulo}</h2>
                </div>
                <div style="width:100%; display:block; font-size:14px;">${paragrafosHtml}</div>
                <div style="width:100%; margin-top:40px; text-align:center;">
                    ${doc.documento_pdf ? `<img src="${doc.documento_pdf}" style="max-height:80px; max-width:250px; object-fit:contain; margin:0 auto 10px auto; display:block;">` : `<div style="height:40px;"></div>`}
                    <div style="border-top:1px solid #000; width:300px; margin:0 auto 5px auto;"></div>
                    <b style="font-size:14px; color:#000; display:block; margin:0;">${nome}</b>
                    <span style="font-size:12px; color:#555; display:block; margin-top:2px;">CPF: ${doc.cpf || 'Não informado'}</span>
                    <span style="font-size:10px; color:#888; margin-top:15px; display:block;">Assinado digitalmente em: ${dataAssinatura}</span>
                    <span style="font-size:10px; color:#888; display:block;">Hash/Token de Validação: ${doc.token}</span>
                </div>
            </div>
        </body></html>`;

        mostrarAviso("Preparando documento para impressão...");
        const novaJanela = window.open('', '_blank');
        novaJanela.document.write(conteudoHTML);
        novaJanela.document.close();
        setTimeout(() => {
            novaJanela.onafterprint = function() { novaJanela.close(); };
            novaJanela.print();
        }, 800);
    };

    // =========================================================
    // RECIBOS DE EPI
    // =========================================================
    window.visualizarReciboEPIMontado = function(idEpi) {
        const epi = window.dadosEpiAtuais.find(e => String(e.id) === String(idEpi));
        if (!epi) return mostrarAviso("Recibo não encontrado.");

        const mesesExtenso = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const partesMesAno = (epi.mes_ano || '').split('/');
        const mesTitulo = mesesExtenso[parseInt(partesMesAno[0]) - 1] ? mesesExtenso[parseInt(partesMesAno[0]) - 1].toUpperCase() : '';

        const dataAssinatura = epi.assinado_em ? new Date(epi.assinado_em) : new Date();
        const diaAss = String(dataAssinatura.getDate()).padStart(2, '0');
        const mesAss = mesesExtenso[dataAssinatura.getMonth()];
        const anoAss = dataAssinatura.getFullYear();
        const horaAss = dataAssinatura.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

        const modalHtml = `
        <div id="modal-ver-epi-avulso" class="modal-doc-overlay">
            <div class="modal-doc-card" style="border-color:#28a745;">
                <div class="modal-doc-topo">
                    <h3 style="color:#28a745;"><i class="fa-solid fa-helmet-safety"></i> Recibo de EPI</h3>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-imprimir-modal" style="background:#28a745; color:#fff;" onclick="baixarPdfReciboEpi('${epi.id}')"><i class="fa-solid fa-download"></i> Baixar PDF</button>
                        <button class="btn-fechar-modal" onclick="fecharModal('modal-ver-epi-avulso')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="modal-doc-fundo">
                    <div id="folha-a4-epi-${epi.id}" style="background:#fff; width:100%; max-width:794px; padding:60px; box-sizing:border-box; color:#000; box-shadow:0 10px 25px rgba(0,0,0,0.2); font-family:'Arial', sans-serif;">
                        <h2 style="text-align:center; text-transform:uppercase; margin-bottom:40px; font-size:18px; font-weight:bold;">RECIBO DE ENTREGA DE EPI DE <span style="font-weight:bold;">${mesTitulo}</span></h2>
                        <p style="font-size:16px; line-height:1.6; text-align:justify; margin-bottom:30px;">
                            Eu <span style="font-weight:bold;">${epi.nome}</span>, inscrito no CPF <span style="font-weight:bold;">${epi.cpf || 'Não Informado'}</span>,
                            recebi nesta data, todos os EPIs necessários para a realização do meu trabalho em segurança de acordo com a minha função, entre eles, luvas impermeáveis nitrílicas, luvas impermeáveis de vinil, máscaras descartáveis, máscaras N95, óculos de segurança. Estou ciente de que é meu dever cuidar, zelar e fazer bom uso dos EPIs fornecidos pela empresa. Declaro ciência de que comprovado mal uso, falta de zelo e a utilização fora do posto de trabalho são passíveis de advertência disciplinar.
                        </p>
                        <p style="text-align:right; font-size:16px; margin-bottom:60px;"><span style="font-weight:bold;">${diaAss}</span> de <span style="font-weight:bold;">${mesAss}</span> de <span>${anoAss}</span>.</p>
                        <div style="display:flex; align-items:flex-end; gap:10px;">
                            <span style="font-weight:bold; font-size:16px; margin-bottom:10px;">Assinatura:</span>
                            <div style="border-bottom:1px solid #000; flex:1; text-align:center; position:relative;">
                                <img src="${epi.documento_pdf}" crossorigin="anonymous" style="max-height:70px; max-width:250px; object-fit:contain; display:block; margin:0 auto;">
                            </div>
                        </div>
                        <div style="text-align:center; margin-top:20px;">
                            <span style="font-size:10px; color:#888; display:block;">Assinado digitalmente em: ${diaAss}/${String(dataAssinatura.getMonth()+1).padStart(2,'0')}/${anoAss} às ${horaAss}</span>
                            <span style="font-size:10px; color:#888; display:block;">Token de Validação: ${epi.token}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };

    window.baixarPdfReciboEpi = function(id) {
        const elementoParaImprimir = document.getElementById(`folha-a4-epi-${id}`);
        if (!elementoParaImprimir) return mostrarAviso("Documento não encontrado na tela.");
        const htmlElemento = elementoParaImprimir.innerHTML;

        const conteudoHTML = `
        <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Recibo_EPI</title>
        <style>
            body { font-family: Arial, Helvetica, sans-serif; color:#000; margin:0; padding:40px; background:#e2e8f0; }
            .folha-a4 { background:#fff; max-width:800px; margin:0 auto; padding:50px 60px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
            @media print {
                body { background:#fff; padding:0; }
                .folha-a4 { box-shadow:none; padding:0; max-width:100%; }
                @page { margin: 15mm; }
                @page :first { margin-top: 0mm; }
                .topo-primeira-pagina { padding-top: 15mm !important; }

        const modalHtml = `
        <div id="modal-ver-aviso-previo" class="modal-doc-overlay">
            <div class="modal-doc-card" style="border-color:#4fc3f7;">
                <div class="modal-doc-topo">
                    <h3 style="color:#4fc3f7;"><i class="fa-solid fa-file-contract"></i> Documento Gerado pelo Sistema</h3>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-imprimir-modal" style="background:#4fc3f7; color:#000;" onclick="imprimirAvisoPrevio()"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
                        <button class="btn-fechar-modal" onclick="fecharModal('modal-ver-aviso-previo')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="modal-doc-fundo">
                    <div style="background:#fff; width:100%; max-width:794px; box-sizing:border-box; box-shadow:0 10px 25px rgba(0,0,0,0.2);">${htmlCarta}</div>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };

    window.imprimirAvisoPrevio = function() {
        const colab = window.colabAtualCompleto;
        if (!colab) return;
        const htmlCarta = gerarHtmlAvisoOficial(colab);

        const conteudoHTML = `
        <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Aviso_Previo</title>
        <style>
            body { margin:0; padding:0; background:#fff; }
            @media print {
                @page { size: A4 portrait; margin: 15mm; }
                @page :first { margin-top: 0mm; }
                .topo-primeira-pagina { padding-top: 15mm !important; }
            }
        </style></head><body>
            <div class="topo-primeira-pagina">${htmlCarta}</div>
        </body></html>`;

        mostrarAviso("Preparando documento para impressão...");
        const novaJanela = window.open('', '_blank');
        novaJanela.document.write(conteudoHTML);
        novaJanela.document.close();
        setTimeout(() => {
            novaJanela.onafterprint = function() { novaJanela.close(); };
            novaJanela.print();
        }, 800);
    };

    // =========================================================
    // MONTAGEM DAS PASTAS (somente leitura)
    // =========================================================
    function toggleFolder(el) {
        el.parentElement.classList.toggle('aberta');
    }

    function criarCaixaPasta(titulo, icon, cor, htmlSistema, qtd) {
        const conteudoFinal = htmlSistema && htmlSistema.trim()
            ? htmlSistema
            : `<div class="pasta-vazia"><i class="fa-regular fa-folder-open" style="font-size:1.5rem; display:block; margin-bottom:6px; opacity:0.5;"></i>Pasta vazia</div>`;
        return `
        <div class="pasta">
            <div class="pasta-header" style="border-left:4px solid ${cor};" onclick="toggleFolder(this)">
                <i class="fa-solid ${icon}" style="color:${cor};"></i>
                <span>${titulo}</span>
                ${qtd > 0 ? `<span class="pasta-badge-count">${qtd}</span>` : ''}
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="pasta-body">${conteudoFinal}</div>
        </div>`;
    }

    function linkDoc(url, texto, cor) {
        return `<a href="${url}" target="_blank" class="doc-link" style="background:${cor}18; border-color:${cor}59; color:${cor};">
            <span><i class="fa-solid fa-file-pdf"></i> ${texto}</span>
            <i class="fa-solid fa-download"></i>
        </a>`;
    }

    function botaoDoc(onclick, texto, icon, cor) {
        return `<button type="button" class="doc-btn" style="background:${cor}18; border-color:${cor}59; color:${cor};" onclick="${onclick}">
            <span><i class="fa-solid ${icon}"></i> ${texto}</span>
        </button>`;
    }

    // =========================================================
    // FLUXO: token na URL -> PIN (4 últimos dígitos do CPF) -> Edge Function
    // -----------------------------------------------------------------------
    // Nada de sensível é buscado/baixado antes do PIN ser conferido. Quem
    // valida o PIN é a Edge Function (documentos-colaborador-publico), que
    // roda no servidor com a chave de serviço — o CPF completo nunca chega
    // no navegador, só o resultado depois de validado.
    // =========================================================
    let tokenAtual = '';

    (function init() {
        const params = new URLSearchParams(window.location.search);
        tokenAtual = params.get('token') || '';
        const titulo = document.getElementById('titulo-nome');
        const corpo = document.getElementById('corpo-conteudo');

        if (!tokenAtual) {
            titulo.textContent = 'Link inválido';
            corpo.innerHTML = '<div class="estado"><i class="fa-solid fa-triangle-exclamation"></i>Nenhum colaborador informado no link.</div>';
            return;
        }

        const input = document.getElementById('input-pin');
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tentarAcesso(); });
        input.focus();
    })();

    window.tentarAcesso = async function() {
        const input = document.getElementById('input-pin');
        const btn = document.getElementById('btn-pin-entrar');
        const erroBox = document.getElementById('pin-erro');
        const titulo = document.getElementById('titulo-nome');
        const corpo = document.getElementById('corpo-conteudo');
        const pin = (input.value || '').replace(/\D/g, '');

        erroBox.style.display = 'none';

        if (pin.length !== 4) {
            erroBox.textContent = 'Digite os 4 dígitos do PIN.';
            erroBox.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

        try {
            const resp = await fetch(URL_FUNCAO_DOCUMENTOS, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                },
                body: JSON.stringify({ token: tokenAtual, pin }),
            });
            const dados = await resp.json();

            if (!resp.ok) {
                erroBox.textContent = dados.erro || 'Não foi possível validar o PIN.';
                erroBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-unlock"></i> Acessar Documentos';
                input.value = '';
                input.focus();
                return;
            }

            titulo.textContent = dados.colaborador?.nome || 'Colaborador';
            montarDocumentos(dados);

        } catch (e) {
            erroBox.textContent = 'Erro de conexão. Tente novamente.';
            erroBox.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-unlock"></i> Acessar Documentos';
        }
    };

    function montarDocumentos(dados) {
        const corpo = document.getElementById('corpo-conteudo');
        const colab = dados.colaborador || {};
        window.colabAtualCompleto = colab;
        window.dadosAvulsosAtuais = dados.documentosAvulsos || [];
        window.dadosEpiAtuais = dados.recibosEpi || [];
        window.dadosDesempenhoAtuais = dados.avaliacoesDesempenho || [];

        if (colab.empresa && colab.empresa.trim().toUpperCase().includes('VILLAC')) {
            document.getElementById('logo-empresa').src = logoParaEmpresa(colab.empresa);
        }

        const adm = colab.dados_admissao || {};

        let html = `
            <div class="info-linha">CPF: <b>${mascaraCPF(adm.cpf)}</b></div>
            <div class="info-linha">Unidade: <b>${colab.unidade || '-'}</b></div>
            <div class="info-linha">Função: <b>${adm.cargo || '-'}</b></div>
        `;

        let temAlgumDocumento = false;

        // 1. ADMISSÃO
        let htmlAdm = '';
        let qtdAdm = 0;
        if (adm.documento_consolidado_url) {
            htmlAdm += `<a href="${adm.documento_consolidado_url}" target="_blank" class="doc-link destaque"><span><i class="fa-solid fa-file-zipper"></i> Baixar Tudo em 1 PDF</span><i class="fa-solid fa-download"></i></a>`;
            qtdAdm++; temAlgumDocumento = true;
        }
        if (adm.documentosDetalhados && Object.keys(adm.documentosDetalhados).length > 0) {
            Object.keys(adm.documentosDetalhados).forEach((tipoId) => {
                const urls = adm.documentosDetalhados[tipoId] || [];
                if (tipoId === 'foto-cracha') return;
                urls.forEach((url, i) => {
                    const sufixo = urls.length > 1 ? ` (${i + 1}/${urls.length})` : '';
                    htmlAdm += linkDoc(url, labelDoc(tipoId) + sufixo, '#28a745');
                    qtdAdm++; temAlgumDocumento = true;
                });
            });
        } else if (adm.documentos && adm.documentos.length > 0) {
            adm.documentos.forEach((url, i) => {
                htmlAdm += linkDoc(url, 'Documento ' + (i + 1), '#28a745');
                qtdAdm++; temAlgumDocumento = true;
            });
        }
        html += criarCaixaPasta('Admissão e Contratos', 'fa-folder-open', '#28a745', htmlAdm, qtdAdm);

        // 2. RESCISÃO
        let htmlResc = '';
        let qtdResc = 0;
        const r = colab.dados_rescisao;
        if (r) {
            if (r.documentos) r.documentos.forEach((lnk, i) => { htmlResc += linkDoc(lnk, 'Doc Gestor ' + (i + 1), '#dc3545'); qtdResc++; temAlgumDocumento = true; });
            if (r.doc_gerado_rh) {
                if (r.doc_gerado_rh === 'GERADO_SISTEMA') {
                    htmlResc += botaoDoc("abrirModalAvisoPrevio()", 'Termo RH (Visualizar/Imprimir)', 'fa-print', '#4fc3f7');
                } else {
                    htmlResc += linkDoc(r.doc_gerado_rh, 'Termo RH', '#4fc3f7');
                }
                qtdResc++; temAlgumDocumento = true;
            }
            if (r.doc_assinado) { htmlResc += linkDoc(r.doc_assinado, 'Termo Assinado', '#28a745'); qtdResc++; temAlgumDocumento = true; }
        }
        html += criarCaixaPasta('Rescisão / Desligamento', 'fa-user-slash', '#dc3545', htmlResc, qtdResc);

        // 3. ATESTADOS
        let htmlAus = '';
        const aus = dados.ausencias || [];
        aus.forEach(a => { htmlAus += linkDoc(a.documento, `${formatarDataBR(a.data_inicio)} - ${a.motivo}`, '#ff9800'); temAlgumDocumento = true; });
        html += criarCaixaPasta('Atestados e Licenças', 'fa-user-clock', '#ff9800', htmlAus, aus.length);

        // 4. MEDIDAS DISCIPLINARES
        let htmlAdv = '';
        let qtdAdv = 0;
        const adv = dados.advertencias || [];
        adv.forEach(a => {
            const dataFormat = a.created_at ? formatarDataBR(a.created_at.split('T')[0]) : 'Data não informada';
            let links = '';
            if (a.evidencias) a.evidencias.forEach((e, i) => links += `<a href="${e}" target="_blank" style="display:inline-block; margin:0 6px 6px 0; text-decoration:none; padding:5px 9px; border-radius:6px; background:#f1f5f9; color:#334155; font-size:0.78rem;"><i class="fa-solid fa-paperclip"></i> Evidência ${i + 1}</a>`);
            if (a.carta_rh) links += `<a href="${a.carta_rh}" target="_blank" style="display:inline-block; margin:0 6px 6px 0; text-decoration:none; padding:5px 9px; border-radius:6px; background:#e0f2fe; color:#0369a1; font-size:0.78rem;"><i class="fa-solid fa-file-export"></i> Carta RH</a>`;
            if (a.documento_assinado) links += `<a href="${a.documento_assinado}" target="_blank" style="display:inline-block; margin:0 6px 6px 0; text-decoration:none; padding:5px 9px; border-radius:6px; background:#dcfce7; color:#15803d; font-size:0.78rem;"><i class="fa-solid fa-check-double"></i> Assinada</a>`;
            if (links) { htmlAdv += `<div style="margin-bottom:10px; padding:10px; background:#f8fafc; border-radius:8px;"><strong style="color:#b45309; font-size:0.78rem; display:block; margin-bottom:5px;">Data: ${dataFormat}</strong>${links}</div>`; qtdAdv++; temAlgumDocumento = true; }
        });
        html += criarCaixaPasta('Medidas Disciplinares', 'fa-gavel', '#b45309', htmlAdv, qtdAdv);

        // 5. ALTERAÇÕES CADASTRAIS
        let htmlAlt = '';
        const alt = dados.alteracoes || [];
        alt.forEach(a => {
            const dataFormatAlt = a.created_at ? formatarDataBR(a.created_at.split('T')[0]) : 'Data não informada';
            htmlAlt += linkDoc(a.anexo, 'Alteração de ' + dataFormatAlt, '#20c997');
            temAlgumDocumento = true;
        });
        html += criarCaixaPasta('Alterações Cadastrais', 'fa-user-pen', '#20c997', htmlAlt, alt.length);

        // 6. JUSTIFICATIVAS DE PONTO
        let htmlPonto = '';
        let qtdPonto = 0;
        const ponto = dados.ocorrenciasPonto || [];
        ponto.forEach(o => {
            let l = '';
            if (o.doc_rh) l += `<a href="${o.doc_rh}" target="_blank" style="display:inline-block; margin:0 6px 6px 0; text-decoration:none; padding:5px 9px; border-radius:6px; background:#f1f5f9; color:#334155; font-size:0.78rem;"><i class="fa-solid fa-file-pdf"></i> Espelho RH</a>`;
            if (o.doc_colaborador) l += `<a href="${o.doc_colaborador}" target="_blank" style="display:inline-block; margin:0 6px 6px 0; text-decoration:none; padding:5px 9px; border-radius:6px; background:#e0f2fe; color:#0369a1; font-size:0.78rem;"><i class="fa-solid fa-file-signature"></i> Justificativa Colaborador</a>`;
            if (l) { htmlPonto += `<div style="margin-bottom:10px; padding:10px; background:#f8fafc; border-radius:8px;"><strong style="color:#475569; font-size:0.78rem; display:block; margin-bottom:5px;">Data da Falha: ${formatarDataBR(o.data_falha)}</strong>${l}</div>`; qtdPonto++; temAlgumDocumento = true; }
        });
        html += criarCaixaPasta('Justificativas de Ponto', 'fa-clock', '#64748b', htmlPonto, qtdPonto);

        // 7. RECIBOS DE EPI
        let htmlEPI = '';
        const epis = (dados.recibosEpi || []).slice().sort((a, b) => new Date(b.assinado_em) - new Date(a.assinado_em));
        epis.forEach(epi => {
            const dataAssinado = new Date(epi.assinado_em).toLocaleDateString('pt-BR');
            htmlEPI += botaoDoc(`visualizarReciboEPIMontado('${epi.id}')`, `Recibo EPI - ${epi.mes_ano} <small>(${dataAssinado})</small>`, 'fa-file-signature', '#00bcd4');
            temAlgumDocumento = true;
        });
        html += criarCaixaPasta('Recibos de EPI (Assinados)', 'fa-helmet-safety', '#00bcd4', htmlEPI, epis.length);

        // 8. AVALIAÇÕES DE DESEMPENHO
        let htmlDesempenho = '';
        let qtdDesempenho = 0;
        const avals = (dados.avaliacoesDesempenho || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        avals.forEach(d => {
            const dataFormat = new Date(d.created_at).toLocaleDateString('pt-BR');
            let links = '';
            if (d.documento) links += botaoDoc(`visualizarDesempenhoMontado('${d.id}')`, 'Ver Avaliação Completa', 'fa-file-invoice', '#00bcd4');
            if (d.documento_assinado) links += linkDoc(d.documento_assinado, 'Termo Assinado', '#28a745');
            if (links) { htmlDesempenho += `<div style="margin-bottom:10px; padding:10px; background:#f8fafc; border-radius:8px;"><strong style="color:#00bcd4; font-size:0.78rem; display:block; margin-bottom:5px;">Ciclo: ${dataFormat}</strong>${links}</div>`; qtdDesempenho++; temAlgumDocumento = true; }
        });
        html += criarCaixaPasta('Avaliações de Desempenho', 'fa-chart-line', '#00bcd4', htmlDesempenho, qtdDesempenho);

        // 9. TERMOS AVULSOS
        let htmlAvulsos = '';
        const avulsos = (dados.documentosAvulsos || []).slice().sort((a, b) => new Date(b.created_at || b.criado_em) - new Date(a.created_at || a.criado_em));
        avulsos.forEach(doc => {
            const dataAssinado = new Date(doc.assinado_em || doc.created_at || doc.criado_em).toLocaleDateString('pt-BR');
            htmlAvulsos += botaoDoc(`visualizarDocumentoAvulsoMontado('${doc.id}')`, `${doc.titulo_documento || doc.titulo} (${dataAssinado})`, 'fa-file-signature', '#25D366');
            temAlgumDocumento = true;
        });
        html += criarCaixaPasta('Termos Avulsos (Assinados via WhatsApp)', 'fa-file-contract', '#25D366', htmlAvulsos, avulsos.length);

        html += `<div class="aviso-topo"><i class="fa-solid fa-lock"></i> Acesso restrito via etiqueta/QR gerada pelo RH. Cada pasta pode ser aberta clicando em cima dela.</div>`;

        if (!temAlgumDocumento) {
            html += '<div class="estado" style="padding:20px 0 0;"><i class="fa-solid fa-folder-open"></i>Nenhum documento encontrado nas pastas acima ainda.</div>';
        }

        corpo.innerHTML = html;
    }
</script>
</body>
</html>
