<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Justificativa de Ponto - RH Soul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #002347; --cor-secundaria: #003366; --cor-acento: #ffc107; 
            --cor-texto: #ffffff; --cor-borda: rgba(255, 255, 255, 0.15);
            --cor-fundo-input: rgba(0, 0, 0, 0.2); --cor-sucesso: #28a745;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--cor-principal); color: var(--cor-texto); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .mobile-card {
            background: rgba(0, 25, 51, 0.8); backdrop-filter: blur(15px);
            border: 1px solid var(--cor-acento); border-radius: 16px;
            width: 100%; max-width: 450px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header { text-align: center; border-bottom: 1px dashed var(--cor-borda); padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: var(--cor-acento); font-family: 'Montserrat', sans-serif; margin-bottom: 5px; font-size: 1.5rem;}
        
        .info-box { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #4fc3f7; }
        .info-box p { font-size: 0.9rem; margin-bottom: 5px; color: #a6b0cf; }
        .info-box strong { color: #fff; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #a6b0cf; }
        
        .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        input[type="time"], textarea {
            width: 100%; padding: 12px; background: var(--cor-fundo-input);
            border: 1px solid var(--cor-borda); border-radius: 8px;
            color: white; font-size: 1.1rem; text-align: center; outline: none;
        }
        /* Deixa o reloginho do input time branco no celular */
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        textarea { text-align: left; font-size: 0.95rem; min-height: 80px; resize: vertical; }

        .btn-submit {
            width: 100%; padding: 15px; background: var(--cor-acento); color: #000;
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-doc {
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; padding: 12px;
            background: rgba(79, 195, 247, 0.15); color: #4fc3f7; text-decoration: none;
            border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 8px; font-weight: bold; margin-bottom: 20px;
        }

        .hidden { display: none !important; }
        #sucesso-msg { text-align: center; display: none; }
        #sucesso-msg i { font-size: 4rem; color: var(--cor-sucesso); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="mobile-card" id="card-formulario">
        <div class="header">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Justificar Ponto</h2>
            <p style="font-size: 0.85rem; color: #a6b0cf;">Regularize seus horários pendentes abaixo.</p>
        </div>

        <div class="info-box">
            <p>Colaborador: <strong id="lbl-nome">Carregando...</strong></p>
            <p>Unidade: <strong id="lbl-unidade">-</strong></p>
            <p>Data da Ocorrência: <strong id="lbl-data" style="color: var(--cor-acento);">-</strong></p>
        </div>

        <a href="#" id="btn-ver-doc" target="_blank" class="btn-doc hidden"><i class="fa-solid fa-file-pdf"></i> Ver Documento do RH</a>

        <form id="form-justificativa">
            <h4 style="color: var(--cor-acento); margin-bottom: 10px; font-size: 0.95rem; border-bottom: 1px dashed var(--cor-borda); padding-bottom: 5px;">Quais foram seus horários neste dia?</h4>
            
            <div class="time-grid">
                <div class="form-group">
                    <label>1. Entrada</label>
                    <input type="time" id="hora-entrada" required>
                </div>
                <div class="form-group">
                    <label>2. Ida Refeição</label>
                    <input type="time" id="hora-ida-ref">
                </div>
                <div class="form-group">
                    <label>3. Volta Refeição</label>
                    <input type="time" id="hora-volta-ref">
                </div>
                <div class="form-group">
                    <label>4. Saída</label>
                    <input type="time" id="hora-saida" required>
                </div>
            </div>

            <div class="form-group">
                <label>Justificativa / Motivo</label>
                <textarea id="texto-motivo" required placeholder="Ex: Esqueci de bater o ponto na saída porque acabou a energia..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="btn-enviar">
                <i class="fa-solid fa-paper-plane"></i> Enviar ao RH
            </button>
        </form>
    </div>

    <div class="mobile-card" id="sucesso-msg">
        <i class="fa-solid fa-circle-check"></i>
        <h2 style="color: var(--cor-sucesso); margin-bottom: 10px;">Enviado!</h2>
        <p style="color: #a6b0cf; font-size: 0.95rem; margin-bottom: 20px;">Sua justificativa de ponto foi enviada para o RH com sucesso.</p>
        <p style="color: #fff; font-weight: bold;">Você já pode fechar esta tela.</p>
    </div>

    <script>
        // COLOQUE SUAS CHAVES DO SUPABASE AQUI!
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Ler os dados da URL (Link Mágico)
        const urlParams = new URLSearchParams(window.location.search);
        const colabId = urlParams.get('id');
        const nome = urlParams.get('nome');
        const unidade = urlParams.get('unidade');
        const dataFalha = urlParams.get('data');
        const docLink = urlParams.get('doc');

        // Preenche a tela
        if(nome) document.getElementById('lbl-nome').innerText = nome;
        if(unidade) document.getElementById('lbl-unidade').innerText = unidade;
        
        if(dataFalha) {
            const [ano, mes, dia] = dataFalha.split('-');
            document.getElementById('lbl-data').innerText = `${dia}/${mes}/${ano}`;
        }

        if(docLink && docLink !== 'null') {
            const btnDoc = document.getElementById('btn-ver-doc');
            btnDoc.href = docLink;
            btnDoc.classList.remove('hidden');
        }

        // Bloqueia se abrirem o link sem os parâmetros principais
        if(!colabId || !dataFalha) {
            document.getElementById('card-formulario').innerHTML = '<h3 style="color: #dc3545; text-align:center;"><i class="fa-solid fa-triangle-exclamation"></i> Link Inválido ou Expirado.</h3><p style="text-align:center; color:#a6b0cf; margin-top:10px;">Solicite um novo link à Clara (RH).</p>';
        }

        // Salvar no Banco
        document.getElementById('form-justificativa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';

            const obj = {
                colaborador_id: colabId,
                nome: nome,
                unidade: unidade,
                data_falha: dataFalha,
                documento_rh: docLink,
                entrada: document.getElementById('hora-entrada').value,
                ida_refeicao: document.getElementById('hora-ida-ref').value || null,
                volta_refeicao: document.getElementById('hora-volta-ref').value || null,
                saida: document.getElementById('hora-saida').value,
                justificativa: document.getElementById('texto-motivo').value,
                status: 'Pendente'
            };

            // Inserindo na tabela
            const { error } = await supabaseClient.from('ocorrencias_ponto').insert([obj]);

            if (error) {
                alert("Erro ao enviar para o RH: " + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Tentar Novamente';
            } else {
                // Notifica o Admin na Central!
                await supabaseClient.from('notificacoes').insert([{
                    colaborador_id: colabId, 
                    nome: `Ocorrência Respondida: ${nome}`, 
                    unidade: unidade, 
                    lida: false, 
                    tipo: 'Ocorrencia_Ponto'
                }]);

                document.getElementById('card-formulario').style.display = 'none';
                document.getElementById('sucesso-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
