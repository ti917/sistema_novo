<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feedback Trimestral</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #00152b; /* Tema Escuro Profundo RH Soul */
            --card: #002347;
            --text: #ffffff;
            --subtext: #a6b0cf;
            --accent: #00bcd4;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --borda: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(135deg, var(--bg) 0%, var(--card) 100%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: rgba(0, 35, 71, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid var(--borda);
            border-top: 4px solid var(--accent);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 15px;
            background: rgba(0, 188, 212, 0.1);
            padding: 20px;
            border-radius: 50%;
            border: 1px solid rgba(0, 188, 212, 0.3);
        }
        h2 { 
            color: var(--text); 
            margin: 0 0 5px 0; 
            font-size: 1.4rem;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .info-box {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--borda);
        }
        .info-label { 
            color: var(--subtext); 
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        .info-value { 
            font-size: 1rem;
            font-weight: bold; 
            color: #fff;
        }
        .classificacao-box {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid transparent;
            background: rgba(0,0,0,0.2);
        }
        .classificacao-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext);
            margin-bottom: 5px;
            display: block;
        }
        .classificacao-nota {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .feedback-box { 
            background: rgba(0, 188, 212, 0.05); 
            border-radius: 8px; 
            border: 1px dashed var(--accent); 
            padding: 20px;
            margin-bottom: 25px;
        }
        .feedback-box h4 {
            color: var(--accent);
            margin: 0 0 10px 0;
            font-size: 1rem;
        }
        .feedback-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }
        .btn-download { 
            width: 100%; 
            padding: 16px; 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.4);
        }
        .footer-hash {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="bloco-loading">
        <div style="text-align: center; padding: 40px 0;">
            <i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent); margin-bottom: 20px;"></i>
            <h3 style="margin: 0;">Buscando Avaliação Oficial...</h3>
            <p style="color: var(--subtext); font-size: 0.9rem;">Autenticando dados de forma segura.</p>
        </div>
    </div>

    <div class="card" id="bloco-conteudo" style="display: none;">
        <div class="logo-area">
            <i class="fa-solid fa-file-contract"></i>
            <h2>Avaliação de Desempenho</h2>
            <span style="font-size: 0.85rem; color: var(--success);"><i class="fa-solid fa-check-circle"></i> Ciclo Concluído</span>
        </div>

        <div class="info-grid">
            <div class="info-box" style="grid-column: span 2;">
                <span class="info-label">Colaborador(a)</span>
                <span class="info-value" id="nome-colaborador"></span>
            </div>
            <div class="info-box">
                <span class="info-label">Gestor Responsável</span>
                <span class="info-value" id="nome-gestor"></span>
            </div>
            <div class="info-box">
                <span class="info-label">Data de Fechamento</span>
                <span class="info-value" id="data-conversa"></span>
            </div>
        </div>

        <div class="classificacao-box" id="box-classificacao">
            <span class="classificacao-title">Resultado / Classificação</span>
            <span class="classificacao-nota" id="nota-final"></span>
        </div>

        <div class="feedback-box">
            <h4><i class="fa-solid fa-comments"></i> Considerações Finais do Gestor</h4>
            <div class="feedback-text" id="texto-feedback"></div>
        </div>

        <button id="btn-download-pdf" class="btn-download" onclick="gerarPdfNaHora()">
    <i class="fa-solid fa-file-pdf"></i> Visualizar/Baixar termo de Avaliação (PDF)
</button>

        <div class="footer-hash">
            Documento Autenticado Eletronicamente<br>
            Hash: <b id="txt-hash"></b>
        </div>
    </div>
</div>

<script>
    // Inicialize seu Supabase aqui (Mantive a chave do seu código anterior)
    const supabaseClient = supabase.createClient('https://kefvwdxebzgedugqeimz.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZnZ3ZHhlYnpnZWR1Z3FlaW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMjg4ODgsImV4cCI6MjA4OTYwNDg4OH0.l7mFzcZBV-XhVyauwjNxPFZge9w5tHRKEAOY2YJwFZY');

    const urlParams = new URLSearchParams(window.location.search);
    const idAvaliacao = urlParams.get('id');

    // Variável para guardar os dados e a gente não precisar bater no banco de novo
    window.dadosAvaliacaoAtual = null;

    async function carregarDadosFeedback() {
        if(!idAvaliacao) {
            document.getElementById('bloco-loading').innerHTML = "<div style='text-align:center; padding: 40px;'><i class='fa-solid fa-link-slash fa-3x' style='color:#dc3545; margin-bottom: 20px;'></i><h3>Erro no Link</h3><p>O identificador da avaliação não foi encontrado na URL.</p></div>";
            return;
        }

        try {
            const { data, error } = await supabaseClient.from('avaliacoes_desempenho').select('*').eq('id', idAvaliacao).single();

            if (error || !data) throw error;
            
            // 👇 Guarda os dados na memória para o Gerador de PDF
            window.dadosAvaliacaoAtual = data; 

            // Extração Inteligente das Tags
            let textoCompletoBd = data.pontos_melhorar || '';
            let classificacao = 'Não definida';
            let consideracoes = 'Sem considerações adicionais do gestor.';
            let hash = 'N/A';

            if (textoCompletoBd.includes('[CLASSIFICAÇÃO:')) {
                const matchClass = textoCompletoBd.match(/\[CLASSIFICAÇÃO:\s*([^\]]+)\]/);
                if(matchClass) classificacao = matchClass[1];
            }
            if (textoCompletoBd.includes('[CONSIDERAÇÕES:')) {
                const matchCons = textoCompletoBd.match(/\[CONSIDERAÇÕES:\s*([^\]]+)\]/);
                if(matchCons) consideracoes = matchCons[1];
            }
            if (textoCompletoBd.includes('[AUTENTICAÇÃO:')) {
                const matchAuth = textoCompletoBd.match(/\[AUTENTICAÇÃO:\s*([^\]]+)\]/);
                if(matchAuth) hash = matchAuth[1];
            }

            // Preenche os dados visuais na tela do celular
            document.getElementById('nome-colaborador').innerText = data.nome_colaborador;
            document.getElementById('nome-gestor').innerText = data.criado_por || 'Gestor da Unidade';
            
            const dataAssinatura = new Date(data.data_assinatura_colaborador || data.created_at);
            document.getElementById('data-conversa').innerText = dataAssinatura.toLocaleDateString('pt-BR');

            const boxClass = document.getElementById('box-classificacao');
            const txtNota = document.getElementById('nota-final');
            txtNota.innerText = classificacao;

            if (classificacao === 'BOM') {
                boxClass.style.borderColor = 'var(--success)';
                boxClass.style.background = 'rgba(40, 167, 69, 0.1)';
                txtNota.style.color = 'var(--success)';
            } else if (classificacao === 'SATISFATÓRIO') {
                boxClass.style.borderColor = 'var(--warning)';
                boxClass.style.background = 'rgba(255, 193, 7, 0.1)';
                txtNota.style.color = 'var(--warning)';
            } else {
                boxClass.style.borderColor = 'var(--danger)';
                boxClass.style.background = 'rgba(220, 53, 69, 0.1)';
                txtNota.style.color = 'var(--danger)';
            }

            document.getElementById('texto-feedback').innerText = consideracoes;
            document.getElementById('txt-hash').innerText = hash;

            // Troca de tela
            document.getElementById('bloco-loading').style.display = 'none';
            document.getElementById('bloco-conteudo').style.display = 'block';

        } catch (e) {
            document.getElementById('bloco-loading').innerHTML = "<div style='text-align:center; padding: 40px;'><i class='fa-solid fa-triangle-exclamation fa-3x' style='color:#dc3545; margin-bottom: 20px;'></i><h3>Erro de Acesso</h3><p>Não foi possível localizar o documento no servidor. Ele pode ter sido apagado ou estar indisponível.</p></div>";
        }
    }

    // ===============================================================
    // A MÁGICA: GERADOR DE PDF DIRETO PARA DOWNLOAD (COM CARGO INCLUSO)
    // ===============================================================
    window.gerarPdfNaHora = async function() {
        const data = window.dadosAvaliacaoAtual;
        if (!data) return alert("Os dados ainda não foram carregados completamente.");

        const btn = document.getElementById('btn-download-pdf');
        const txtOriginal = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Montando PDF...';
        btn.disabled = true;

        try {
            let textoCompletoBd = data.pontos_melhorar || '';
            let classificacao = 'Não definida';
            let consideracoes = 'Sem considerações registradas.';
            let hash = 'N/A';
            let urlAssinaturaGestor = '';
            let urlAssinaturaColab = data.documento_assinado || ''; 

            if (textoCompletoBd.includes('[CLASSIFICAÇÃO:')) {
                const matchClass = textoCompletoBd.match(/\[CLASSIFICAÇÃO:\s*([^\]]+)\]/);
                if (matchClass) { classificacao = matchClass[1].trim(); textoCompletoBd = textoCompletoBd.replace(matchClass[0], '').trim(); }
            }
            if (textoCompletoBd.includes('[CONSIDERAÇÕES:')) {
                const matchCons = textoCompletoBd.match(/\[CONSIDERAÇÕES:\s*([^\]]+)\]/);
                if (matchCons) { consideracoes = matchCons[1].trim(); textoCompletoBd = textoCompletoBd.replace(matchCons[0], '').trim(); }
            }
            if (textoCompletoBd.includes('[AUTENTICAÇÃO:')) {
                const matchAuth = textoCompletoBd.match(/\[AUTENTICAÇÃO:\s*([^\]]+)\]/);
                if (matchAuth) { hash = matchAuth[1].trim(); textoCompletoBd = textoCompletoBd.replace(matchAuth[0], '').trim(); }
            }
            if (textoCompletoBd.includes('[ASSINATURA_GESTOR:')) {
                const matchAss = textoCompletoBd.match(/\[ASSINATURA_GESTOR:\s*([^\]]+)\]/);
                if (matchAss) { urlAssinaturaGestor = matchAss[1].trim(); textoCompletoBd = textoCompletoBd.replace(matchAss[0], '').trim(); }
            }
            if (textoCompletoBd.includes('[ASSINATURA_COLAB:')) {
                const matchAssC = textoCompletoBd.match(/\[ASSINATURA_COLAB:\s*([^\]]+)\]/);
                if (matchAssC) { urlAssinaturaColab = matchAssC[1].trim(); textoCompletoBd = textoCompletoBd.replace(matchAssC[0], '').trim(); }
            }

            // 👇 MÁGICA: BUSCA O CARGO ATUAL DIRETO DO PERFIL DO COLABORADOR 👇
            const { data: perfilColab } = await supabaseClient.from('perfis').select('dados_admissao').eq('id', data.colaborador_id).single();
            const cargoReal = perfilColab?.dados_admissao?.cargo || 'Não Informado';

            let corClass = classificacao === 'BOM' ? '#28a745' : (classificacao === 'SATISFATÓRIO' ? '#ff9800' : '#dc3545');
            const dataHoje = new Date(data.created_at).toLocaleDateString('pt-BR');
            const nomeEmpresaTopo = data.empresa === 'VILLAC' ? 'RH VILLAC' : (data.empresa === 'SOUL GESTÃO' || data.empresa === 'SOUL' ? 'RH SOUL' : data.empresa);

            // Converter URLs de assinatura para Base64 (Evita bloqueio de imagem no celular)
            const urlToBase64 = async (url) => {
                if (!url || !url.startsWith('http')) return '';
                try {
                    const res = await fetch(url);
                    const blob = await res.blob();
                    return await new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result); reader.readAsDataURL(blob); });
                } catch (e) { return ''; }
            };

            const base64Gestor = await urlToBase64(urlAssinaturaGestor);
            const base64Colab = await urlToBase64(urlAssinaturaColab);

            // Monta a Tabela de Notas
            let tbodyPdf = '';
            if (data.notes || data.notas) {
                const notasFinais = data.notas || data.notes;
                notasFinais.forEach(n => {
                    let c1 = n.nota === "1" ? '<b style="color: #000000; font-size:14px;">X</b>' : '';
                    let c2 = n.nota === "2" ? '<b style="color: #000000; font-size:14px;">X</b>' : '';
                    let c3 = n.nota === "3" ? '<b style="color: #000000; font-size:14px;">X</b>' : '';
                    tbodyPdf += `
                    <tr style="page-break-inside: avoid;">
                        <td style="border: 1px solid #cbd5e1; padding: 4px 6px; text-align: left; color: #000000; font-weight: 500;">${n.criterio}</td>
                        <td style="border: 1px solid #cbd5e1; background: #ffffff; text-align: center;">${c1}</td>
                        <td style="border: 1px solid #cbd5e1; background: #ffffff; text-align: center;">${c2}</td>
                        <td style="border: 1px solid #cbd5e1; background: #ffffff; text-align: center;">${c3}</td>
                    </tr>`;
                });
            }

            // Monta o HTML estruturado do A4
            const htmlFolhaA4 = `
            <div id="pdf-container" style="width: 700px; padding: 40px; background: #ffffff; color: #111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box;">
                <div style="border-bottom: 2px solid #00bcd4; padding: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px;">
                    <div style="width: 140px; text-align: center;">
                        <b style="color: #002347; font-size: 18px;">${nomeEmpresaTopo}</b><br><span style="font-size: 9px; color: #444;">Gestão Inteligente</span>
                    </div>
                    <div style="flex: 1; text-align: center; border-left: 2px solid #00bcd4; border-right: 2px solid #00bcd4; padding: 0 10px;">
                        <h2 style="margin: 0; color: #002347; font-size: 14px; text-transform: uppercase;">AVALIAÇÃO DE DESEMPENHO DO COLABORADOR</h2>
                    </div>
                    <div style="width: 140px; text-align: center; font-size: 10px; color: #333;">
                        <b>Autenticação (Hash):</b><br><span style="font-size: 11px; font-weight: bold; color: #00bcd4;">${hash}</span><br>
                        <b>Data da Avaliação:</b><br><span style="font-size: 11px; font-weight: bold;">${dataHoje}</span>
                    </div>
                </div>

                <div style="background: #333333; color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; margin-bottom: 8px; border-radius: 4px;">1. IDENTIFICAÇÃO</div>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 11px; border-radius: 6px; overflow: hidden; border: 1px solid #cbd5e1; table-layout: fixed;">
                    <tr>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; background: #f8fafc; width: 20%; color: #002347;"><b>Colaborador:</b></td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; width: 80%; color: #111;" colspan="3">${data.nome_colaborador}</td>
                    </tr>
                    <tr>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; background: #f8fafc; color: #002347;"><b>Cargo:</b></td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; color: #111;">${cargoReal}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; background: #f8fafc; color: #002347; width: 20%;"><b>Setor / Unidade:</b></td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; color: #111;">${data.unidade}</td>
                    </tr>
                    <tr>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; background: #f8fafc; color: #002347;"><b>Gestor Resp.:</b></td>
                        <td style="border: 1px solid #cbd5e1; padding: 6px; color: #111;" colspan="3">${data.criado_por || 'Gestor Responsável'}</td>
                    </tr>
                </table>

                <div style="background: #333333; color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; margin-bottom: 8px; border-radius: 4px;">2. ESCALA DE AVALIAÇÃO</div>
                <div style="font-size: 11px; margin-bottom: 15px; display: flex; justify-content: space-around; background: #f8fafc; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <span><b>(1)</b> Insatisfatório</span>
                    <span><b>(2)</b> Satisfatório</span>
                    <span><b>(3)</b> Bom</span>
                </div>

                <div style="background: #333333; color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; margin-bottom: 8px; border-radius: 4px;">3. AVALIAÇÃO DE DESEMPENHO</div>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 10px; text-align: center; border: 1px solid #cbd5e1;">
                    <thead style="display: table-header-group;">
                        <tr style="background-color: #111111; color: #ffffff;">
                            <th style="border: 1px solid #64748b; padding: 6px; text-align: left; width: 55%; font-weight: bold;">CRITÉRIO AVALIADO</th>
                            <th style="border: 1px solid #64748b; padding: 6px; width: 15%; font-weight: bold;">(1) INSATISFATÓRIO</th>
                            <th style="border: 1px solid #64748b; padding: 6px; width: 15%; font-weight: bold;">(2) SATISFATÓRIO</th>
                            <th style="border: 1px solid #64748b; padding: 6px; width: 15%; font-weight: bold;">(3) BOM</th>
                        </tr>
                    </thead>
                    <tbody>${tbodyPdf}</tbody>
                </table>

                <div style="margin-top: -5px; margin-bottom: 15px; text-align: right; font-size: 14px; padding-right: 10px;">
                    <b style="color: #002347;">CLASSIFICAÇÃO FINAL:</b> <span style="font-weight: 900; text-transform: uppercase; color: ${corClass};">${classificacao}</span>
                </div>

                <div style="background: #333333; color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; margin-bottom: 8px; border-radius: 4px;">4. PONTOS A MELHORAR</div>
                <div style="border: 1px solid #cbd5e1; padding: 8px 10px; margin-bottom: 15px; font-size: 11px; min-height: 50px; border-radius: 6px; background: #f8fafc; word-wrap: break-word;">
                    <span style="color: #111;">${textoCompletoBd.replace(/\n/g, '<br>')}</span>
                </div>

                <div style="background: #333333; color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; margin-bottom: 8px; border-radius: 4px;">5. CONSIDERAÇÕES FINAIS DO GESTOR</div>
                <div style="border: 1px solid #64748b; padding: 8px 10px; margin-bottom: 25px; min-height: 90px; border-radius: 6px; background: #ffffff; white-space: pre-wrap; font-size: 11px; color: #111;">${consideracoes}</div>

                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 25px; padding: 0 15px; page-break-inside: avoid;">
                    <div style="text-align: center; width: 45%;">
                        ${base64Gestor ? `<img src="${base64Gestor}" style="height: 40px; max-width: 100%; border-bottom: 1px solid #333; padding-bottom: 2px; display: block; margin: 0 auto; object-fit: contain;">` : `<div style="height: 40px; border-bottom: 1px solid #333; width: 100%;"></div>`}
                        <p style="margin: 3px 0 0 0; font-size: 10px; font-weight: bold; color: #111;">${data.criado_por || 'Gestor Responsável'}</p>
                        <p style="margin: 0; font-size: 9px; color: #666;">Assinatura do Gestor</p>
                    </div>
                    <div style="text-align: center; width: 45%;">
                        ${base64Colab ? `<img src="${base64Colab}" style="height: 40px; max-width: 100%; border-bottom: 1px solid #333; padding-bottom: 2px; display: block; margin: 0 auto; object-fit: contain;">` : `<div style="height: 40px; border-bottom: 1px solid #333; width: 100%;"></div>`}
                        <p style="margin: 3px 0 0 0; font-size: 10px; font-weight: bold; color: #111;">${data.nome_colaborador}</p>
                        <p style="margin: 0; font-size: 9px; color: #666;">Assinatura do Colaborador</p>
                    </div>
                </div>
            </div>`;

            // Mágica anti-tela branca de scroll
            const containerInvisivel = document.createElement('div');
            containerInvisivel.style.position = 'absolute'; containerInvisivel.style.top = '0'; containerInvisivel.style.left = '0'; containerInvisivel.style.zIndex = '-9999';
            containerInvisivel.innerHTML = htmlFolhaA4;
            document.body.appendChild(containerInvisivel);

            const scrollAnterior = window.scrollY;
            window.scrollTo(0, 0);
            await new Promise(resolve => setTimeout(resolve, 500));

            // Configuração e Download Direto
            const opt = {
                margin: [10, 10, 10, 10],
                filename: `Avaliacao_Desempenho_${data.nome_colaborador.replace(/ /g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, logging: false, useCORS: true, scrollY: 0, scrollX: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            await html2pdf().set(opt).from(document.getElementById('pdf-container')).save();

            // Restaura o estado da página
            document.body.removeChild(containerInvisivel);
            window.scrollTo(0, scrollAnterior);

        } catch (e) {
            console.error(e);
            alert("Erro ao gerar o PDF da avaliação.");
        } finally {
            btn.innerHTML = txtOriginal;
            btn.disabled = false;
        }
    };

    // Inicia
    carregarDadosFeedback();
</script>
</body>
</html>
