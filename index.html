<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>RH Goscripts - Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =================================================================== */
        /* COLE AQUI DENTRO TODO O SEU CSS ORIGINAL (AQUELE DE 1500 LINHAS)    */
        /* =================================================================== */
        
        /* Apenas um ajuste para a tela de carregamento global que vamos usar */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body, #002347); z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="global-loader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: #ffc107; margin-bottom: 20px;"></i>
        <h2>Conectando ao sistema...</h2>
    </div>

    <main class="container" id="login-container" class="hidden">
        <section id="login" class="form-section glass-card" style="margin-top: 100px;">
            <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo" style="width: 80px; margin-bottom: 20px;">
            <h2>Acesso ao Portal</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Faça login com seu e-mail e senha.</p>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" required placeholder="seu@email.com" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" required placeholder="••••••••" />
                    </div>
                </div>
                <div id="login-error" style="color: #dc3545; font-size: 0.9rem; margin-bottom: 15px; display: none;"></div>
                
                <button type="submit" id="btn-submit-login" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
            </form>
        </section>
    </main>

    <div id="app-container" class="hidden">
        
        <header class="header-fixo">
            <div class="header-logo-container">
                <button type="button" id="btn-toggle-sidebar" class="sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
                <img id="header-logo-img" src="https://gozgames.neocities.org/1745943001077.jpg" alt="Logo Empresa">
                <h1 id="header-title-text">RH Goscripts</h1> 
            </div>
            <div id="header-info-gestor" style="display: flex; align-items: center; gap: 15px;">
                <span>Olá, <strong id="user-name-display">Carregando...</strong>!</span>
                <span id="user-role-badge" style="background: #ffc107; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold;"></span>
                <button type="button" id="btnLogout" title="Sair da Conta"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <nav class="sidebar" id="sidebar-menu">
            <div class="sidebar-scroll-wrapper">
                <ul id="sidebar-nav-list" class="sidebar-nav-list">
                    </ul>
            </div>
        </nav>

        <main class="container container-largo" style="margin-top: 100px;">
            <section id="tela-inicio" class="form-section">
                <div class="dashboard-header">
                    <div class="dashboard-welcome-content">
                        <h2>Painel de Controle</h2>
                        <p>Você está conectado com sucesso ao novo banco de dados Supabase!</p>
                    </div>
                </div>
            </section>
            </main>
    </div>

    <script>
        // 1. INICIALIZAÇÃO DO SUPABASE (Coloque suas chaves reais aqui!)
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variável global para guardar o usuário
        let usuarioAtual = null;

        // 2. LISTENER DE AUTENTICAÇÃO (Ouve mudanças de login/logout em tempo real)
        supabase.auth.onAuthStateChange(async (event, session) => {
            const loader = document.getElementById('global-loader');
            const loginContainer = document.getElementById('login-container');
            const appContainer = document.getElementById('app-container');

            if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
                if (session) {
                    await carregarPerfilUsuario(session.user.id);
                    loginContainer.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    document.body.classList.add('logado');
                }
            } else if (event === 'SIGNED_OUT') {
                usuarioAtual = null;
                appContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');
                document.body.classList.remove('logado');
            }

            // Esconde o loader quando terminar de checar
            setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.classList.add('hidden'), 500); }, 500);
        });

        // 3. FUNÇÃO DE LOGIN
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-submit-login');
            const errorDiv = document.getElementById('login-error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
            errorDiv.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

            if (error) {
                errorDiv.innerText = "E-mail ou senha incorretos.";
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
            }
            // Se der sucesso, o onAuthStateChange (lá em cima) vai cuidar de trocar a tela!
        });

        // 4. FUNÇÃO DE LOGOUT
        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabase.auth.signOut();
        });

        // 5. CARREGAR DADOS DO PERFIL (Consulta a tabela 'perfis' que criamos no SQL)
        async function carregarPerfilUsuario(userId) {
            const { data, error } = await supabase
                .from('perfis')
                .select('*')
                .eq('id', userId)
                .single();

            if (error) {
                console.error("Erro ao buscar perfil:", error);
                return;
            }

            usuarioAtual = data; // Salva globalmente {id, nome, perfil, empresa}
            
            // Atualiza a Interface
            document.getElementById('user-name-display').innerText = usuarioAtual.nome;
            document.getElementById('user-role-badge').innerText = usuarioAtual.perfil;
            
            // Monta o Menu Básico dependendo do Perfil
            montarMenuLateral();
        }

        // 6. MENU LATERAL DINÂMICO BÁSICO
        function montarMenuLateral() {
            const menuList = document.getElementById('sidebar-nav-list');
            menuList.innerHTML = `
                <li><a href="#" class="active"><i class="fa-solid fa-house"></i><span>Início</span></a></li>
            `;

            if (usuarioAtual.perfil === 'Admin') {
                menuList.innerHTML += `
                    <li><a href="#"><i class="fa-solid fa-users-cog"></i><span>Gerenciar Usuários</span></a></li>
                `;
            } else {
                menuList.innerHTML += `
                    <li><a href="#"><i class="fa-solid fa-file-signature"></i><span>Minhas Escalas</span></a></li>
                `;
            }
        }
    </script>
</body>
</html>
