<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>RH Goscripts - Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* TEMA DARK BLUE PREMIUM */
        :root {
            --cor-principal: #002347; --cor-secundaria: #003366; --cor-acento: #ffc107; --cor-acento-hover: #ffa000;
            --cor-texto-principal: #ffffff; --cor-texto-secundario: #a6b0cf; --cor-borda: rgba(255, 255, 255, 0.15);
            --cor-fundo-input: rgba(0, 0, 0, 0.2); --cor-perigo: #dc3545; --cor-sucesso: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-image: linear-gradient(135deg, var(--cor-principal) 0%, var(--cor-secundaria) 100%); background-attachment: fixed; color: var(--cor-texto-principal); min-height: 100vh; }
        .hidden { display: none !important; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .glass-card { background: rgba(0, 25, 51, 0.6); backdrop-filter: blur(15px); border: 1px solid var(--cor-borda); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .header-fixo { position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; background: rgba(0, 25, 51, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--cor-borda); }
        .header-logo-container { display: flex; align-items: center; gap: 15px; }
        .header-logo-container img { width: 40px; border-radius: 50%; }
        .header-logo-container h1 { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; color: var(--cor-acento); }
        #header-info-gestor { display: flex; align-items: center; gap: 15px; }
        #btnLogout { background: none; border: none; color: var(--cor-texto-principal); cursor: pointer; font-size: 1.2rem; transition: color 0.2s; }
        #btnLogout:hover { color: var(--cor-perigo); }
        .top-nav { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 15px; }
        .nav-btn { background: transparent; border: none; color: var(--cor-texto-secundario); font-size: 1rem; cursor: pointer; padding: 10px 15px; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .nav-btn:hover, .nav-btn.active { background: rgba(255, 193, 7, 0.1); color: var(--cor-acento); }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: var(--cor-texto-secundario); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); }
        input, select { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid var(--cor-borda); border-radius: 8px; background-color: var(--cor-fundo-input); color: var(--cor-texto-principal); font-size: 1rem; outline: none; transition: 0.3s; }
        input[type="file"] { padding-left: 15px; padding-top: 10px; }
        
        input[type="time"] { padding-left: 45px; cursor: pointer; }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
        @media(max-width: 768px) { .form-row, .form-row-3, .form-row-4 { grid-template-columns: 1fr; } }
        
        .bloco-destaque { background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 10px; border: 1px dashed rgba(255,193,7,0.3); margin-top: 10px; margin-bottom: 20px;}
        .box-interior { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        .btn-primary { background-color: var(--cor-acento); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; }
        .btn-primary:hover:not(:disabled) { background-color: var(--cor-acento-hover); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,193,7,0.1); color: var(--cor-acento); border: 1px solid var(--cor-acento); padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; font-weight: bold;}
        .btn-secondary:hover { background: var(--cor-acento); color: #000; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; margin-top: 20px; }
        th { color: var(--cor-acento); font-size: 0.8rem; text-transform: uppercase; text-align: left; padding: 10px 15px; border-bottom: 1px solid var(--cor-borda); }
        tr { background: rgba(0,0,0,0.2); transition: 0.2s; }
        td { padding: 15px; color: var(--cor-texto-secundario); font-size: 0.9rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge.admin { background: rgba(255,193,7,0.2); color: var(--cor-acento); border: 1px solid var(--cor-acento); }
        .badge.gestor { background: rgba(79,195,247,0.2); color: #4fc3f7; border: 1px solid #4fc3f7; }
        .badge.colaborador { background: rgba(40,167,69,0.2); color: #28a745; border: 1px solid #28a745; }
        .btn-danger-mini { background: rgba(220,53,69,0.2); color: var(--cor-perigo); border: 1px solid var(--cor-perigo); padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        
        .tag-unidade { display: inline-flex; align-items: center; gap: 8px; background: rgba(79,195,247,0.15); color: #4fc3f7; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(79,195,247,0.3); }
        .tag-unidade i { cursor: pointer; color: var(--cor-perigo); }
        .tag-unidade i:hover { color: #ff4c4c; }
    </style>
</head>
<body>

    <main class="container" id="login-container">
        <section class="glass-card" style="max-width: 400px; margin: 100px auto; text-align: center;">
            <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo" style="width: 70px; margin-bottom: 15px;">
            <h2>Acesso ao Portal</h2>
            <form id="form-login">
                <div class="form-group">
                    <div class="input-wrapper"><i class="fa-solid fa-envelope"></i><input type="email" id="email" required placeholder="E-mail" /></div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper"><i class="fa-solid fa-lock"></i><input type="password" id="senha" required placeholder="Senha" /></div>
                </div>
                <div id="login-error" style="color: var(--cor-perigo); font-size: 0.85rem; margin-bottom: 15px; display: none;"></div>
                <button type="submit" id="btn-submit-login" class="btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
            </form>
        </section>
    </main>

    <div id="app-container" class="hidden">
        <header class="header-fixo">
            <div class="header-logo-container">
                <img src="https://gozgames.neocities.org/1745943001077.jpg" alt="Logo">
                <h1>RH Goscripts</h1> 
            </div>
            <div id="header-info-gestor">
                <span>Olá, <strong id="user-name-display">...</strong>!</span>
                <span id="user-role-badge" class="badge"></span>
                <button type="button" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="container" style="margin-top: 100px;">
            <nav class="top-nav" id="menu-navegacao">
                <button class="nav-btn active" data-target="tela-inicio"><i class="fa-solid fa-house"></i> Início</button>
            </nav>

            <section id="tela-inicio" class="view-section">
                <div class="glass-card">
                    <h2>Painel de Controle</h2>
                    <p>Bem-vindo ao sistema. Escolha uma opção no menu.</p>
                </div>
            </section>

            <section id="tela-usuarios" class="view-section hidden">
                <div class="glass-card" style="margin-bottom: 30px;">
                    <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-user-plus"></i> Cadastro Geral</h3>
                    
                    <form id="form-novo-usuario">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nome Completo</label>
                                <div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="novo-nome" required></div>
                            </div>
                            <div class="form-group">
                                <label>Perfil de Acesso</label>
                                <div class="input-wrapper"><i class="fa-solid fa-shield"></i>
                                    <select id="novo-perfil" required>
                                        <option value="Gestor" selected>Gestor (Padrão)</option>
                                        <option value="Admin">Administrador</option>
                                        <option value="Colaborador">Colaborador (Admissão)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div id="bloco-acesso-sistema" class="bloco-destaque">
                            <h4 style="color: var(--cor-acento); margin-bottom: 15px;"><i class="fa-solid fa-key"></i> Acesso ao Painel</h4>
                            <div class="form-row">
                                <div class="form-group"><label>E-mail</label><input type="email" id="novo-email"></div>
                                <div class="form-group"><label>Senha Provisória</label><input type="text" id="novo-senha" minlength="6"></div>
                            </div>
                        </div>

                        <div id="bloco-unidade" class="bloco-destaque">
                            <h4 style="color: #4fc3f7; margin-bottom: 15px;"><i class="fa-solid fa-building"></i> Alocação</h4>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Empresa</label>
                                    <select id="novo-empresa">
                                        <option value="SOUL">SOUL GESTÃO</option>
                                        <option value="VILLAC">VILLAC</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label>Unidade(s)</label>
                                    <div id="bloco-unidade-gestor">
                                        <div style="display: flex; gap: 10px;">
                                            <div class="input-wrapper" style="flex: 1;">
                                                <i class="fa-solid fa-map-marker-alt"></i>
                                                <input type="text" id="novo-unidade-add" placeholder="Ex: HMA e clique no +">
                                            </div>
                                            <button type="button" class="btn-secondary" id="btn-add-unidade" style="padding: 10px 15px;"><i class="fa-solid fa-plus"></i></button>
                                        </div>
                                        <div id="lista-unidades-gestor" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
                                    </div>
                                    <div class="input-wrapper hidden" id="bloco-unidade-colab">
                                        <i class="fa-solid fa-map-marker-alt"></i>
                                        <select id="novo-unidade-select">
                                            <option value="">Carregando unidades...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group" id="campo-vt-gestor">
                                <label>Empresa de VT</label>
                                <select id="novo-vt">
                                    <option value="Não consta">Não consta</option>
                                    <option value="SOU Americana">SOU Americana</option>
                                    <option value="EMTU">EMTU</option>
                                </select>
                            </div>
                        </div>

                        <div id="bloco-admissao" class="bloco-destaque hidden">
                            <h4 style="color: #28a745; margin-bottom: 15px;"><i class="fa-solid fa-file-signature"></i> Ficha de Admissão Completa</h4>
                            
                            <div class="form-row">
                                <div class="form-group"><label>CPF</label><input type="text" id="adm-cpf" placeholder="000.000.000-00"></div>
                                <div class="form-group"><label>PIS</label><input type="text" id="adm-pis" placeholder="000.00000.00-0"></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Data de Nascimento</label><input type="date" id="adm-nasc"></div>
                                <div class="form-group">
                                    <label>Estado Civil</label>
                                    <select id="adm-estadocivil">
                                        <option value="Solteiro(a)">Solteiro(a)</option>
                                        <option value="Casado(a)">Casado(a)</option>
                                        <option value="Divorciado(a)">Divorciado(a)</option>
                                        <option value="Viúvo(a)">Viúvo(a)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Telefone / WhatsApp</label><input type="tel" id="adm-telefone" placeholder="(11) 99999-9999"></div>
                                <div class="form-group"><label>E-mail Pessoal</label><input type="email" id="adm-email-pessoal" placeholder="email@exemplo.com"></div>
                            </div>

                            <hr style="border: 0; border-top: 1px dashed var(--cor-borda); margin: 20px 0;">

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Cargo</label>
                                    <select id="adm-cargo">
                                        <option value="Controlador de Acesso">Controlador de Acesso</option>
                                        <option value="Recepcionista">Recepcionista</option>
                                        <option value="Auxiliar de Limpeza">Auxiliar de Limpeza</option>
                                        <option value="Técnico de Enfermagem">Técnico de Enfermagem</option>
                                        <option value="Enfermeiro(a)">Enfermeiro(a)</option>
                                        <option value="Outro">Outro (Digitar)</option>
                                    </select>
                                </div>
                                <div class="form-group hidden" id="box-cargo-outro">
                                    <label>Digite o Cargo</label><input type="text" id="adm-cargo-outro" placeholder="Qual cargo?">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Jornada de Trabalho</label>
                                    <select id="adm-jornada-tipo">
                                        <option value="12x36 (06:00 às 18:00)">12x36 (06:00 às 18:00)</option>
                                        <option value="12x36 (07:00 às 19:00)">12x36 (07:00 às 19:00)</option>
                                        <option value="12x36 (18:00 às 06:00)">12x36 (18:00 às 06:00)</option>
                                        <option value="12x36 (19:00 às 07:00)">12x36 (19:00 às 07:00)</option>
                                        <option value="44h Semanais (08:00 às 18:00)">44h Semanais (08:00 às 18:00)</option>
                                        <option value="Outros">Outros (Personalizar relógio)</option>
                                    </select>
                                </div>
                                <div class="form-group"><label>Salário Base (R$)</label><input type="number" id="novo-salario" step="0.01" placeholder="Ex: 1800.00"></div>
                            </div>

                            <div class="form-row" style="background: rgba(40, 167, 69, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(40, 167, 69, 0.3);">
                                <div class="form-group" style="margin-bottom: 0;">
                                    <label>Data de Início (Primeiro dia)</label>
                                    <input type="date" id="adm-data-inicio">
                                </div>
                                <div class="form-group hidden" id="box-status-inicio" style="margin-bottom: 0;">
                                    <label>O dia de início será:</label>
                                    <select id="adm-status-inicio">
                                        <option value="Trabalho">Plantão (Trabalho)</option>
                                        <option value="Folga">Folga</option>
                                    </select>
                                </div>
                            </div>

                            <div id="box-jornada-outros" class="box-interior hidden" style="border-color: var(--cor-acento);">
                                <h5 style="color: var(--cor-acento); margin-bottom: 10px;"><i class="fa-regular fa-clock"></i> Personalizar Jornada</h5>
                                <div class="form-row-4">
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label>Dia da Semana</label>
                                        <select id="jornada-dia-add">
                                            <option value="Segunda a Sexta">Segunda a Sexta</option>
                                            <option value="Segunda-feira">Segunda-feira</option>
                                            <option value="Terça-feira">Terça-feira</option>
                                            <option value="Quarta-feira">Quarta-feira</option>
                                            <option value="Quinta-feira">Quinta-feira</option>
                                            <option value="Sexta-feira">Sexta-feira</option>
                                            <option value="Sábado">Sábado</option>
                                            <option value="Domingo">Domingo</option>
                                        </select>
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label>Entrada</label>
                                        <div class="input-wrapper"><i class="fa-regular fa-clock"></i><input type="time" id="jornada-entrada-add"></div>
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label>Saída</label>
                                        <div class="input-wrapper"><i class="fa-regular fa-clock"></i><input type="time" id="jornada-saida-add"></div>
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <button type="button" class="btn-secondary" id="btn-add-dia-jornada"><i class="fa-solid fa-plus"></i></button>
                                    </div>
                                </div>
                                <div id="lista-jornada-custom" style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;"></div>
                            </div>

                            <hr style="border: 0; border-top: 1px dashed var(--cor-borda); margin: 20px 0;">

                            <h5 style="color: var(--cor-texto-secundario); margin-bottom: 10px;">Tamanhos de Uniforme</h5>
                            <div class="form-row-3">
                                <div class="form-group"><label>Camisa</label><input type="text" id="adm-camisa" placeholder="Ex: M, G, GG"></div>
                                <div class="form-group"><label>Calça</label><input type="text" id="adm-calca" placeholder="Ex: 42, 44"></div>
                                <div class="form-group"><label>Sapato</label><input type="text" id="adm-sapato" placeholder="Ex: 40, 41"></div>
                            </div>

                            <hr style="border: 0; border-top: 1px dashed var(--cor-borda); margin: 20px 0;">

                            <div class="form-group">
                                <label>Quantidade de Dependentes (Filhos/Cônjuge)</label>
                                <input type="number" id="adm-qtd-dependentes" min="0" max="10" value="0">
                            </div>
                            <div id="container-dependentes"></div>

                            <hr style="border: 0; border-top: 1px dashed var(--cor-borda); margin: 20px 0;">

                            <div class="form-group">
                                <label>Documentos de Admissão (PDF/Imagens)</label>
                                <input type="file" id="novo-documentos" multiple accept="image/*,.pdf">
                            </div>
                        </div>
                        
                        <div id="user-create-msg" style="margin-bottom: 15px; font-weight: bold;"></div>
                        <button type="submit" id="btn-salvar-usuario" class="btn-primary">Salvar Cadastro</button>
                    </form>
                </div>

                <div class="glass-card">
                    <h3>Usuários Cadastrados</h3>
                    <table id="tabela-usuarios">
                        <thead><tr><th>Nome</th><th>Perfil</th><th>Empresa</th><th>Unidade</th><th>Ação</th></tr></thead>
                        <tbody id="lista-usuarios-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        // COLOQUE SUAS CHAVES DO SUPABASE AQUI:
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let usuarioAtual = null;

        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');

        // --- LÓGICA DO PERFIL E UNIDADES ---
        document.getElementById('novo-perfil').addEventListener('change', async function() {
            const perfil = this.value;
            const blocoAcesso = document.getElementById('bloco-acesso-sistema');
            const blocoAdmissao = document.getElementById('bloco-admissao');
            const campoVt = document.getElementById('campo-vt-gestor');
            
            const blocoUnidadeGestor = document.getElementById('bloco-unidade-gestor');
            const blocoUnidadeColab = document.getElementById('bloco-unidade-colab');

            if (perfil === 'Colaborador') {
                blocoAcesso.classList.add('hidden');
                blocoAdmissao.classList.remove('hidden');
                campoVt.classList.add('hidden');
                
                blocoUnidadeGestor.classList.add('hidden');
                blocoUnidadeColab.classList.remove('hidden');
                
                // Dispara a visualização da jornada ao abrir colaborador
                document.getElementById('adm-jornada-tipo').dispatchEvent(new Event('change'));
                
                await popularUnidades(); 
            } else {
                blocoAcesso.classList.remove('hidden');
                blocoAdmissao.classList.add('hidden');
                campoVt.classList.remove('hidden');
                
                blocoUnidadeGestor.classList.remove('hidden');
                blocoUnidadeColab.classList.add('hidden');
            }
        });

        // Adicionar Unidade para Gestor via TAGS
        document.getElementById('btn-add-unidade').addEventListener('click', function() {
            const val = document.getElementById('novo-unidade-add').value.trim();
            if(!val) return;
            
            document.getElementById('lista-unidades-gestor').innerHTML += `
                <span class="tag-unidade" data-val="${val}">
                    ${val} <i class="fa-solid fa-times" onclick="this.parentElement.remove()"></i>
                </span>
            `;
            document.getElementById('novo-unidade-add').value = '';
        });

        // --- CARGO E JORNADA ---
        document.getElementById('adm-cargo').addEventListener('change', function() {
            document.getElementById('box-cargo-outro').classList.toggle('hidden', this.value !== 'Outro');
        });

        document.getElementById('adm-jornada-tipo').addEventListener('change', function() {
            const val = this.value;
            
            // Mostra ou esconde relógio customizado
            document.getElementById('box-jornada-outros').classList.toggle('hidden', val !== 'Outros');
            
            // Mostra ou esconde campo de Status do Primeiro Dia (Só para 12x36)
            document.getElementById('box-status-inicio').classList.toggle('hidden', !val.includes('12x36'));
        });

        // Adicionar Jornada com Relógio
        document.getElementById('btn-add-dia-jornada').addEventListener('click', function() {
            const dia = document.getElementById('jornada-dia-add').value;
            const entrada = document.getElementById('jornada-entrada-add').value;
            const saida = document.getElementById('jornada-saida-add').value;
            
            if(!entrada || !saida) return alert("Por favor, preencha o horário de entrada e saída!");
            
            const horario = `${entrada} às ${saida}`;
            
            document.getElementById('lista-jornada-custom').innerHTML += `
                <div class="jornada-item" style="background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <span><strong class="j-dia">${dia}</strong>: <span class="j-hor">${horario}</span></span>
                    <button type="button" class="btn-danger-mini" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                </div>`;
                
            document.getElementById('jornada-entrada-add').value = '';
            document.getElementById('jornada-saida-add').value = '';
        });

        // --- DEPENDENTES ---
        document.getElementById('adm-qtd-dependentes').addEventListener('input', function() {
            const qtd = parseInt(this.value) || 0;
            const container = document.getElementById('container-dependentes');
            container.innerHTML = '';
            for(let i = 1; i <= qtd; i++) {
                container.innerHTML += `
                    <div class="box-interior dep-box">
                        <h5 style="color: var(--cor-acento); margin-bottom: 10px;">Dependente ${i}</h5>
                        <div class="form-row">
                            <div class="form-group"><label>Nome</label><input type="text" class="dep-nome" placeholder="Nome Completo"></div>
                            <div class="form-group"><label>CPF</label><input type="text" class="dep-cpf" placeholder="000.000.000-00"></div>
                        </div>
                        <div class="form-group"><label>Data de Nascimento</label><input type="date" class="dep-nasc"></div>
                    </div>`;
            }
        });

        // --- BUSCAR UNIDADES ÚNICAS DO BANCO ---
        async function popularUnidades() {
            const select = document.getElementById('novo-unidade-select');
            select.innerHTML = '<option value="">Buscando unidades...</option>';
            const { data, error } = await supabaseClient.from('perfis').select('unidade').not('unidade', 'is', null);
            if (error) { select.innerHTML = '<option value="">Erro ao carregar</option>'; return; }
            
            const unidadesUnicas = [...new Set(data.map(item => item.unidade.split(',')).flat().map(u => u.trim()))].filter(u => u !== "");
            select.innerHTML = '<option value="">Selecione uma unidade</option>';
            unidadesUnicas.forEach(uni => { select.innerHTML += `<option value="${uni}">${uni}</option>`; });
        }

        // --- UPLOAD DE ARQUIVOS ---
        async function subirDocumentos(folderName, arquivos) {
            const msg = document.getElementById('user-create-msg');
            for (const arquivo of arquivos) {
                const cleanName = arquivo.name.replace(/[^a-zA-Z0-9.]/g, '_');
                const caminho = `admissoes/${folderName}/${Date.now()}_${cleanName}`;
                msg.innerText = `Subindo: ${arquivo.name}...`;
                await supabaseClient.storage.from('documentos').upload(caminho, arquivo);
            }
        }

        // --- INICIALIZAÇÃO ---
        async function inicializar() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const sucesso = await carregarPerfil(session.user.id);
                if (sucesso) {
                    loginContainer.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                }
            }
        }
        window.addEventListener('DOMContentLoaded', inicializar);

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
            if (error) alert("Erro: E-mail ou senha incorretos.");
            else if (data.session) location.reload();
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        async function carregarPerfil(id) {
            const { data, error } = await supabaseClient.from('perfis').select('*').eq('id', id).single();
            if (error) return false;
            usuarioAtual = data;
            document.getElementById('user-name-display').innerText = data.nome;
            document.getElementById('user-role-badge').innerText = data.perfil;
            document.getElementById('user-role-badge').className = `badge ${data.perfil.toLowerCase()}`;
            if (data.perfil === 'Admin') {
                const nav = document.getElementById('menu-navegacao');
                if (!document.getElementById('btn-nav-usuarios')) {
                    nav.innerHTML += `<button class="nav-btn" id="btn-nav-usuarios" data-target="tela-usuarios"><i class="fa-solid fa-users-cog"></i> Gerenciar</button>`;
                    configurarNavegacao();
                }
            }
            return true;
        }

        function configurarNavegacao() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.target).classList.remove('hidden');
                    if(btn.dataset.target === 'tela-usuarios') listarUsuarios();
                });
            });
        }

        // --- SALVAR CADASTRO ---
        document.getElementById('form-novo-usuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-usuario');
            const msg = document.getElementById('user-create-msg');
            const perfil = document.getElementById('novo-perfil').value;
            const nome = document.getElementById('novo-nome').value;

            let unidadeFinal = '';
            if (perfil === 'Colaborador') {
                unidadeFinal = document.getElementById('novo-unidade-select').value;
            } else {
                const tags = document.querySelectorAll('.tag-unidade');
                let arrUnidades = [];
                tags.forEach(t => arrUnidades.push(t.getAttribute('data-val')));
                unidadeFinal = arrUnidades.join(', ');
                
                if(!unidadeFinal) return alert("Adicione pelo menos uma unidade para o Gestor!");
            }

            btn.disabled = true;
            msg.style.color = "white";
            msg.innerText = "Processando cadastro...";

            try {
                if (perfil === 'Colaborador') {
                    
                    let cargoFinal = document.getElementById('adm-cargo').value;
                    if(cargoFinal === 'Outro') cargoFinal = document.getElementById('adm-cargo-outro').value;

                    let jornadaFinal = document.getElementById('adm-jornada-tipo').value;
                    if (jornadaFinal === 'Outros') {
                        let diasPersonalizados = [];
                        document.querySelectorAll('.jornada-item').forEach(item => {
                            diasPersonalizados.push({
                                dia: item.querySelector('.j-dia').innerText,
                                horario: item.querySelector('.j-hor').innerText
                            });
                        });
                        jornadaFinal = { tipo: 'Personalizada', escala: diasPersonalizados };
                    }

                    const dependentesDOM = document.getElementById('container-dependentes').querySelectorAll('.dep-box');
                    let listaDependentes = [];
                    dependentesDOM.forEach(box => {
                        listaDependentes.push({
                            nome: box.querySelector('.dep-nome').value,
                            cpf: box.querySelector('.dep-cpf').value,
                            nascimento: box.querySelector('.dep-nasc').value
                        });
                    });

                    // NOVO: Coleta status do 1º dia (ou Automático se não for 12x36)
                    const statusInicio = document.getElementById('adm-jornada-tipo').value.includes('12x36') 
                        ? document.getElementById('adm-status-inicio').value 
                        : 'Automático';

                    const dadosAdmissaoJSON = {
                        cpf: document.getElementById('adm-cpf').value,
                        pis: document.getElementById('adm-pis').value,
                        nascimento: document.getElementById('adm-nasc').value,
                        estado_civil: document.getElementById('adm-estadocivil').value,
                        telefone: document.getElementById('adm-telefone').value,
                        email_pessoal: document.getElementById('adm-email-pessoal').value,
                        cargo: cargoFinal,
                        salario: document.getElementById('novo-salario').value,
                        jornada: jornadaFinal,
                        data_inicio: document.getElementById('adm-data-inicio').value, // <--- NOVO
                        status_primeiro_dia: statusInicio, // <--- NOVO
                        uniforme: {
                            camisa: document.getElementById('adm-camisa').value,
                            calca: document.getElementById('adm-calca').value,
                            sapato: document.getElementById('adm-sapato').value
                        },
                        dependentes: listaDependentes
                    };

                    const { error } = await supabaseClient.from('perfis').insert([{
                        id: crypto.randomUUID(),
                        nome: nome,
                        perfil: 'Colaborador',
                        empresa: document.getElementById('novo-empresa').value,
                        unidade: unidadeFinal,
                        dados_admissao: dadosAdmissaoJSON
                    }]);
                    if(error) throw error;

                    const fileInput = document.getElementById('novo-documentos');
                    if (fileInput.files.length > 0) {
                        await subirDocumentos(nome.replace(/\s/g, '_'), fileInput.files);
                    }

                    msg.style.color = "var(--cor-sucesso)";
                    msg.innerText = "Colaborador salvo com sucesso!";
                    document.getElementById('form-novo-usuario').reset();
                    
                    document.getElementById('container-dependentes').innerHTML = '';
                    document.getElementById('lista-jornada-custom').innerHTML = '';
                    document.getElementById('lista-unidades-gestor').innerHTML = '';
                    document.getElementById('box-cargo-outro').classList.add('hidden');
                    document.getElementById('box-jornada-outros').classList.add('hidden');
                    document.getElementById('box-status-inicio').classList.remove('hidden'); // Reset do layout

                } else {
                    const email = document.getElementById('novo-email').value;
                    const senha = document.getElementById('novo-senha').value;
                    const { data, error: authErr } = await supabaseClient.auth.signUp({ email, password: senha });
                    if (authErr) throw authErr;

                    const { error: dbErr } = await supabaseClient.from('perfis').insert([{
                        id: data.user.id,
                        nome: nome,
                        perfil: perfil,
                        empresa: document.getElementById('novo-empresa').value,
                        unidade: unidadeFinal,
                        vt: document.getElementById('novo-vt').value
                    }]);
                    if (dbErr) throw dbErr;
                    msg.style.color = "var(--cor-sucesso)";
                    msg.innerText = "Gestor criado! Recarregando...";
                    setTimeout(() => location.reload(), 2000);
                }
            } catch (err) {
                msg.style.color = "var(--cor-perigo)";
                msg.innerText = "Erro: " + err.message;
            } finally {
                btn.disabled = false;
                listarUsuarios();
            }
        });

        async function listarUsuarios() {
            const tbody = document.getElementById('lista-usuarios-body');
            tbody.innerHTML = '<tr><td colspan="5">Buscando...</td></tr>';
            const { data, error } = await supabaseClient.from('perfis').select('*').order('nome');
            if (error) return;
            tbody.innerHTML = "";
            data.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td>${u.nome}</td>
                    <td><span class="badge ${u.perfil.toLowerCase()}">${u.perfil}</span></td>
                    <td>${u.empresa}</td>
                    <td>${u.unidade || '-'}</td>
                    <td style="text-align: center;"><button class="btn-danger-mini" onclick="alert('Em breve')"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
