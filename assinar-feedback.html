<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura de Feedback Trimestral</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #121824;
            --card: #1c2434;
            --text: #ffffff;
            --subtext: #a6b0cf;
            --accent: #00bcd4;
            --success: #28a745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }
        h2 { color: var(--accent); margin-top: 0; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .info-label { color: var(--subtext); }
        .info-value { font-weight: bold; }
        .feedback-box { background: rgba(0,0,0,0.2); pading: 12px; border-radius: 8px; border-left: 4px solid var(--accent); margin-top: 15px; padding: 10px; }
        .btn-success { width: 100%; padding: 14px; background: var(--success); border: none; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-pdf { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .assinatura-carimbo { display: none; background: rgba(40,167,69,0.1); border: 1px dashed var(--success); color: #85ea9d; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; }
        
        /* 🖨️ CONFIGURAÇÃO DE IMPRESSÃO / PDF NATIVO */
        @media print {
            body { background: #fff; color: #000; }
            .card { border: none; box-shadow: none; background: #fff; color: #000; }
            .btn-success, .btn-pdf { display: none !important; }
            .assinatura-carimbo { display: block !important; color: #000; border-color: #000; }
            .info-label { color: #555; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="bloco-loading">
        <p style="text-align: center;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--accent);"></i><br>Carregando seu feedback...</p>
    </div>

    <div class="card" id="bloco-conteudo" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
            <i class="fa-solid fa-chart-line fa-3x" style="color: var(--accent);"></i>
            <h2>Feedback de Desempenho</h2>
            <span id="txt-num-aval" style="font-size: 0.8rem; color: var(--subtext);"></span>
        </div>

        <div class="info-row">
            <span class="info-label">Colaborador:</span>
            <span class="info-value" id="nome-colaborador"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Gestor:</span>
            <span class="info-value" id="nome-gestor"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Data da Conversa:</span>
            <span class="info-value" id="data-conversa"></span>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.05); margin: 20px 0;">

        <h3>📝 Comentários e Alinhamento Final:</h3>
        <div class="feedback-box" id="texto-feedback"></div>

        <div style="margin-top: 30px;">
            <!-- BOTÃO DE ASSINAR -->
            <button id="btn-assinar" class="btn-success" onclick="assinarDocumentoDigitais()"><i class="fa-solid fa-signature"></i> ASSINAR FEEDBACK TRIMESTRAL</button>
            
            <!-- CARIMBO DE ASSINADO (FICA VISÍVEL SÓ APÓS ASSINAR) -->
            <div id="carimbo-sucesso" class="assinatura-carimbo"></div>
            
            <!-- BOTÃO DE SALVAR PDF -->
            <button id="btn-gerar-pdf" class="btn-pdf" style="display: none;" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> Salvar ou Imprimir em PDF</button>
        </div>
    </div>
</div>

<script>
    // Inicialize seu Supabase aqui!
    const supabaseClient = supabase.createClient('SUA_URL_SUPABASE', 'SUA_CHAVE_ANON_SUPABASE');

    // Pega o ID da avaliação direto da URL (?id=xxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const idAvaliacao = urlParams.get('id');

    let dadosAvaliacaoGlobal = null;

    async function carregarDadosFeedback() {
        if(!idAvaliacao) {
            document.getElementById('bloco-loading').innerHTML = "❌ Erro: Link inválido ou sem identificação de avaliação.";
            return;
        }

        const { data, error } = await supabaseClient.from('avaliacoes_desempenho').select('*').eq('id', idAvaliacao).single();

        if (error || !data) {
            document.getElementById('bloco-loading').innerHTML = "❌ Erro ao carregar as informações do banco de dados.";
            return;
        }

        dadosAvaliacaoGlobal = data;
        
        // Preenche a tela
        document.getElementById('txt-num-aval').innerText = `AVALIAÇÃO Nº: ${data.id || idAvaliacao}`;
        document.getElementById('nome-colaborador').innerText = data.nome_colaborador;
        document.getElementById('nome-gestor').innerText = data.nome_gestor || 'Gestor Direto';
        document.getElementById('data-conversa').innerText = new Date(data.created_at).toLocaleDateString('pt-BR');
        document.getElementById('texto-feedback').innerText = data.comentarios_finais || 'Nenhum comentário adicional registrado.';

        // Checa se já está assinado
        if (data.status === 'Assinado' || data.status === 'Aprovado' || data.data_assinatura_colaborador) {
            mostrarCarimboAssinado(data.data_assinatura_colaborador);
        }

        document.getElementById('bloco-loading').style.display = 'none';
        document.getElementById('bloco-conteudo').style.display = 'block';
    }

    function mostrarCarimboAssinado(dataTimestamp) {
        const dataObj = new Date(dataTimestamp);
        const dataFmt = dataObj.toLocaleDateString('pt-BR') + ' às ' + dataObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        
        const carimbo = document.getElementById('carimbo-sucesso');
        carimbo.innerHTML = `<i class="fa-solid fa-circle-check"></i> DOCUMENTO ASSINADO DIGITALMENTE<br><span style="font-size: 0.8rem; font-weight: normal;">Em ${dataFmt} pelo CPF/Cadastro do Colaborador.</span>`;
        carimbo.style.display = 'block';
        
        document.getElementById('btn-assinar').style.display = 'none';
        document.getElementById('btn-gerar-pdf').style.style.display = 'block';
    }

    async function assinarDocumentoDigitais() {
        const btn = document.getElementById('btn-assinar');
        btn.disabled = true;
        btn.innerText = "Registrando assinatura eletrônica...";

        const agoraISO = new Date().toISOString();

        try {
            // Atualiza o banco com a data/hora e muda para a fila do Admin do RH aprovar!
            await supabaseClient.from('avaliacoes_desempenho').update({
                status: 'Avaliacao_Desempenho_Admin', // Vai direto pra Central do Admin!
                data_assinatura_colaborador: agoraISO
            }).eq('id', idAvaliacao);

            // Cria uma notificação oficial pro Admin na tabela de notificações
            await supabaseClient.from('notificacoes').insert([{
                tipo: 'Avaliacao_Desempenho_Admin',
                nome: dadosAvaliacaoGlobal.nome_colaborador,
                unidade: dadosAvaliacaoGlobal.unidade,
                referencia_id: idAvaliacao,
                colaborador_id: dadosAvaliacaoGlobal.colaborador_id,
                lida: false
            }]);

            mostrarCarimboAssinado(agoraISO);
        } catch (e) {
            alert("Erro ao processar assinatura eletrônica. Tente novamente.");
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-signature"></i> ASSINAR FEEDBACK TRIMESTRAL`;
        }
    }

    // Inicializa a carga
    carregarDadosFeedback();
</script>
</body>
</html>
