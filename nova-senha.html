<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Redefinir Senha - RH Soul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #001224; 
            --cor-secundaria: #002347; 
            --cor-acento: #20c997; 
            --cor-sucesso: #2ecc71;
            --cor-perigo: #e74c3c;
            --cor-alerta: #f1c40f;
            --cor-borda: rgba(255, 255, 255, 0.1);
            --cor-texto-principal: #ffffff;
            --cor-texto-secundario: #94a3b8;
            --cor-fundo-card: rgba(0, 18, 36, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }

        body {
            background-image: linear-gradient(135deg, var(--cor-principal) 0%, var(--cor-secundaria) 100%);
            color: var(--cor-texto-principal);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .glass-card { 
            background: var(--cor-fundo-card); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 20px; 
            padding: 40px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            width: 100%; 
            max-width: 440px; 
            transition: transform 0.3s ease;
        }
        
        .logo-container {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            height: 60px; 
            width: 60px; 
            object-fit: contain; 
            border-radius: 50%;
            border: 2px solid var(--cor-acento);
            box-shadow: 0 0 15px rgba(32, 201, 151, 0.3);
        }

        .form-group { margin-bottom: 22px; text-align: left; position: relative; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500; 
            font-size: 0.85rem; 
            color: var(--cor-texto-secundario); 
            letter-spacing: 0.5px;
        }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.input-icon { position: absolute; left: 16px; color: rgba(255, 255, 255, 0.35); font-size: 1rem; }
        
        /* Botão de Olhinho para exibir senha */
        .btn-toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            font-size: 1rem;
            height: auto;
            width: auto;
            margin: 0;
        }
        .btn-toggle-password:hover { color: var(--cor-texto-principal); }

        input { 
            width: 100%; 
            padding: 14px 45px 14px 45px; 
            border: 1px solid var(--cor-borda); 
            color: var(--cor-texto-principal); 
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        input:focus { border-color: var(--cor-acento); background: rgba(0, 0, 0, 0.6); box-shadow: 0 0 10px rgba(32, 201, 151, 0.15); }
        
        .requisitos-senha {
            margin-top: 12px;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-req { display: flex; align-items: center; gap: 8px; color: var(--cor-texto-secundario); transition: all 0.3s ease; }
        .item-req i { font-size: 0.75rem; color: rgba(255,255,255,0.2); transition: all 0.3s ease; }
        
        /* Estados de validação */
        .item-req.valido { color: var(--cor-sucesso); }
        .item-req.valido i { color: var(--cor-sucesso); }

        /* Botão de Envio Customizado */
        .btn-submit { 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border-radius: 10px; 
            font-weight: 700; 
            border: none; 
            width: 100%; 
            height: 52px; 
            font-size: 1rem; 
            margin-top: 12px;
            background: var(--cor-acento); 
            color: #001224;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(32, 201, 151, 0.2);
        }
        .btn-submit:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(32, 201, 151, 0.3); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { background: #334155; color: #64748b; opacity: 0.6; cursor: not-allowed; box-shadow: none; }

        /* Sistema de Alertas Toast Fixo e Organizado no Canto Superior */
        #toast-container { 
            position: fixed; 
            top: 24px; 
            right: 24px; 
            z-index: 999999; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .toast { 
            min-width: 320px; 
            max-width: 420px; 
            background: #111827; 
            color: #ffffff; 
            padding: 16px 20px; 
            border-radius: 12px; 
            font-weight: 500; 
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center; 
            gap: 14px;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
        }
        
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.erro { border-left: 5px solid var(--cor-perigo); }
        .toast.sucesso { border-left: 5px solid var(--cor-sucesso); }
        .toast.aviso { border-left: 5px solid var(--cor-alerta); }
        .toast i { font-size: 1.25rem; }
        .toast.erro i { color: var(--cor-perigo); }
        .toast.sucesso i { color: var(--cor-sucesso); }
        .toast.aviso i { color: var(--cor-alerta); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="glass-card">
        <div class="logo-container">
            <a href="https://gruposoulbr.com/" target="_blank">
                <img src="https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/logo%20soul.png" alt="Logo" class="logo-img">
            </a>
            <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 900; margin-top: 15px; margin-bottom: 6px; color: #fff; font-size: 1.5rem; letter-spacing: -0.5px;">Nova Senha</h2>
            <p style="color: var(--cor-texto-secundario); font-size: 0.85rem; line-height: 1.4;">Defina sua senha forte de acesso para os painéis gerenciais corporativos.</p>
        </div>
        
        <form id="form-alterar-senha-fin">
            <div class="form-group">
                <label for="senha1">Nova Senha <span style="color: var(--cor-perigo)">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="senha1" required placeholder="Digite uma senha forte" autocomplete="new-password"/>
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('senha1', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                
                <div class="requisitos-senha">
                    <div id="req-comprimento" class="item-req"><i class="fa-solid fa-circle"></i> Mínimo de 8 caracteres</div>
                    <div id="req-maiuscula" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 letra maiúscula</div>
                    <div id="req-numero" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 número</div>
                    <div id="req-especial" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 caractere especial (!@#$%)</div>
                    <div id="req-match" class="item-req"><i class="fa-solid fa-circle"></i> As senhas devem ser idênticas</div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label for="senha2">Confirmar Nova Senha <span style="color: var(--cor-perigo)">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-double input-icon"></i>
                    <input type="password" id="senha2" required placeholder="Repita a senha exatamente igual" autocomplete="new-password"/>
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('senha2', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" id="btn-salvar" class="btn-submit" disabled>
                <i class="fa-solid fa-shield-halved"></i> Atualizar Senha
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const inputSenha1 = document.getElementById('senha1');
        const inputSenha2 = document.getElementById('senha2');
        const btnSalvar = document.getElementById('btn-salvar');

        // Validações por Expressões Regulares (Regex)
        const regras = {
            comprimento: (v) => v.length >= 8,
            maiuscula: (v) => /[A-Z]/.test(v),
            numero: (v) => /[0-9]/.test(v),
            especial: (v) => /[^A-Za-z0-9]/.test(v)
        };

        // Função de Exibição de Erros / Sucessos Fixa no Canto da Tela (Toast)
        function mostrarAlerta(msg, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            
            let icon = "fa-circle-check";
            if (tipo === "erro") icon = "fa-circle-exclamation";
            if (tipo === "aviso") icon = "fa-triangle-exclamation";
            
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><div>${msg}</div>`;
            container.appendChild(toast);
            
            // Controle de saída suave com fade-out coordenado
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'scale(0.9) translateX(50px)';
                setTimeout(() => toast.remove(), 300); 
            }, 5000);
        }

        // Alternador Visual de Senha Oculta/Visível
        function togglePasswordVisibility(inputId, buttonEl) {
            const input = document.getElementById(inputId);
            const icon = buttonEl.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }

        // Validador em tempo real coordenando forças e igualdades das senhas
        function validarFormularioCompleto() {
            const v1 = inputSenha1.value;
            const v2 = inputSenha2.value;
            
            const checks = {
                comprimento: regras.comprimento(v1),
                maiuscula: regras.maiuscula(v1),
                numero: regras.numero(v1),
                especial: regras.especial(v1),
                match: v1 === v2 && v1.length > 0
            };

            atualizarItemUI('req-comprimento', checks.comprimento);
            atualizarItemUI('req-maiuscula', checks.maiuscula);
            atualizarItemUI('req-numero', checks.numero);
            atualizarItemUI('req-especial', checks.especial);
            atualizarItemUI('req-match', checks.match);

            // Liberação definitiva do botão de salvar
            const tudoValido = Object.values(checks).every(v => v === true);
            btnSalvar.disabled = !tudoValido;
        }

        function atualizarItemUI(idElemento, isValido) {
            const el = document.getElementById(idElemento);
            const icone = el.querySelector('i');
            if (isValido) {
                el.classList.add('valido');
                icone.className = "fa-solid fa-circle-check";
            } else {
                el.classList.remove('valido');
                icone.className = "fa-solid fa-circle";
            }
        }

        inputSenha1.addEventListener('input', validarFormularioCompleto);
        inputSenha2.addEventListener('input', validarFormularioCompleto);

        // Processamento de Alteração de Senha no Supabase
        document.getElementById('form-alterar-senha-fin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const s1 = inputSenha1.value;
            const s2 = inputSenha2.value;

            if (s1 !== s2) {
                return mostrarAlerta("Erro de validação: As senhas informadas não coincidem!", "aviso");
            }

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando nova senha...';

            try {
                // Captura e validação da sessão ativa do Token de e-mail
                const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                
                if (!sessionData.session) {
                    throw new Error("Sessão expirada ou link inválido! Solicite um novo e-mail de recuperação.");
                }

                // Atualização do usuário no Auth do Supabase
                const { error } = await supabaseClient.auth.updateUser({ password: s1 });
                if (error) throw error;

                mostrarAlerta("Senha atualizada com sucesso! Redirecionando para o login...", "sucesso");
                btnSalvar.innerHTML = '<i class="fa-solid fa-check"></i> Senha Atualizada';
                
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 3500);

            } catch (err) {
                // Tratamento e exibição perfeita do erro no canto superior direito
                mostrarAlerta(err.message, "erro");
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Atualizar Senha';
            }
        });
    </script>
</body>
</html>
