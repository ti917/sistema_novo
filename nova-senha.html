<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Redefinir Senha - RH Soul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #002347; --cor-secundaria: #003366; --cor-acento: #20c997; /* Verde água do financeiro */
            --cor-sucesso: #2ecc71;
            --cor-perigo: #e74c3c;
            --cor-alerta: #f1c40f;
            --cor-borda: rgba(255,255,255,0.1);
            --cor-texto-principal: #fff;
            --cor-texto-secundario: #a0aec0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-image: linear-gradient(135deg, var(--cor-principal) 0%, var(--cor-secundaria) 100%);
            color: var(--cor-texto-principal);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .glass-card { background: rgba(0, 25, 51, 0.6); backdrop-filter: blur(15px); border: 1px solid var(--cor-borda); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; text-align: center; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: var(--cor-texto-secundario); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); }
        input { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid var(--cor-borda); color: var(--cor-texto-principal); background: rgba(0, 0, 0, 0.3); border-radius: 8px; font-size: 0.95em; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cor-acento); background: rgba(0, 0, 0, 0.5); }
        
        /* Estilização da lista de requisitos da senha */
        .requisitos-senha {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.8rem;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-req { display: flex; align-items: center; gap: 6px; color: var(--cor-texto-secundario); transition: 0.2s; }
        .item-req.valido { color: var(--cor-sucesso); }
        .item-req i { font-size: 0.75rem; }

        button { cursor: pointer; transition: all 0.2s; border-radius: 6px; font-weight: bold; border: none; width: 100%; height: 50px; font-size: 1rem; margin-top: 10px; }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success { background: var(--cor-acento); color: #000; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 15px; }
        .toast { min-width: 280px; max-width: 400px; background-color: #1e293b; color: #ffffff; padding: 16px 20px; border-radius: 8px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; }
        .toast.erro { border-left: 6px solid var(--cor-perigo); }
        .toast.sucesso { border-left: 6px solid var(--cor-sucesso); }
        .toast.aviso { border-left: 6px solid var(--cor-alerta); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="glass-card">
        <div style="margin-bottom: 20px;">
            <a href="https://gruposoulbr.com/" target="_blank">
                <img src="https://kefvwdxebzgedugqeimz.supabase.co/storage/v1/object/public/documentos/Logos/logo%20soul.png" alt="Logo" style="height: 45px; width: 45px; object-fit: contain; border-radius: 50%;">
            </a>
            <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 900; margin-top: 10px; margin-bottom: 5px; color: #fff;">Nova Senha</h2>
            <p style="color: var(--cor-texto-secundario); font-size: 0.85rem; margin: 0;">Defina uma senha forte de acesso para os painéis organizacionais.</p>
        </div>
        
        <form id="form-alterar-senha-fin">
            <div class="form-group">
                <label>Nova Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha1" required placeholder="Digite sua senha forte" autocomplete="new-password"/>
                </div>
                
                <div class="requisitos-senha">
                    <div id="req-comprimento" class="item-req"><i class="fa-solid fa-circle"></i> Mínimo de 8 caracteres</div>
                    <div id="req-maiuscula" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 letra maiúscula</div>
                    <div id="req-numero" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 número</div>
                    <div id="req-especial" class="item-req"><i class="fa-solid fa-circle"></i> Pelo menos 1 caractere especial (!@#$%)</div>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar Nova Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-double"></i>
                    <input type="password" id="senha2" required placeholder="Repita a nova senha" autocomplete="new-password"/>
                </div>
            </div>
            
            <button type="submit" id="btn-salvar" class="btn-primary btn-success" disabled>Atualizar Senha</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const inputSenha1 = document.getElementById('senha1');
        const inputSenha2 = document.getElementById('senha2');
        const btnSalvar = document.getElementById('btn-salvar');

        // Configuração dos Padrões Regex de Segurança
        const regras = {
            comprimento: (v) => v.length >= 8,
            maiuscula: (v) => /[A-Z]/.test(v),
            numero: (v) => /[0-9]/.test(v),
            especial: (v) => /[^A-Za-z0-9]/.test(v)
        };

        function mostrarAlerta(msg, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const icon = tipo === "sucesso" ? "fa-check-circle" : (tipo === "erro" ? "fa-triangle-exclamation" : "fa-circle-info");
            toast.innerHTML = `<i class="fa-solid ${icon}" style="font-size: 1.3rem;"></i> <div><span>${msg}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
        }

        // Validador Visual em Tempo Real (Enquanto digita)
        function validarSenhaTempoReal() {
            const valor = inputSenha1.value;
            
            const checks = {
                comprimento: regras.comprimento(valor),
                maiuscula: regras.maiuscula(valor),
                numero: regras.numero(valor),
                especial: regras.especial(valor)
            };

            // Atualiza cada item visual da lista
            atualizarItemUI('req-comprimento', checks.comprimento);
            atualizarItemUI('req-maiuscula', checks.maiuscula);
            atualizarItemUI('req-numero', checks.numero);
            atualizarItemUI('req-especial', checks.especial);

            // Só libera o botão principal se TODOS os critérios passarem
            const tudoValido = Object.values(checks).every(v => v === true);
            btnSalvar.disabled = !tudoValido;
        }

        function atualizarItemUI(idElemento, isValido) {
            const el = document.getElementById(idElemento);
            const icone = el.querySelector('i');
            if (isValido) {
                el.classList.add('valido');
                icone.className = "fa-solid fa-circle-check";
            } else {
                el.classList.remove('valido');
                icone.className = "fa-solid fa-circle";
            }
        }

        inputSenha1.addEventListener('input', validarSenhaTempoReal);

        // Disparo do Formulário
        document.getElementById('form-alterar-senha-fin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const s1 = inputSenha1.value;
            const s2 = inputSenha2.value;

            // Segunda trava de segurança no submit (Garante as senhas batendo)
            if (s1 !== s2) {
                return mostrarAlerta("As senhas informadas não coincidem!", "erro");
            }

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando...';

            try {
                const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                
                if (!sessionData.session) {
                    throw new Error("Sessão inválida ou link expirado. Solicite a redefinição de senha novamente.");
                }

                const { error } = await supabaseClient.auth.updateUser({ password: s1 });
                if (error) throw error;

                mostrarAlerta("Senha forte atualizada com sucesso! Redirecionando...", "sucesso");
                btnSalvar.innerHTML = '<i class="fa-solid fa-check"></i> Concluído';
                
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 3000);

            } catch (err) {
                mostrarAlerta(err.message, "erro");
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = 'Atualizar Senha';
            }
        });
    </script>
</body>
</html>
