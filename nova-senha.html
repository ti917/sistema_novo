<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Redefinir Senha - RH Soul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #002347; --cor-secundaria: #003366; --cor-acento: #ffc107; --cor-acento-hover: #ffa000;
            --cor-texto-principal: #ffffff; --cor-texto-secundario: #a6b0cf; --cor-borda: rgba(255, 255, 255, 0.15);
            --cor-fundo-input: rgba(0, 0, 0, 0.2); --cor-perigo: #dc3545; --cor-sucesso: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-image: linear-gradient(135deg, var(--cor-principal) 0%, var(--cor-secundaria) 100%); color: var(--cor-texto-principal); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .glass-card { background: rgba(0, 25, 51, 0.6); backdrop-filter: blur(15px); border: 1px solid var(--cor-acento); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; text-align: center; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: var(--cor-texto-secundario); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); }
        input { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid var(--cor-borda); border-radius: 8px; background-color: var(--cor-fundo-input); color: var(--cor-texto-principal); font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cor-acento); }

        .btn-primary { background-color: var(--cor-acento); color: #000; border: none; padding: 14px 25px; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; width: 100%; margin-top: 10px; }
        .btn-primary:hover:not(:disabled) { background-color: var(--cor-acento-hover); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        #msg-box { margin-top: 15px; font-size: 0.9rem; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="https://gozgames.neocities.org/Si%CC%81mbolo%20-%20fundo%20azul.png" alt="Logo" style="width: 80px; margin-bottom: 15px;">
        <h2 style="color: var(--cor-acento); margin-bottom: 10px;">Criar Nova Senha</h2>
        <p style="color: var(--cor-texto-secundario); font-size: 0.9rem; margin-bottom: 25px;">Digite sua nova senha de acesso ao portal RH Soul.</p>
        
        <form id="form-nova-senha">
            <div class="form-group">
                <label>Nova Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha1" required placeholder="Mínimo de 6 caracteres" minlength="6" />
                </div>
            </div>
            <div class="form-group">
                <label>Confirmar Nova Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-check-double"></i>
                    <input type="password" id="senha2" required placeholder="Repita a nova senha" minlength="6" />
                </div>
            </div>
            
            <button type="submit" id="btn-salvar" class="btn-primary">Atualizar Senha</button>
            <div id="msg-box"></div>
        </form>
    </div>

    <script>
        // LIGAÇÃO COM O SEU SUPABASE
        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        
        // 👇 AQUI ESTÁ O SEGREDO: COLE A SUA CHAVE 'anon public' VERDADEIRA AQUI (AQUELA GIGANTE QUE COMEÇA COM eyJ...) 👇
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo'; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('form-nova-senha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const s1 = document.getElementById('senha1').value;
            const s2 = document.getElementById('senha2').value;
            const msg = document.getElementById('msg-box');
            const btn = document.getElementById('btn-salvar');

            if (s1 !== s2) {
                msg.style.color = "var(--cor-perigo)";
                msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> As senhas não conferem!';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando...';
            msg.innerHTML = '';

            try {
                // 1. Verifica se o cara realmente tem autorização (se ele veio pelo link do e-mail)
                const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError) throw sessionError;
                
                if (!sessionData.session) {
                    throw new Error("Sessão expirada ou inválida. Por favor, clique novamente no link enviado para o seu e-mail.");
                }

                // 2. Manda atualizar a senha
                const { data, error } = await supabase.auth.updateUser({ password: s1 });

                if (error) throw error;

                // 3. Sucesso!
                msg.style.color = "var(--cor-sucesso)";
                msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Senha atualizada com sucesso!';
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Concluído';
                
                // Redireciona para o login após 3 segundos
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 3000);

            } catch (err) {
                // Se der QUALQUER erro, agora ele cospe na tela ao invés de congelar
                msg.style.color = "var(--cor-perigo)";
                msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Erro: ' + err.message;
                btn.disabled = false;
                btn.innerHTML = 'Atualizar Senha';
            }
        });
    </script>
</body>
</html>
