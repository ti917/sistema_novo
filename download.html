<!-- v1.0.1 - página de download por ID, RH Soul -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Download - RH Soul</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --cor-principal: #000c18;
            --cor-secundaria: #001f3f;
            --cor-acento: #ffc107;
            --cor-texto: #f8fafc;
            --cor-texto-mutado: #94a3b8;
            --cor-borda: rgba(255, 255, 255, 0.08);
            --cor-sucesso: #10b981;
            --cor-perigo: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at top right, var(--cor-secundaria), var(--cor-principal));
            background-attachment: fixed;
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .mobile-card {
            background: rgba(2, 12, 27, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .icone-topo {
            width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(255,193,7,0.18), rgba(255,193,7,0.05));
            border: 1px solid rgba(255,193,7,0.3);
            display: flex; align-items: center; justify-content: center;
            color: var(--cor-acento); font-size: 1.8rem;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.35;
            word-break: break-word;
        }

        p.subtitulo { color: var(--cor-texto-mutado); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }

        .btn-baixar {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(255, 152, 0, 0.5);
        }
        .btn-baixar:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -5px rgba(255, 152, 0, 0.6); }

        .rodape { margin-top: 24px; font-size: 0.75rem; color: var(--cor-texto-mutado); }

        .hidden { display: none !important; }
        .spinner { font-size: 2rem; color: var(--cor-acento); }
    </style>
</head>
<body>

    <div class="mobile-card" id="card-carregando">
        <i class="fa-solid fa-circle-notch fa-spin spinner"></i>
        <p class="subtitulo" style="margin-top: 16px; margin-bottom: 0;">Buscando arquivo...</p>
    </div>

    <div class="mobile-card hidden" id="card-arquivo">
        <div class="icone-topo"><i class="fa-solid fa-file-arrow-down" id="icone-tipo-arquivo"></i></div>
        <h2 id="lbl-nome-arquivo">-</h2>
        <p class="subtitulo">Toque no botão abaixo pra baixar o arquivo mais atualizado.</p>
        <a href="#" id="btn-baixar-arquivo" class="btn-baixar" target="_blank">
            <i class="fa-solid fa-download"></i> Baixar Arquivo
        </a>
        <p class="rodape">Disponibilizado pela equipe de Recursos Humanos.</p>
    </div>

    <div class="mobile-card hidden" id="card-erro">
        <div class="icone-topo" style="background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(239,68,68,0.05)); border-color: rgba(239,68,68,0.3); color: var(--cor-perigo);"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2>Arquivo não encontrado</h2>
        <p class="subtitulo" id="lbl-erro">Esse link não é válido, ou o arquivo foi removido. Escaneie o QR Code novamente ou fale com o RH.</p>
    </div>

    <script>
    async function iniciarDownload() {
        if (typeof window.supabase === 'undefined') {
            document.getElementById('card-carregando').classList.add('hidden');
            document.getElementById('lbl-erro').innerText = 'Erro de rede. Recarregue a página.';
            document.getElementById('card-erro').classList.remove('hidden');
            return;
        }

        const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const idArquivo = urlParams.get('id');

        const mostrarErro = (msg) => {
            document.getElementById('card-carregando').classList.add('hidden');
            document.getElementById('lbl-erro').innerText = msg;
            document.getElementById('card-erro').classList.remove('hidden');
        };

        if (!idArquivo) {
            mostrarErro('Faltam parâmetros na URL. Escaneie o QR Code novamente.');
            return;
        }

        try {
            const { data, error } = await supabaseClient
                .from('central_downloads')
                .select('nome_arquivo, url_arquivo')
                .eq('id', idArquivo)
                .single();

            if (error || !data) throw new Error('not_found');

            let icone = 'fa-file-arrow-down';
            const urlLower = (data.url_arquivo || '').toLowerCase();
            if (urlLower.includes('.pdf')) icone = 'fa-file-pdf';
            else if (urlLower.includes('.xls')) icone = 'fa-file-excel';
            else if (urlLower.includes('.doc')) icone = 'fa-file-word';

            document.getElementById('icone-tipo-arquivo').className = `fa-solid ${icone}`;
            document.getElementById('lbl-nome-arquivo').innerText = data.nome_arquivo;
            document.getElementById('btn-baixar-arquivo').href = data.url_arquivo;

            document.getElementById('card-carregando').classList.add('hidden');
            document.getElementById('card-arquivo').classList.remove('hidden');
        } catch (e) {
            mostrarErro('Esse link não é válido, ou o arquivo foi removido. Escaneie o QR Code novamente ou fale com o RH.');
        }
    }

    iniciarDownload();
    </script>
</body>
</html>
