<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Serviço - SOUL Facilities</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --azul: #0d2340;
    --azul-claro: #4fc3f7;
    --fundo: #0a1628;
    --card: #101f38;
    --borda: rgba(255,255,255,0.1);
    --texto: #e2e8f0;
    --texto-sec: #94a3b8;
    --sucesso: #28a745;
    --perigo: #dc3545;
    --aviso: #ff9800;
    --emergencial: #e91e63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--fundo); color: var(--texto); min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- TELA DE LOGIN ---------- */
  #tela-login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--borda); border-radius: 16px;
    padding: 40px 35px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    font-size: 1.3rem; margin: 0 0 5px 0; color: #fff; text-align: center;
  }
  .login-card p.sub { color: var(--texto-sec); font-size: 0.85rem; text-align: center; margin: 0 0 25px 0; }
  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 0.8rem; color: var(--texto-sec); margin-bottom: 6px; font-weight: 600; }
  .campo input, .campo select, .campo textarea {
    width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--borda);
    background: rgba(255,255,255,0.04); color: var(--texto); font-size: 0.95rem; outline: none;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul-claro); }
  .btn {
    width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: 0.2s;
  }
  .btn-primario { background: var(--azul-claro); color: #001018; }
  .btn-primario:hover { filter: brightness(1.1); }
  .btn-secundario { background: transparent; border: 1px solid var(--borda); color: var(--texto); }
  .btn-perigo { background: var(--perigo); color: #fff; }
  .erro-login { color: var(--perigo); font-size: 0.85rem; text-align: center; margin-top: 12px; min-height: 18px; }

  /* ---------- APP (pós-login) ---------- */
  #app-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--borda);
  }
  #app-header .marca { font-weight: 800; color: #fff; font-size: 1.05rem; }
  #app-header .marca span { color: var(--azul-claro); }
  #app-header .usuario-info { display: flex; align-items: center; gap: 14px; font-size: 0.85rem; color: var(--texto-sec); }
  #app-main { max-width: 1000px; margin: 0 auto; padding: 24px; }

  .topo-acoes { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .topo-acoes h2 { margin: 0; font-size: 1.2rem; color: #fff; }
  .grupo-btns { display: flex; gap: 10px; }
  .grupo-btns .btn { width: auto; padding: 10px 18px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px 14px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid var(--borda); }
  th { color: var(--texto-sec); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  .vazio { text-align: center; color: var(--texto-sec); padding: 40px 20px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
  .badge-Baixa { background: rgba(40,167,69,0.18); color: #28a745; }
  .badge-Média { background: rgba(255,152,0,0.18); color: #ff9800; }
  .badge-Alta { background: rgba(220,53,69,0.18); color: #dc3545; }
  .badge-Emergencial { background: rgba(233,30,99,0.22); color: #e91e63; }
  .badge-status { background: rgba(148,163,184,0.18); color: #94a3b8; }

  /* ---------- MODAL ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 1000;
  }
  .modal {
    background: var(--card); border: 1px solid var(--borda); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 20px 0; color: #fff; font-size: 1.1rem; }
  .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .urgencia-opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .urgencia-opcoes label {
    display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px;
    border: 1px solid var(--borda); cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  .urgencia-opcoes input { width: auto; }
  .modal-acoes { display: flex; gap: 10px; margin-top: 22px; }
  .modal-acoes .btn { flex: 1; }

  .conta-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 10px;
  }
  .conta-item .nome { font-weight: 700; color: #fff; font-size: 0.9rem; }
  .conta-item .usuario { color: var(--texto-sec); font-size: 0.78rem; }
  .conta-item.inativa { opacity: 0.5; }
  .toggle-btn { padding: 6px 12px; font-size: 0.78rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--borda); background: transparent; color: var(--texto); }

  hr.sep { border: 0; border-top: 1px dashed var(--borda); margin: 22px 0; }
</style>
</head>
<body>

<!-- ======================= TELA DE LOGIN ======================= -->
<div id="tela-login">
  <div class="login-card">
    <h1>Solicitação de <span style="color:var(--azul-claro)">Serviço</span></h1>
    <p class="sub">SOUL Facilities — acesso restrito</p>

    <div class="campo">
      <label>Usuário (ou seu e-mail, se você for o Super Admin)</label>
      <input type="text" id="login-usuario" autocomplete="username" placeholder="Digite seu usuário">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" placeholder="Digite sua senha">
    </div>
    <button class="btn btn-primario" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="login-erro"></div>
  </div>
</div>

<!-- ======================= APP (pós-login) ======================= -->
<div id="tela-app" class="hidden">
  <div id="app-header">
    <div class="marca">SOUL <span>Facilities</span></div>
    <div class="usuario-info">
      <span id="texto-usuario-logado"></span>
      <button class="btn btn-secundario" style="width:auto; padding:8px 14px;" onclick="sair()">Sair</button>
    </div>
  </div>

  <div id="app-main">
    <div class="topo-acoes">
      <h2 id="titulo-lista">Minhas Solicitações</h2>
      <div class="grupo-btns">
        <button class="btn btn-secundario hidden" id="btn-criar-conta" onclick="abrirModalContas()">
          <i>👤</i> Criar Conta
        </button>
        <button class="btn btn-primario" onclick="abrirModalNovaSolicitacao()">+ Nova Solicitação</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Unidade</th>
          <th>Serviço / Setor</th>
          <th>Urgência</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela-solicitacoes">
        <tr><td colspan="5" class="vazio">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ======================= MODAL: NOVA SOLICITAÇÃO ======================= -->
<div id="modal-nova-solicitacao" class="overlay hidden">
  <div class="modal">
    <h3>Nova Solicitação de Serviço</h3>
    <form id="form-nova-solicitacao" onsubmit="salvarSolicitacao(event)">
      <div class="form-row2">
        <div class="campo">
          <label>Data</label>
          <input type="date" id="sol-data" required>
        </div>
        <div class="campo">
          <label>Solicitante</label>
          <input type="text" id="sol-solicitante" required>
        </div>
      </div>

      <div class="campo">
        <label>Unidade</label>
        <select id="sol-unidade" required>
          <option value="">Carregando unidades...</option>
        </select>
      </div>

      <div class="form-row2">
        <div class="campo">
          <label>Cidade</label>
          <input type="text" id="sol-cidade">
        </div>
        <div class="campo">
          <label>Estado</label>
          <input type="text" id="sol-estado" maxlength="2" placeholder="Ex: SP" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="campo">
        <label>Serviços / Setor</label>
        <textarea id="sol-servicos" rows="4" required placeholder="Descreva o serviço necessário..."></textarea>
      </div>

      <div class="campo">
        <label>Responsável pelo serviço</label>
        <input type="text" id="sol-responsavel">
      </div>

      <div class="campo">
        <label>Grau de urgência</label>
        <div class="urgencia-opcoes">
          <label><input type="radio" name="sol-urgencia" value="Baixa" checked> Baixa</label>
          <label><input type="radio" name="sol-urgencia" value="Média"> Média</label>
          <label><input type="radio" name="sol-urgencia" value="Alta"> Alta</label>
          <label><input type="radio" name="sol-urgencia" value="Emergencial"> Emergencial</label>
        </div>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" onclick="fecharModal('modal-nova-solicitacao')">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar Solicitação</button>
      </div>
    </form>
  </div>
</div>

<!-- ======================= MODAL: CONTAS (SÓ ADMIN) ======================= -->
<div id="modal-contas" class="overlay hidden">
  <div class="modal" style="max-width: 480px;">
    <h3>Contas de Acesso</h3>

    <form id="form-nova-conta" onsubmit="criarConta(event)">
      <div class="campo">
        <label>Nome da pessoa</label>
        <input type="text" id="conta-nome" required>
      </div>
      <div class="form-row2">
        <div class="campo">
          <label>Usuário (login)</label>
          <input type="text" id="conta-usuario" required autocomplete="off">
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="text" id="conta-senha" required minlength="4" autocomplete="off">
        </div>
      </div>
      <button type="submit" class="btn btn-primario">+ Criar Conta</button>
    </form>

    <hr class="sep">

    <div id="lista-contas">
      <p class="vazio">Carregando contas...</p>
    </div>

    <div class="modal-acoes">
      <button type="button" class="btn btn-secundario" onclick="fecharModal('modal-contas')">Fechar</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// Mesmo projeto Supabase que o sistema de RH já usa (só tabelas novas nele)
// ============================================================================
const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// UUID do Super Admin (mesmo já usado no sistema de RH/Clara)
const ID_SUPER_ADMIN = 'fa338e33-18c9-467e-bf3e-34880fd9324e';

const CHAVE_SESSAO = 'solicitacao_servico_sessao';

// Sessão em memória: { tipo: 'admin' | 'conta', conta_id, nome, usuario }
let sessaoAtual = null;

// ---------------------------------------------------------------------------
// LOGIN
// ---------------------------------------------------------------------------
async function fazerLogin() {
  const usuario = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  const btn = document.getElementById('btn-entrar');
  erroEl.textContent = '';

  if (!usuario || !senha) {
    erroEl.textContent = 'Preencha usuário e senha.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    // 1) Tenta primeiro como conta "simples" da tabela nova
    const { data: contaData, error: contaErro } = await supabaseClient.rpc('login_servico_conta', {
      p_usuario: usuario,
      p_senha: senha
    });

    if (!contaErro && contaData && contaData.length > 0) {
      const c = contaData[0];
      definirSessao({ tipo: 'conta', conta_id: c.id, nome: c.nome, usuario: c.usuario });
      return;
    }

    // 2) Se não achou na tabela nova, tenta como Super Admin via Supabase Auth
    //    (login real — precisa ser o e-mail dele mesmo)
    const { data: authData, error: authErro } = await supabaseClient.auth.signInWithPassword({
      email: usuario,
      password: senha
    });

    if (!authErro && authData && authData.user && authData.user.id === ID_SUPER_ADMIN) {
      definirSessao({ tipo: 'admin', conta_id: null, nome: 'Super Admin', usuario: authData.user.email });
      return;
    }

    // Se chegou aqui, nenhum dos dois deu certo
    if (authData && authData.user) {
      // Logou no Supabase Auth mas não é o Super Admin autorizado aqui
      await supabaseClient.auth.signOut();
    }
    erroEl.textContent = 'Usuário ou senha inválidos.';
  } catch (e) {
    console.error(e);
    erroEl.textContent = 'Erro ao tentar entrar. Tente novamente.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function definirSessao(sessao) {
  sessaoAtual = sessao;
  localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao));
  entrarNoApp();
}

async function sair() {
  if (sessaoAtual && sessaoAtual.tipo === 'admin') {
    await supabaseClient.auth.signOut();
  }
  sessaoAtual = null;
  localStorage.removeItem(CHAVE_SESSAO);
  document.getElementById('tela-app').classList.add('hidden');
  document.getElementById('tela-login').classList.remove('hidden');
  document.getElementById('login-usuario').value = '';
  document.getElementById('login-senha').value = '';
}

function entrarNoApp() {
  document.getElementById('tela-login').classList.add('hidden');
  document.getElementById('tela-app').classList.remove('hidden');
  document.getElementById('texto-usuario-logado').textContent =
    (sessaoAtual.tipo === 'admin' ? '👑 ' : '') + sessaoAtual.nome;
  document.getElementById('titulo-lista').textContent =
    sessaoAtual.tipo === 'admin' ? 'Todas as Solicitações' : 'Minhas Solicitações';
  document.getElementById('btn-criar-conta').classList.toggle('hidden', sessaoAtual.tipo !== 'admin');

  carregarSolicitacoes();
  carregarUnidades();
}

// Tenta restaurar sessão salva ao abrir a página
async function tentarRestaurarSessao() {
  const salvo = localStorage.getItem(CHAVE_SESSAO);
  if (!salvo) return;

  try {
    const sessao = JSON.parse(salvo);
    if (sessao.tipo === 'admin') {
      // Confirma que a sessão do Supabase Auth ainda está válida
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session && data.session.user && data.session.user.id === ID_SUPER_ADMIN) {
        sessaoAtual = sessao;
        entrarNoApp();
      } else {
        localStorage.removeItem(CHAVE_SESSAO);
      }
    } else {
      // Conta simples: não tem como "revalidar" sem senha salva, então
      // confia na sessão local (é o mesmo nível de simplicidade pedido).
      sessaoAtual = sessao;
      entrarNoApp();
    }
  } catch (e) {
    localStorage.removeItem(CHAVE_SESSAO);
  }
}

// ---------------------------------------------------------------------------
// UNIDADES (lidas do sistema de RH, só leitura, mesmo projeto Supabase)
// ---------------------------------------------------------------------------
async function carregarUnidades() {
  const select = document.getElementById('sol-unidade');
  try {
    const { data, error } = await supabaseClient
      .from('unidades_oficiais')
      .select('nome')
      .eq('ativo', true)
      .order('nome');

    if (error) throw error;

    select.innerHTML = '<option value="">Selecione a unidade...</option>' +
      (data || []).map(u => `<option value="${escaparHtml(u.nome)}">${escaparHtml(u.nome)}</option>`).join('');
  } catch (e) {
    console.error('Erro ao carregar unidades:', e);
    select.innerHTML = '<option value="">Não foi possível carregar as unidades</option>';
  }
}

// ---------------------------------------------------------------------------
// SOLICITAÇÕES
// ---------------------------------------------------------------------------
async function carregarSolicitacoes() {
  const corpo = document.getElementById('corpo-tabela-solicitacoes');
  corpo.innerHTML = '<tr><td colspan="5" class="vazio">Carregando...</td></tr>';

  try {
    const { data, error } = await supabaseClient.rpc('listar_solicitacoes_servico', {
      p_conta_id: sessaoAtual.conta_id
    });

    if (error) throw error;

    if (!data || data.length === 0) {
      corpo.innerHTML = '<tr><td colspan="5" class="vazio">Nenhuma solicitação encontrada ainda.</td></tr>';
      return;
    }

    corpo.innerHTML = data.map(s => `
      <tr>
        <td>${formatarDataBR(s.data)}</td>
        <td>${escaparHtml(s.unidade)}</td>
        <td>${escaparHtml((s.servicos_setor || '').slice(0, 60))}${(s.servicos_setor || '').length > 60 ? '...' : ''}</td>
        <td><span class="badge badge-${s.urgencia}">${escaparHtml(s.urgencia)}</span></td>
        <td><span class="badge badge-status">${escaparHtml(s.status)}</span></td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
    corpo.innerHTML = '<tr><td colspan="5" class="vazio">Erro ao carregar solicitações.</td></tr>';
  }
}

function abrirModalNovaSolicitacao() {
  document.getElementById('form-nova-solicitacao').reset();
  document.getElementById('sol-data').value = new Date().toISOString().split('T')[0];
  document.getElementById('sol-solicitante').value = sessaoAtual.nome;
  document.getElementById('modal-nova-solicitacao').classList.remove('hidden');
}

async function salvarSolicitacao(e) {
  e.preventDefault();
  const urgenciaEl = document.querySelector('input[name="sol-urgencia"]:checked');

  try {
    const { error } = await supabaseClient.rpc('criar_solicitacao_servico', {
      p_conta_id: sessaoAtual.conta_id,
      p_solicitante_nome: document.getElementById('sol-solicitante').value.trim(),
      p_unidade: document.getElementById('sol-unidade').value,
      p_cidade: document.getElementById('sol-cidade').value.trim() || null,
      p_estado: document.getElementById('sol-estado').value.trim().toUpperCase() || null,
      p_servicos_setor: document.getElementById('sol-servicos').value.trim(),
      p_responsavel_servico: document.getElementById('sol-responsavel').value.trim() || null,
      p_urgencia: urgenciaEl ? urgenciaEl.value : 'Baixa'
    });

    if (error) throw error;

    fecharModal('modal-nova-solicitacao');
    carregarSolicitacoes();
  } catch (e) {
    alert('Erro ao salvar: ' + (e.message || e));
  }
}

// ---------------------------------------------------------------------------
// CONTAS (só Super Admin)
// ---------------------------------------------------------------------------
function abrirModalContas() {
  document.getElementById('form-nova-conta').reset();
  document.getElementById('modal-contas').classList.remove('hidden');
  carregarContas();
}

async function carregarContas() {
  const lista = document.getElementById('lista-contas');
  lista.innerHTML = '<p class="vazio">Carregando contas...</p>';

  try {
    const { data, error } = await supabaseClient.rpc('listar_contas_servico');
    if (error) throw error;

    if (!data || data.length === 0) {
      lista.innerHTML = '<p class="vazio">Nenhuma conta criada ainda.</p>';
      return;
    }

    lista.innerHTML = data.map(c => `
      <div class="conta-item ${c.ativo ? '' : 'inativa'}">
        <div>
          <div class="nome">${escaparHtml(c.nome)}</div>
          <div class="usuario">usuário: ${escaparHtml(c.usuario)} ${c.ativo ? '' : '(desativada)'}</div>
        </div>
        <button class="toggle-btn" onclick="alternarConta('${c.id}', ${!c.ativo})">
          ${c.ativo ? 'Desativar' : 'Ativar'}
        </button>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    lista.innerHTML = '<p class="vazio">Erro ao carregar contas.</p>';
  }
}

async function criarConta(e) {
  e.preventDefault();
  try {
    const { error } = await supabaseClient.rpc('criar_conta_servico', {
      p_usuario: document.getElementById('conta-usuario').value.trim(),
      p_senha: document.getElementById('conta-senha').value,
      p_nome: document.getElementById('conta-nome').value.trim()
    });

    if (error) throw error;

    document.getElementById('form-nova-conta').reset();
    carregarContas();
  } catch (e) {
    alert('Erro ao criar conta: ' + (e.message || e));
  }
}

async function alternarConta(id, novoAtivo) {
  try {
    const { error } = await supabaseClient.rpc('alternar_conta_servico', {
      p_conta_id: id,
      p_ativo: novoAtivo
    });
    if (error) throw error;
    carregarContas();
  } catch (e) {
    alert('Erro: ' + (e.message || e));
  }
}

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function fecharModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function escaparHtml(str) {
  if (str === null || str === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function formatarDataBR(iso) {
  if (!iso) return '—';
  const p = String(iso).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}

// Fecha modal clicando fora
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => {
    if (e.target === ov) ov.classList.add('hidden');
  });
});

// Enter no login
document.getElementById('login-senha').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fazerLogin();
});

// Inicialização
tentarRestaurarSessao();
</script>
