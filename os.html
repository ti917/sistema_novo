<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Serviço - SOUL Facilities</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --azul: #0d2340;
    --azul-claro: #4fc3f7;
    --fundo: #0a1628;
    --card: #101f38;
    --borda: rgba(255,255,255,0.1);
    --texto: #e2e8f0;
    --texto-sec: #94a3b8;
    --sucesso: #28a745;
    --perigo: #dc3545;
    --aviso: #ff9800;
    --emergencial: #e91e63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--fundo); color: var(--texto); min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- TELA DE LOGIN ---------- */
  #tela-login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--borda); border-radius: 16px;
    padding: 40px 35px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    font-size: 1.3rem; margin: 0 0 5px 0; color: #fff; text-align: center;
  }
  .login-card p.sub { color: var(--texto-sec); font-size: 0.85rem; text-align: center; margin: 0 0 25px 0; }
  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 0.8rem; color: var(--texto-sec); margin-bottom: 6px; font-weight: 600; }
  .campo input, .campo select, .campo textarea {
    width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--borda);
    background: rgba(255,255,255,0.04); color: var(--texto); font-size: 0.95rem; outline: none;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul-claro); }
  .btn {
    width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: 0.2s;
  }
  .btn-primario { background: var(--azul-claro); color: #001018; }
  .btn-primario:hover { filter: brightness(1.1); }
  .btn-secundario { background: transparent; border: 1px solid var(--borda); color: var(--texto); }
  .btn-perigo { background: var(--perigo); color: #fff; }
  .erro-login { color: var(--perigo); font-size: 0.85rem; text-align: center; margin-top: 12px; min-height: 18px; }

  /* ---------- APP (pós-login) ---------- */
  #app-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--borda);
  }
  #app-header .marca { font-weight: 800; color: #fff; font-size: 1.05rem; }
  #app-header .marca span { color: var(--azul-claro); }
  #app-header .usuario-info { display: flex; align-items: center; gap: 14px; font-size: 0.85rem; color: var(--texto-sec); }
  #app-main { max-width: 1000px; margin: 0 auto; padding: 24px; }

  .topo-acoes { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .topo-acoes h2 { margin: 0; font-size: 1.2rem; color: #fff; }
  .grupo-btns { display: flex; gap: 10px; }
  .grupo-btns .btn { width: auto; padding: 10px 18px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px 14px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid var(--borda); }
  th { color: var(--texto-sec); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  .vazio { text-align: center; color: var(--texto-sec); padding: 40px 20px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
  .badge-Baixa { background: rgba(40,167,69,0.18); color: #28a745; }
  .badge-Média { background: rgba(255,152,0,0.18); color: #ff9800; }
  .badge-Alta { background: rgba(220,53,69,0.18); color: #dc3545; }
  .badge-Emergencial { background: rgba(233,30,99,0.22); color: #e91e63; }
  .badge-status { background: rgba(148,163,184,0.18); color: #94a3b8; }

  /* ---------- MODAL ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 1000;
  }
  .modal {
    background: var(--card); border: 1px solid var(--borda); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 20px 0; color: #fff; font-size: 1.1rem; }
  .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .urgencia-opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .urgencia-opcoes label {
    display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px;
    border: 1px solid var(--borda); cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  .urgencia-opcoes input { width: auto; }
  .modal-acoes { display: flex; gap: 10px; margin-top: 22px; }
  .modal-acoes .btn { flex: 1; }

  .conta-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 10px;
  }
  .conta-item .nome { font-weight: 700; color: #fff; font-size: 0.9rem; }
  .conta-item .usuario { color: var(--texto-sec); font-size: 0.78rem; }
  .conta-item.inativa { opacity: 0.5; }
  .toggle-btn { padding: 6px 12px; font-size: 0.78rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--borda); background: transparent; color: var(--texto); }

  hr.sep { border: 0; border-top: 1px dashed var(--borda); margin: 22px 0; }

  .unidades-check-lista {
    max-height: 160px; overflow-y: auto; border: 1px solid var(--borda); border-radius: 8px;
    padding: 8px 10px; background: rgba(255,255,255,0.03);
  }
  .unidades-check-lista label {
    display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 0.83rem; cursor: pointer;
  }
  .unidades-check-lista input { width: auto; }
  .tag-unidade {
    display: inline-block; background: rgba(79,195,247,0.15); color: var(--azul-claro);
    padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; margin: 2px 4px 0 0; font-weight: 700;
  }
  .conta-item { flex-direction: column; align-items: stretch; }
  .conta-item .conta-topo { display: flex; justify-content: space-between; align-items: center; }
  .conta-item .conta-acoes { display: flex; gap: 8px; }
</style>
</head>
<body>

<!-- ======================= TELA DE LOGIN ======================= -->
<div id="tela-login">
  <div class="login-card">
    <h1>Solicitação de <span style="color:var(--azul-claro)">Serviço</span></h1>
    <p class="sub">SOUL Facilities — acesso restrito</p>

    <div class="campo">
      <label>Usuário (ou seu e-mail, se você for o Super Admin)</label>
      <input type="text" id="login-usuario" autocomplete="username" placeholder="Digite seu usuário">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" placeholder="Digite sua senha">
    </div>
    <button class="btn btn-primario" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="login-erro"></div>
  </div>
</div>

<!-- ======================= APP (pós-login) ======================= -->
<div id="tela-app" class="hidden">
  <div id="app-header">
    <div class="marca">SOUL <span>Facilities</span></div>
    <div class="usuario-info">
      <span id="texto-usuario-logado"></span>
      <button class="btn btn-secundario" style="width:auto; padding:8px 14px;" onclick="sair()">Sair</button>
    </div>
  </div>

  <div id="app-main">
    <div class="topo-acoes">
      <h2 id="titulo-lista">Minhas Solicitações</h2>
      <div class="grupo-btns">
        <button class="btn btn-secundario hidden" id="btn-criar-conta" onclick="abrirModalContas()">
          <i>👤</i> Criar Conta
        </button>
        <button class="btn btn-primario" onclick="abrirModalNovaSolicitacao()">+ Nova Solicitação</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Unidade</th>
          <th>Serviço / Setor</th>
          <th>Urgência</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela-solicitacoes">
        <tr><td colspan="5" class="vazio">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ======================= MODAL: NOVA SOLICITAÇÃO ======================= -->
<div id="modal-nova-solicitacao" class="overlay hidden">
  <div class="modal">
    <h3>Nova Solicitação de Serviço</h3>
    <form id="form-nova-solicitacao" onsubmit="salvarSolicitacao(event)">
      <div class="form-row2">
        <div class="campo">
          <label>Data</label>
          <input type="date" id="sol-data" required>
        </div>
        <div class="campo">
          <label>Solicitante</label>
          <input type="text" id="sol-solicitante" required>
        </div>
      </div>

      <div class="campo">
        <label>Unidade</label>
        <select id="sol-unidade" required onchange="autoPreencherCidadeEstado(); carregarResponsaveisManutencao();">
          <option value="">Carregando unidades...</option>
        </select>
      </div>

      <div class="form-row2">
        <div class="campo">
          <label>Cidade <span style="font-weight:400; color:var(--texto-sec);">(preenchido pela unidade, pode editar)</span></label>
          <input type="text" id="sol-cidade">
        </div>
        <div class="campo">
          <label>Estado</label>
          <input type="text" id="sol-estado" maxlength="2" placeholder="Ex: SP" style="text-transform:uppercase;">
        </div>
      </div>

      <div class="campo">
        <label>Serviços / Setor</label>
        <textarea id="sol-servicos" rows="4" required placeholder="Descreva o serviço necessário..."></textarea>
      </div>

      <div class="campo">
        <label>Responsável pelo serviço <span style="font-weight:400; color:var(--texto-sec);">(PJ Manutenção da unidade)</span></label>
        <select id="sol-responsavel">
          <option value="">Selecione a unidade primeiro...</option>
        </select>
      </div>

      <div class="campo">
        <label>Grau de urgência</label>
        <div class="urgencia-opcoes">
          <label><input type="radio" name="sol-urgencia" value="Baixa" checked> Baixa</label>
          <label><input type="radio" name="sol-urgencia" value="Média"> Média</label>
          <label><input type="radio" name="sol-urgencia" value="Alta"> Alta</label>
          <label><input type="radio" name="sol-urgencia" value="Emergencial"> Emergencial</label>
        </div>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-secundario" onclick="fecharModal('modal-nova-solicitacao')">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar Solicitação</button>
      </div>
    </form>
  </div>
</div>

<!-- ======================= MODAL: CONTAS (SÓ ADMIN) ======================= -->
<div id="modal-contas" class="overlay hidden">
  <div class="modal" style="max-width: 480px;">
    <h3 id="titulo-form-conta">Nova Conta de Acesso</h3>

    <form id="form-nova-conta" onsubmit="salvarConta(event)">
      <input type="hidden" id="conta-id-edicao" value="">

      <div class="campo">
        <label>Nome da pessoa</label>
        <input type="text" id="conta-nome" required>
      </div>
      <div class="form-row2">
        <div class="campo">
          <label>Usuário (login)</label>
          <input type="text" id="conta-usuario" required autocomplete="off">
        </div>
        <div class="campo">
          <label id="label-conta-senha">Senha</label>
          <input type="text" id="conta-senha" minlength="4" autocomplete="off" placeholder="Mínimo 4 caracteres">
        </div>
      </div>

      <div class="campo">
        <label>Unidades que essa conta pode usar (marque uma ou mais)</label>
        <div class="unidades-check-lista" id="conta-unidades-lista">
          <p class="vazio" style="padding:8px 0;">Carregando unidades...</p>
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-secundario hidden" id="btn-cancelar-edicao-conta" onclick="cancelarEdicaoConta()">Cancelar edição</button>
        <button type="submit" class="btn btn-primario" id="btn-salvar-conta">+ Criar Conta</button>
      </div>
    </form>

    <hr class="sep">

    <div id="lista-contas">
      <p class="vazio">Carregando contas...</p>
    </div>

    <div class="modal-acoes">
      <button type="button" class="btn btn-secundario" onclick="fecharModal('modal-contas')">Fechar</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// Mesmo projeto Supabase que o sistema de RH já usa (só tabelas novas nele)
// ============================================================================
const SUPABASE_URL = 'https://kefvwdxebzgedugqeimz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sWWZGDqK5Wy_n2ngT2xxWA_NX4gSNTo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// UUID do Super Admin (mesmo já usado no sistema de RH/Clara)
const ID_SUPER_ADMIN = 'fa338e33-18c9-467e-bf3e-34880fd9324e';

const CHAVE_SESSAO = 'solicitacao_servico_sessao';

// Sessão em memória: { tipo: 'admin' | 'conta', conta_id, nome, usuario }
let sessaoAtual = null;

// ---------------------------------------------------------------------------
// LOGIN
// ---------------------------------------------------------------------------
async function fazerLogin() {
  const usuario = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  const btn = document.getElementById('btn-entrar');
  erroEl.textContent = '';

  if (!usuario || !senha) {
    erroEl.textContent = 'Preencha usuário e senha.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    // 1) Tenta primeiro como conta "simples" da tabela nova
    const { data: contaData, error: contaErro } = await supabaseClient.rpc('login_servico_conta', {
      p_usuario: usuario,
      p_senha: senha
    });

    if (!contaErro && contaData && contaData.length > 0) {
      const c = contaData[0];
      definirSessao({ tipo: 'conta', conta_id: c.id, nome: c.nome, usuario: c.usuario, unidades: c.unidades || [] });
      return;
    }

    // 2) Se não achou na tabela nova, tenta como Super Admin via Supabase Auth
    //    (login real — precisa ser o e-mail dele mesmo)
    const { data: authData, error: authErro } = await supabaseClient.auth.signInWithPassword({
      email: usuario,
      password: senha
    });

    if (!authErro && authData && authData.user && authData.user.id === ID_SUPER_ADMIN) {
      definirSessao({ tipo: 'admin', conta_id: null, nome: 'Super Admin', usuario: authData.user.email, unidades: [] });
      return;
    }

    // Se chegou aqui, nenhum dos dois deu certo
    if (authData && authData.user) {
      // Logou no Supabase Auth mas não é o Super Admin autorizado aqui
      await supabaseClient.auth.signOut();
    }
    erroEl.textContent = 'Usuário ou senha inválidos.';
  } catch (e) {
    console.error(e);
    erroEl.textContent = 'Erro ao tentar entrar. Tente novamente.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function definirSessao(sessao) {
  sessaoAtual = sessao;
  localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao));
  entrarNoApp();
}

async function sair() {
  if (sessaoAtual && sessaoAtual.tipo === 'admin') {
    await supabaseClient.auth.signOut();
  }
  sessaoAtual = null;
  localStorage.removeItem(CHAVE_SESSAO);
  document.getElementById('tela-app').classList.add('hidden');
  document.getElementById('tela-login').classList.remove('hidden');
  document.getElementById('login-usuario').value = '';
  document.getElementById('login-senha').value = '';
}

function entrarNoApp() {
  document.getElementById('tela-login').classList.add('hidden');
  document.getElementById('tela-app').classList.remove('hidden');
  document.getElementById('texto-usuario-logado').textContent =
    (sessaoAtual.tipo === 'admin' ? '👑 ' : '') + sessaoAtual.nome;
  document.getElementById('titulo-lista').textContent =
    sessaoAtual.tipo === 'admin' ? 'Todas as Solicitações' : 'Minhas Solicitações';
  document.getElementById('btn-criar-conta').classList.toggle('hidden', sessaoAtual.tipo !== 'admin');

  carregarSolicitacoes();
  carregarUnidades();
}

// Tenta restaurar sessão salva ao abrir a página
async function tentarRestaurarSessao() {
  const salvo = localStorage.getItem(CHAVE_SESSAO);
  if (!salvo) return;

  try {
    const sessao = JSON.parse(salvo);
    if (sessao.tipo === 'admin') {
      // Confirma que a sessão do Supabase Auth ainda está válida
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session && data.session.user && data.session.user.id === ID_SUPER_ADMIN) {
        sessaoAtual = sessao;
        entrarNoApp();
      } else {
        localStorage.removeItem(CHAVE_SESSAO);
      }
    } else {
      // Conta simples: não tem como "revalidar" sem senha salva, então
      // confia na sessão local (é o mesmo nível de simplicidade pedido).
      sessaoAtual = sessao;
      entrarNoApp();
    }
  } catch (e) {
    localStorage.removeItem(CHAVE_SESSAO);
  }
}

// ---------------------------------------------------------------------------
// UNIDADES (lidas do sistema de RH, só leitura, mesmo projeto Supabase)
// ---------------------------------------------------------------------------
let todasUnidadesCache = null;       // lista só com os nomes (pra <select>/checkboxes)
let unidadesComEnderecoCache = null; // nome + endereço (pra autopreencher cidade/UF)

async function buscarTodasUnidadesComEndereco() {
  if (unidadesComEnderecoCache) return unidadesComEnderecoCache;
  const { data, error } = await supabaseClient
    .from('unidades_oficiais')
    .select('nome, endereco')
    .eq('ativo', true)
    .order('nome');
  if (error) throw error;
  unidadesComEnderecoCache = data || [];
  return unidadesComEnderecoCache;
}

async function buscarTodasUnidades() {
  if (todasUnidadesCache) return todasUnidadesCache;
  const comEndereco = await buscarTodasUnidadesComEndereco();
  todasUnidadesCache = comEndereco.map(u => u.nome);
  return todasUnidadesCache;
}

// ---------------------------------------------------------------------
// Extrai Cidade e UF do texto de endereço salvo em unidades_oficiais
// (formato padrão do sistema de RH: "Rua X, Nº 123 - Bairro, Cidade -
// CEP: 00000-000"). Se não bater no formato exato, tenta um jeito mais
// solto antes de desistir — nesse caso o campo fica em branco pra
// preencher na mão mesmo (mais seguro que preencher errado).
// ---------------------------------------------------------------------
const UFS_BRASIL = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

function detectarUFDoEndereco(endereco) {
  if (!endereco) return '';
  const txt = String(endereco).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();

  const achadas = txt.match(/(?:^|[^A-Z])([A-Z]{2})(?![A-Z])/g) || [];
  for (const bruto of achadas) {
    const sigla = bruto.replace(/[^A-Z]/g, '');
    if (UFS_BRASIL.includes(sigla)) return sigla;
  }

  const porExtenso = {
    'SAO PAULO': 'SP', 'RIO DE JANEIRO': 'RJ', 'MINAS GERAIS': 'MG',
    'ESPIRITO SANTO': 'ES', 'PARANA': 'PR', 'SANTA CATARINA': 'SC',
    'RIO GRANDE DO SUL': 'RS', 'RONDONIA': 'RO', 'BAHIA': 'BA',
    'GOIAS': 'GO', 'MATO GROSSO DO SUL': 'MS', 'MATO GROSSO': 'MT'
  };
  for (const nomeEstado in porExtenso) {
    if (txt.indexOf(nomeEstado) !== -1) return porExtenso[nomeEstado];
  }
  return '';
}

function extrairCidadeDoEndereco(endereco) {
  if (!endereco) return '';

  // Formato padrão: "..., Bairro, Cidade - CEP: ....."  ou  "..., Cidade/UF"
  const semCep = String(endereco).split(' - CEP:')[0];
  const partes = semCep.split(',').map(p => p.trim()).filter(Boolean);
  if (partes.length === 0) return '';

  let cidade = partes[partes.length - 1];
  // Se o último pedaço vier como "Cidade - SP" ou "Cidade/SP", tira a UF do final
  cidade = cidade.replace(/\s*[-/]\s*[A-Za-z]{2}$/, '').trim();
  return cidade;
}

// Preenche Cidade/Estado sozinho quando o usuário escolhe a Unidade
async function autoPreencherCidadeEstado() {
  const nomeUnidade = document.getElementById('sol-unidade').value;
  const campoCidade = document.getElementById('sol-cidade');
  const campoEstado = document.getElementById('sol-estado');
  if (!nomeUnidade) return;

  try {
    const lista = await buscarTodasUnidadesComEndereco();
    const unidade = lista.find(u => u.nome === nomeUnidade);
    if (!unidade || !unidade.endereco) return;

    const cidade = extrairCidadeDoEndereco(unidade.endereco);
    const uf = detectarUFDoEndereco(unidade.endereco);

    if (cidade) campoCidade.value = cidade;
    if (uf) campoEstado.value = uf;
  } catch (e) {
    console.warn('Não foi possível auto-preencher cidade/estado:', e);
  }
}

// Busca, na tabela de RH, os colaboradores ativos da unidade escolhida
// com cargo de PJ Manutenção, pra preencher o select de "Responsável".
async function carregarResponsaveisManutencao() {
  const nomeUnidade = document.getElementById('sol-unidade').value;
  const select = document.getElementById('sol-responsavel');

  if (!nomeUnidade) {
    select.innerHTML = '<option value="">Selecione a unidade primeiro...</option>';
    return;
  }

  select.innerHTML = '<option value="">Carregando...</option>';

  try {
    const { data, error } = await supabaseClient.rpc('listar_responsaveis_manutencao', {
      p_conta_id: sessaoAtual.conta_id,
      p_unidade: nomeUnidade
    });
    if (error) throw error;

    if (!data || data.length === 0) {
      select.innerHTML = '<option value="">Nenhum PJ Manutenção cadastrado nessa unidade</option>';
      return;
    }

    select.innerHTML = '<option value="">Selecione o responsável...</option>' +
      data.map(p => `<option value="${p.id}" data-nome="${escaparHtml(p.nome)}">${escaparHtml(p.nome)}</option>`).join('');
  } catch (e) {
    console.error('Erro ao carregar responsáveis:', e);
    select.innerHTML = '<option value="">Não foi possível carregar</option>';
  }
}

// Preenche o <select> de unidade do formulário de Nova Solicitação.
// Admin vê TODAS as unidades. Conta comum só vê as unidades liberadas
// pra ela (definidas pelo Super Admin ao criar/editar a conta).
async function carregarUnidades() {
  const select = document.getElementById('sol-unidade');
  try {
    const todas = await buscarTodasUnidades();
    const permitidas = (sessaoAtual.tipo === 'admin')
      ? todas
      : todas.filter(nome => (sessaoAtual.unidades || []).includes(nome));

    if (permitidas.length === 0) {
      select.innerHTML = '<option value="">Nenhuma unidade liberada pra essa conta — avise o Super Admin</option>';
      return;
    }

    select.innerHTML = '<option value="">Selecione a unidade...</option>' +
      permitidas.map(nome => `<option value="${escaparHtml(nome)}">${escaparHtml(nome)}</option>`).join('');
  } catch (e) {
    console.error('Erro ao carregar unidades:', e);
    select.innerHTML = '<option value="">Não foi possível carregar as unidades</option>';
  }
}

// Preenche a lista de checkboxes de unidade no formulário de Criar/Editar
// Conta. Aqui SEMPRE mostra todas as unidades (é o Super Admin escolhendo
// quais liberar pra conta), marcando as que já estiverem selecionadas.
async function carregarUnidadesCheckbox(unidadesJaMarcadas) {
  const box = document.getElementById('conta-unidades-lista');
  try {
    const todas = await buscarTodasUnidades();
    const marcadas = new Set(unidadesJaMarcadas || []);

    if (todas.length === 0) {
      box.innerHTML = '<p class="vazio" style="padding:8px 0;">Nenhuma unidade cadastrada no RH.</p>';
      return;
    }

    box.innerHTML = todas.map(nome => `
      <label>
        <input type="checkbox" class="chk-unidade-conta" value="${escaparHtml(nome)}" ${marcadas.has(nome) ? 'checked' : ''}>
        ${escaparHtml(nome)}
      </label>
    `).join('');
  } catch (e) {
    console.error('Erro ao carregar unidades:', e);
    box.innerHTML = '<p class="vazio" style="padding:8px 0;">Não foi possível carregar as unidades.</p>';
  }
}

function pegarUnidadesMarcadas() {
  return Array.from(document.querySelectorAll('.chk-unidade-conta:checked')).map(chk => chk.value);
}

// ---------------------------------------------------------------------------
// SOLICITAÇÕES
// ---------------------------------------------------------------------------
async function carregarSolicitacoes() {
  const corpo = document.getElementById('corpo-tabela-solicitacoes');
  corpo.innerHTML = '<tr><td colspan="5" class="vazio">Carregando...</td></tr>';

  try {
    const { data, error } = await supabaseClient.rpc('listar_solicitacoes_servico', {
      p_conta_id: sessaoAtual.conta_id
    });

    if (error) throw error;

    if (!data || data.length === 0) {
      corpo.innerHTML = '<tr><td colspan="5" class="vazio">Nenhuma solicitação encontrada ainda.</td></tr>';
      return;
    }

    corpo.innerHTML = data.map(s => `
      <tr>
        <td>${formatarDataBR(s.data)}</td>
        <td>${escaparHtml(s.unidade)}</td>
        <td>${escaparHtml((s.servicos_setor || '').slice(0, 60))}${(s.servicos_setor || '').length > 60 ? '...' : ''}</td>
        <td><span class="badge badge-${s.urgencia}">${escaparHtml(s.urgencia)}</span></td>
        <td><span class="badge badge-status">${escaparHtml(s.status)}</span></td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
    corpo.innerHTML = '<tr><td colspan="5" class="vazio">Erro ao carregar solicitações.</td></tr>';
  }
}

function abrirModalNovaSolicitacao() {
  document.getElementById('form-nova-solicitacao').reset();
  document.getElementById('sol-data').value = new Date().toISOString().split('T')[0];
  document.getElementById('sol-solicitante').value = sessaoAtual.nome;
  document.getElementById('sol-responsavel').innerHTML = '<option value="">Selecione a unidade primeiro...</option>';
  document.getElementById('modal-nova-solicitacao').classList.remove('hidden');
}

async function salvarSolicitacao(e) {
  e.preventDefault();
  const urgenciaEl = document.querySelector('input[name="sol-urgencia"]:checked');

  const selectResponsavel = document.getElementById('sol-responsavel');
  const opcaoResponsavel = selectResponsavel.options[selectResponsavel.selectedIndex];
  const responsavelId = selectResponsavel.value || null;
  const responsavelNome = (opcaoResponsavel && opcaoResponsavel.dataset && opcaoResponsavel.dataset.nome)
    ? opcaoResponsavel.dataset.nome
    : null;

  try {
    const { error } = await supabaseClient.rpc('criar_solicitacao_servico', {
      p_conta_id: sessaoAtual.conta_id,
      p_solicitante_nome: document.getElementById('sol-solicitante').value.trim(),
      p_unidade: document.getElementById('sol-unidade').value,
      p_cidade: document.getElementById('sol-cidade').value.trim() || null,
      p_estado: document.getElementById('sol-estado').value.trim().toUpperCase() || null,
      p_servicos_setor: document.getElementById('sol-servicos').value.trim(),
      p_responsavel_servico: responsavelNome,
      p_urgencia: urgenciaEl ? urgenciaEl.value : 'Baixa',
      p_responsavel_colaborador_id: responsavelId
    });

    if (error) throw error;

    fecharModal('modal-nova-solicitacao');
    carregarSolicitacoes();
  } catch (e) {
    alert('Erro ao salvar: ' + (e.message || e));
  }
}

// ---------------------------------------------------------------------------
// CONTAS (só Super Admin)
// ---------------------------------------------------------------------------
let contasCache = []; // guarda o último "listar_contas_servico" pra alimentar a edição sem buscar de novo

function abrirModalContas() {
  cancelarEdicaoConta();
  document.getElementById('modal-contas').classList.remove('hidden');
  carregarContas();
}

async function carregarContas() {
  const lista = document.getElementById('lista-contas');
  lista.innerHTML = '<p class="vazio">Carregando contas...</p>';

  try {
    const { data, error } = await supabaseClient.rpc('listar_contas_servico');
    if (error) throw error;

    contasCache = data || [];

    if (contasCache.length === 0) {
      lista.innerHTML = '<p class="vazio">Nenhuma conta criada ainda.</p>';
      return;
    }

    lista.innerHTML = contasCache.map(c => `
      <div class="conta-item ${c.ativo ? '' : 'inativa'}">
        <div class="conta-topo">
          <div>
            <div class="nome">${escaparHtml(c.nome)}</div>
            <div class="usuario">usuário: ${escaparHtml(c.usuario)} ${c.ativo ? '' : '(desativada)'}</div>
          </div>
          <div class="conta-acoes">
            <button class="toggle-btn" onclick="prepararEdicaoConta('${c.id}')">Editar</button>
            <button class="toggle-btn" onclick="alternarConta('${c.id}', ${!c.ativo})">
              ${c.ativo ? 'Desativar' : 'Ativar'}
            </button>
          </div>
        </div>
        <div>
          ${(c.unidades && c.unidades.length > 0)
            ? c.unidades.map(u => `<span class="tag-unidade">${escaparHtml(u)}</span>`).join('')
            : '<span class="tag-unidade" style="background:rgba(220,53,69,0.15); color:#dc3545;">Nenhuma unidade liberada</span>'}
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    lista.innerHTML = '<p class="vazio">Erro ao carregar contas.</p>';
  }
}

// Preenche o formulário com os dados de uma conta existente pra editar
function prepararEdicaoConta(id) {
  const conta = contasCache.find(c => c.id === id);
  if (!conta) return;

  document.getElementById('conta-id-edicao').value = conta.id;
  document.getElementById('conta-nome').value = conta.nome;
  document.getElementById('conta-usuario').value = conta.usuario;
  document.getElementById('conta-senha').value = '';
  document.getElementById('label-conta-senha').textContent = 'Nova senha (deixe em branco pra manter a mesma)';
  document.getElementById('titulo-form-conta').textContent = 'Editar Conta — ' + conta.nome;
  document.getElementById('btn-salvar-conta').textContent = 'Salvar Alterações';
  document.getElementById('btn-cancelar-edicao-conta').classList.remove('hidden');

  carregarUnidadesCheckbox(conta.unidades || []);

  document.getElementById('form-nova-conta').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelarEdicaoConta() {
  document.getElementById('form-nova-conta').reset();
  document.getElementById('conta-id-edicao').value = '';
  document.getElementById('label-conta-senha').textContent = 'Senha';
  document.getElementById('conta-senha').setAttribute('required', 'required');
  document.getElementById('titulo-form-conta').textContent = 'Nova Conta de Acesso';
  document.getElementById('btn-salvar-conta').textContent = '+ Criar Conta';
  document.getElementById('btn-cancelar-edicao-conta').classList.add('hidden');
  carregarUnidadesCheckbox([]);
}

// Um único form serve pra criar E editar — decide qual RPC chamar
// olhando se tem um id de edição guardado no campo escondido.
async function salvarConta(e) {
  e.preventDefault();
  const idEdicao = document.getElementById('conta-id-edicao').value;
  const unidadesMarcadas = pegarUnidadesMarcadas();

  if (unidadesMarcadas.length === 0) {
    alert('Selecione pelo menos uma unidade pra essa conta.');
    return;
  }

  try {
    if (idEdicao) {
      const { error } = await supabaseClient.rpc('editar_conta_servico', {
        p_conta_id: idEdicao,
        p_nome: document.getElementById('conta-nome').value.trim(),
        p_usuario: document.getElementById('conta-usuario').value.trim(),
        p_senha: document.getElementById('conta-senha').value || null,
        p_unidades: unidadesMarcadas
      });
      if (error) throw error;
    } else {
      if (!document.getElementById('conta-senha').value) {
        alert('Informe uma senha pra conta nova.');
        return;
      }
      const { error } = await supabaseClient.rpc('criar_conta_servico', {
        p_usuario: document.getElementById('conta-usuario').value.trim(),
        p_senha: document.getElementById('conta-senha').value,
        p_nome: document.getElementById('conta-nome').value.trim(),
        p_unidades: unidadesMarcadas
      });
      if (error) throw error;
    }

    cancelarEdicaoConta();
    carregarContas();
  } catch (e) {
    alert('Erro ao salvar conta: ' + (e.message || e));
  }
}

async function alternarConta(id, novoAtivo) {
  try {
    const { error } = await supabaseClient.rpc('alternar_conta_servico', {
      p_conta_id: id,
      p_ativo: novoAtivo
    });
    if (error) throw error;
    carregarContas();
  } catch (e) {
    alert('Erro: ' + (e.message || e));
  }
}

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function fecharModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function escaparHtml(str) {
  if (str === null || str === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function formatarDataBR(iso) {
  if (!iso) return '—';
  const p = String(iso).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}

// Fecha modal clicando fora
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => {
    if (e.target === ov) ov.classList.add('hidden');
  });
});

// Enter no login
document.getElementById('login-senha').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fazerLogin();
});

// Inicialização
tentarRestaurarSessao();
</script>
