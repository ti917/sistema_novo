<div class="controls-escala" style="background: rgba(255, 152, 0, 0.05); border: 1px solid rgba(255, 152, 0, 0.3); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;">
    
    <div style="display: flex; gap: 15px; flex: 1; flex-wrap: wrap; min-width: 300px;">
        
        <div class="input-wrapper" style="flex: 1; min-width: 150px;">
            <i class="fa-regular fa-calendar"></i>
            <input type="date" id="vr-data-inicio" title="Início da Apuração" onclick="this.showPicker()" style="width: 100%;">
        </div>
        
        <div class="input-wrapper" style="flex: 1; min-width: 150px;">
            <i class="fa-regular fa-calendar"></i>
            <input type="date" id="vr-data-fim" title="Fim da Apuração" onclick="this.showPicker()" style="width: 100%;">
        </div>
        
        <div class="input-wrapper" style="flex: 2; min-width: 250px;">
            <i class="fa-solid fa-map-marker-alt"></i>
            <select id="vr-unidade" style="width: 100%;">
                <option value="">Carregando...</option>
            </select>
        </div>
        
    </div>
    
    <div style="display: flex; gap: 15px; align-items: center;">
        <button class="btn-success" style="background-color: #ff9800; color: #000; border: none; padding: 12px 25px;" onclick="calcularVRAgora()">
            <i class="fa-solid fa-calculator"></i> Calcular VR
        </button>
        <button id="btn-exportar-vr" class="btn-secondary hidden" style="border-color: #ff9800; color: #ff9800; padding: 12px 20px;" onclick="exportarExcelVR()">
            <i class="fa-solid fa-file-excel"></i> Exportar Excel
        </button>
    </div>
    
</div>
